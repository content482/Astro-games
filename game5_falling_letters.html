<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Astro's Falling Letters</title>
<style>
  :root{
    --astro-green:#7ED957;
    --fuel-amber:#FFC93C;
    --ui-cyan:#5FD9E8;
    --white:#F4F7FF;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background:#000;
    font-family:'Baloo 2','Trebuchet MS','Verdana',sans-serif;
    overflow:hidden; touch-action:manipulation;
  }
  #game-container{
    position:relative; width:100%; height:100vh; min-height:460px;
    background:#000;
    overflow:hidden; user-select:none;
    display:flex; align-items:center; justify-content:center;
  }

  #kbd-wrap{
    position:relative;
    aspect-ratio: 1500 / 1534;
    max-width:100%;
    max-height:100%;
    width:100%;
  }
  #kbd-img{ position:absolute; inset:0; width:100%; height:100%; display:block; }

  #fall-layer{ position:absolute; left:0; top:0; width:100%; height:72%; overflow:visible; }
  .falling-letter{
    position:absolute; top:-6%;
    width:7.5%; aspect-ratio:1/1;
    border-radius:20%;
    display:flex; align-items:center; justify-content:center;
    font-size:3vw; font-weight:800;
    background:rgba(20,26,61,0.85); border:2px solid rgba(95,217,232,0.7); color:var(--white);
  }
  .falling-letter.collecting{
    transition:opacity 0.4s, transform 0.4s;
    transition-delay:0.05s;
    transform:scale(0.3);
    opacity:0;
  }
  .falling-letter.missed{
    transition:opacity 0.5s;
    opacity:0;
  }

  .key-hotspot{
    position:absolute;
    cursor:pointer;
    border-radius:14%;
    background:rgba(255,255,255,0);
    border:2px solid rgba(255,255,255,0);
    transition:background .1s, border-color .1s;
  }
  .key-hotspot.correct-flash{
    background:rgba(126,217,87,0.55) !important;
    border-color:rgba(126,217,87,0.95) !important;
    box-shadow:0 0 14px rgba(126,217,87,0.8);
  }
  .key-hotspot.wrong-flash{
    animation:keyWrongShake 0.35s;
    background:rgba(255,122,89,0.5) !important;
    border-color:rgba(255,122,89,0.85) !important;
  }
  @keyframes keyWrongShake{ 0%,100%{transform:translateX(0);} 25%{transform:translateX(-3%);} 75%{transform:translateX(3%);} }

  #score-badge{
    position:absolute; top:10px; left:10px; z-index:20;
    background:rgba(10,14,40,0.75); border:2px solid rgba(126,217,87,0.55);
    color:var(--white); font-weight:800; font-size:14px; padding:6px 14px; border-radius:999px;
    text-shadow:0 1px 3px rgba(0,0,0,0.6);
  }
  #timer-badge{
    position:absolute; top:10px; right:10px; z-index:20;
    background:rgba(10,14,40,0.75); border:2px solid rgba(255,201,60,0.55);
    color:var(--white); font-weight:800; font-size:14px; padding:6px 14px; border-radius:999px;
  }
  #timer-badge.low-time{ border-color:rgba(255,122,89,0.9); color:#FFB199; }

  #particles-layer{ position:absolute; inset:0; pointer-events:none; z-index:25; overflow:hidden; }
  .confetti{ position:absolute; width:8px; height:8px; border-radius:2px; top:0; left:0; }

  .overlay{
    position:absolute; inset:0; z-index:30;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; gap:16px; padding:24px;
    background:radial-gradient(ellipse at center, rgba(20,26,72,0.92) 0%, rgba(7,10,34,0.97) 78%);
  }
  .hidden{ display:none !important; }
  .overlay h1{ color:var(--white); font-size:clamp(26px,6vw,42px); margin:0; }
  .overlay p.sub{ color:#C7CFF2; font-size:clamp(14px,3vw,17px); max-width:420px; margin:0; line-height:1.5; }
  .big-btn{
    font-family:inherit; font-size:22px; font-weight:800; color:#08340C;
    background:linear-gradient(180deg,#9BEE6E,var(--astro-green) 60%,#4FA82E);
    border:none; border-radius:999px; padding:16px 44px; cursor:pointer;
    box-shadow:0 6px 0 #2F6B1B, 0 10px 18px rgba(0,0,0,0.35);
  }
  .big-btn:active{ transform:translateY(4px); box-shadow:0 2px 0 #2F6B1B; }
  .ghost-btn{
    font-family:inherit; font-size:15px; font-weight:700; color:var(--ui-cyan);
    background:transparent; border:2px solid rgba(95,217,232,0.5); border-radius:999px; padding:10px 22px; cursor:pointer;
  }
</style>
</head>

<script>
(function(){
  "use strict";
  function boot(){

    function speakFallback(text){
      try{
        if('speechSynthesis' in window){
          window.speechSynthesis.cancel();
          var u = new SpeechSynthesisUtterance(text);
          u.rate = 0.8; u.pitch = 1.05; u.lang = 'en-US';
          window.speechSynthesis.speak(u);
        }
      }catch(e){}
    }
    function speakLetter(letter){ speakFallback(letter); }

    var AudioCtx = window.AudioContext || window.webkitAudioContext;
    var actx=null;
    function tone(freq,dur,type,vol){
      try{
        if(!actx) actx=new AudioCtx();
        var o=actx.createOscillator(), g=actx.createGain();
        o.type=type||'sine'; o.frequency.value=freq; g.gain.value=vol!=null?vol:0.15;
        o.connect(g); g.connect(actx.destination);
        var now=actx.currentTime;
        g.gain.setValueAtTime(g.gain.value,now);
        g.gain.exponentialRampToValueAtTime(0.001,now+dur);
        o.start(now); o.stop(now+dur);
      }catch(e){}
    }
    function sfxCollect(){ tone(880,0.12,'triangle',0.18); setTimeout(function(){tone(1320,0.12,'triangle',0.15);},70); }
    function sfxTry(){ tone(300,0.1,'sine',0.08); }
    function sfxSuccess(){ [523,659,784,1047].forEach(function(f,i){ setTimeout(function(){tone(f,0.28,'triangle',0.16);},i*110); }); }

    var container = document.getElementById('game-container');
    var kbdWrap = document.getElementById('kbd-wrap');
    var fallLayer = document.getElementById('fall-layer');
    var W=0,H=0;
    function resize(){ var r = kbdWrap.getBoundingClientRect(); W = r.width; H = r.height; }
    window.addEventListener('resize', resize);

    /* =========================================================
       Precise positions of every real letter key in the photo,
       measured directly from the image (percent of the photo's
       own box, so they stay aligned at any display size).
    ========================================================= */
    var KEY_POS = {
      A: {left:12.867, top:85.919, width:6.133, height:3.194},
      B: {left:42.8, top:89.765, width:6.133, height:3.194},
      C: {left:29.533, top:89.765, width:6.0, height:3.194},
      D: {left:26.067, top:85.919, width:6.067, height:3.194},
      E: {left:24.333, top:82.073, width:5.933, height:3.194},
      F: {left:32.667, top:85.919, width:6.133, height:3.194},
      G: {left:39.4, top:85.919, width:6.0, height:3.194},
      H: {left:45.867, top:85.919, width:6.067, height:3.194},
      I: {left:57.133, top:82.073, width:6.0, height:3.194},
      J: {left:52.467, top:85.919, width:6.067, height:3.194},
      K: {left:59.133, top:85.919, width:5.933, height:3.194},
      L: {left:65.667, top:85.919, width:6.067, height:3.194},
      M: {left:56.067, top:89.765, width:6.067, height:3.194},
      N: {left:49.467, top:89.765, width:6.0, height:3.194},
      O: {left:63.667, top:82.073, width:6.067, height:3.194},
      P: {left:70.267, top:82.073, width:6.0, height:3.194},
      Q: {left:11.267, top:82.073, width:5.933, height:3.194},
      R: {left:30.867, top:82.073, width:6.067, height:3.194},
      S: {left:19.6, top:85.919, width:5.867, height:3.194},
      T: {left:37.467, top:82.073, width:6.0, height:3.194},
      U: {left:50.6, top:82.073, width:6.0, height:3.194},
      V: {left:36.133, top:89.765, width:6.133, height:3.194},
      W: {left:17.733, top:82.073, width:6.067, height:3.194},
      X: {left:22.933, top:89.765, width:6.067, height:3.194},
      Y: {left:44.0, top:82.073, width:5.933, height:3.194},
      Z: {left:16.267, top:89.765, width:6.133, height:3.194}
    };

    var keyEls = {};
    function buildHotspots(){
      var layer = document.getElementById('hotspot-layer');
      layer.innerHTML = '';
      Object.keys(KEY_POS).forEach(function(letter){
        var p = KEY_POS[letter];
        var el = document.createElement('div');
        el.className = 'key-hotspot';
        el.style.left = p.left+'%';
        el.style.top = p.top+'%';
        el.style.width = p.width+'%';
        el.style.height = p.height+'%';
        el.dataset.letter = letter;
        el.addEventListener('click', function(){ tryLetter(letter); });
        layer.appendChild(el);
        keyEls[letter] = el;
      });
    }

    var LETTER_POOL = ['H','G','F','N','M','L','W','A','E','Y','O','I','S','T','B'];
    var SPAWN_INTERVAL_MS = 2500;
    var MAX_ONSCREEN = 5;
    var DURATION_MS = 120000; /* 2 minutes - change this one number to adjust length */

    var fallingObjs = [];   /* each: {el, letter, x, y, speed} */
    var collectingObjs = []; /* each: {el, fromX, fromY, toX, toY, t, duration} */
    var score = 0;
    var gameActive = false;
    var spawnTimer = 0;
    var elapsedMs = 0;
    var COLLECT_POINT = { xPct: 50, yPct: 71.4 };

    function currentFallingLetters(){
      return fallingObjs.map(function(o){ return o.letter; });
    }

    function pickSpawnLetter(){
      var onscreen = currentFallingLetters();
      var pool = LETTER_POOL.filter(function(l){ return onscreen.indexOf(l) === -1; });
      if(pool.length === 0) pool = LETTER_POOL.slice();
      return pool[Math.floor(Math.random()*pool.length)];
    }

    function spawnLetter(){
      if(fallingObjs.length >= MAX_ONSCREEN) return;
      var letter = pickSpawnLetter();
      var el = document.createElement('div');
      el.className = 'falling-letter';
      el.textContent = letter;
      fallLayer.appendChild(el);
      var x = clamp(rand(4, 88), 4, 88);
      var y = -6;
      el.style.left = x+'%';
      el.style.top = y+'%';
      var speedBase = 34 + Math.random()*10; /* gentle, generous fall speed */
      fallingObjs.push({ el:el, letter:letter, x:x, y:y, speed:speedBase });
      speakLetter(letter);
    }

    function rand(a,b){ return a + Math.random()*(b-a); }
    function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
    function lerp(a,b,t){ return a+(b-a)*t; }

    function flashKey(letter, className, duration){
      var el = keyEls[letter];
      if(!el) return;
      el.classList.remove(className); void el.offsetWidth; el.classList.add(className);
      setTimeout(function(){ el.classList.remove(className); }, duration || 400);
    }

    function updateScore(){
      document.getElementById('score-badge').textContent = '\u2b50 Score: '+score;
    }

    function tryLetter(letter){
      if(!gameActive) return;
      var match = null;
      for(var i=0;i<fallingObjs.length;i++){
        if(fallingObjs[i].letter === letter){ match = fallingObjs[i]; break; }
      }
      if(match){
        flashKey(letter, 'correct-flash', 700);
        collectLetter(match);
      } else {
        sfxTry();
        flashKey(letter, 'wrong-flash', 350);
      }
    }

    function collectLetter(obj){
      fallingObjs = fallingObjs.filter(function(o){ return o !== obj; });
      score++;
      updateScore();
      obj.el.classList.add('collecting');
      collectingObjs.push({ el:obj.el, fromX:obj.x, fromY:obj.y, toX:COLLECT_POINT.xPct, toY:COLLECT_POINT.yPct, t:0, duration:0.45 });

      sfxCollect();
      var cr = kbdWrap.getBoundingClientRect();
      confettiBurst({ x:(COLLECT_POINT.xPct/100)*cr.width, y:(COLLECT_POINT.yPct/100)*cr.height });
    }

    var lastT = null;
    function loop(ts){
      if(lastT === null) lastT = ts;
      var dt = Math.min((ts-lastT)/1000, 0.05);
      lastT = ts;

      if(gameActive){
        elapsedMs += dt*1000;
        updateTimerUI();

        spawnTimer += dt*1000;
        if(elapsedMs < DURATION_MS && spawnTimer >= SPAWN_INTERVAL_MS){
          spawnTimer = 0;
          spawnLetter();
        }

        var pctPerSec = H > 0 ? (1 / H) * 100 : 0.12;

        for(var i=fallingObjs.length-1;i>=0;i--){
          var o = fallingObjs[i];
          o.y += o.speed*pctPerSec*dt;
          if(o.y > 62){
            o.el.classList.add('missed');
            (function(el){ setTimeout(function(){ el.remove(); }, 550); })(o.el);
            fallingObjs.splice(i,1);
            continue;
          }
          o.el.style.left = o.x+'%';
          o.el.style.top = o.y+'%';
        }

        for(var j=collectingObjs.length-1;j>=0;j--){
          var c = collectingObjs[j];
          c.t += dt;
          var p = Math.min(c.t/c.duration, 1);
          var cx = lerp(c.fromX, c.toX, p);
          var cy = lerp(c.fromY, c.toY, p);
          c.el.style.left = cx+'%';
          c.el.style.top = cy+'%';
          if(p >= 1){
            c.el.remove();
            collectingObjs.splice(j,1);
          }
        }

        if(elapsedMs >= DURATION_MS && fallingObjs.length === 0 && collectingObjs.length === 0){
          finishGame();
        }
      }
      requestAnimationFrame(loop);
    }

    function updateTimerUI(){
      var remainMs = Math.max(0, DURATION_MS - elapsedMs);
      var totalSec = Math.ceil(remainMs/1000);
      var mm = Math.floor(totalSec/60);
      var ss = totalSec%60;
      var badge = document.getElementById('timer-badge');
      badge.textContent = '\u23f1 ' + mm + ':' + (ss<10?'0':'') + ss;
      badge.classList.toggle('low-time', remainMs <= 15000);
    }

    function confettiBurst(p){
      var layer = document.getElementById('particles-layer');
      var cr = container.getBoundingClientRect();
      var wr = kbdWrap.getBoundingClientRect();
      var offX = wr.left - cr.left, offY = wr.top - cr.top;
      var colors = ['#FFC93C','#7ED957','#5FD9E8','#F4F7FF'];
      for(var i=0;i<14;i++){
        var el = document.createElement('div');
        el.className='confetti';
        el.style.background = colors[i%colors.length];
        el.style.left = (offX+p.x)+'px'; el.style.top = (offY+p.y)+'px';
        layer.appendChild(el);
        var ang = Math.random()*Math.PI*2;
        var dist = 30+Math.random()*50;
        var dx = Math.cos(ang)*dist, dy = Math.sin(ang)*dist - 20;
        el.animate([
          { transform:'translate(0,0) rotate(0deg)', opacity:1 },
          { transform:'translate('+dx+'px,'+dy+'px) rotate('+(Math.random()*360)+'deg)', opacity:0 }
        ], { duration:600+Math.random()*250, easing:'ease-out' });
        setTimeout(function(el2){ return function(){ el2.remove(); }; }(el), 950);
      }
    }

    window.addEventListener('keydown', function(e){
      var k = e.key ? e.key.toUpperCase() : '';
      if(k.length === 1 && k >= 'A' && k <= 'Z'){
        tryLetter(k);
      }
    });

    function finishGame(){
      gameActive = false;
      sfxSuccess();
      document.getElementById('end-score').textContent = 'You collected '+score+' letter'+(score===1?'':'s')+'!';
      document.getElementById('end-overlay').classList.remove('hidden');
    }

    function resetGame(){
      resize();
      fallLayer.innerHTML = '';
      fallingObjs = [];
      collectingObjs = [];
      score = 0;
      elapsedMs = 0;
      spawnTimer = SPAWN_INTERVAL_MS; /* spawn first letter almost immediately */
      updateScore();
      updateTimerUI();
      gameActive = true;
    }

    document.getElementById('start-btn').addEventListener('click', function(){
      document.getElementById('start-overlay').classList.add('hidden');
      resetGame();
    });
    document.getElementById('replay-btn').addEventListener('click', function(){
      document.getElementById('end-overlay').classList.add('hidden');
      resetGame();
    });
    document.getElementById('continue-btn').addEventListener('click', function(){
      window.dispatchEvent(new CustomEvent('astroGame5Complete'));
      try{ window.parent.postMessage({type:'astroGame5Complete'}, '*'); }catch(e){}
    });

    buildHotspots();
    resize();
    requestAnimationFrame(loop);
  }
  if(document.readyState === "loading"){
    document.addEventListener("DOMContentLoaded", boot);
  } else {
    boot();
  }
})();
</script>
</body>
</html>
