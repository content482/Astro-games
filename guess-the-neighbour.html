<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Guess the Neighbour</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#13204a;touch-action:none;user-select:none;-webkit-user-select:none}
body{font-family:ui-rounded,"Arial Rounded MT Bold","Nunito","Varela Round","Trebuchet MS",system-ui,sans-serif;color:#1e2a5a}
#stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform-origin:center center;overflow:hidden;background:#bfe6ff;border-radius:6px}
#stage img{-webkit-user-drag:none;user-select:none;pointer-events:none}
.layer{position:absolute;inset:0}
.overlay{position:absolute;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;background:rgba(19,32,74,.62);text-align:center;padding:40px}
.overlay.hidden{display:none}
.ovcard{background:#fff;border-radius:44px;padding:48px 70px;box-shadow:0 18px 0 rgba(0,0,0,.18);max-width:1150px;display:flex;flex-direction:column;align-items:center;gap:22px}
.ovcard h1{margin:0;font-size:84px;line-height:1.05;color:#1e2a5a}
.ovcard p{margin:0;font-size:40px;line-height:1.3;color:#3b4a7a}
.bigbtn{font:inherit;font-size:58px;font-weight:800;color:#fff;background:#ff8a1f;border:0;border-radius:999px;padding:22px 80px;box-shadow:0 10px 0 #c95f00;cursor:pointer;letter-spacing:2px}
.bigbtn:active{transform:translateY(6px);box-shadow:0 4px 0 #c95f00}
.bigbtn.green{background:#2fbf71;box-shadow:0 10px 0 #1d8a4f}
.ph{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100%;border-radius:26px;background:rgba(255,255,255,.88);border:5px dashed #8fa2d6;color:#1e2a5a;font-weight:800;text-align:center;overflow:hidden;line-height:1}
.ph .e{font-size:1em}
.ph .w{font-size:.28em;margin-top:.08em;letter-spacing:1px}
.art{position:absolute;display:flex;align-items:flex-end;justify-content:center}
.art>img{width:100%;height:100%;object-fit:contain}
.wobble{animation:wob .5s}
@keyframes wob{0%,100%{translate:0 0;rotate:0deg}20%{translate:-14px 0;rotate:-4deg}40%{translate:12px 0;rotate:3deg}60%{translate:-8px 0;rotate:-2deg}80%{translate:5px 0;rotate:0deg}}
.bounce{animation:bnc .45s}
@keyframes bnc{0%,100%{scale:1}40%{scale:1.18}70%{scale:.95}}
.bubble{pointer-events:none;position:absolute;background:#fff;border-radius:34px;padding:18px 30px;font-size:42px;font-weight:800;box-shadow:0 8px 0 rgba(0,0,0,.15);z-index:40;white-space:nowrap}
#confetti{position:absolute;inset:0;pointer-events:none;z-index:120}
#soundHint{position:absolute;right:18px;top:14px;z-index:90;font-size:34px;background:rgba(255,255,255,.85);border-radius:999px;padding:6px 16px;display:none}

#bg{position:absolute;inset:0;background:linear-gradient(135deg,#ffe8c2,#ffd1dc 60%,#d7e3ff)}
#astro{position:absolute;left:10px;top:330px;width:270px;height:380px;z-index:5}
#astro .art{left:0;top:0}
#say{position:absolute;left:20px;top:150px;width:260px;min-height:120px;white-space:normal;text-align:center;font-size:40px;display:flex;align-items:center;justify-content:center}
#say:after{content:'';position:absolute;bottom:-26px;left:110px;border:16px solid transparent;border-top:18px solid #fff}
#grid{position:absolute;left:300px;top:22px;width:1285px;height:640px;display:grid;grid-template-columns:repeat(6,1fr);gap:16px}
.card{position:relative;perspective:1200px;cursor:pointer}
.card .in{position:absolute;inset:0;transition:transform .55s;transform-style:preserve-3d}
.card.down .in{transform:rotateY(180deg)}
.card .f,.card .b{position:absolute;inset:0;border-radius:22px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;box-shadow:0 7px 0 rgba(0,0,0,.15)}
.card .f{background:#fff;border:6px solid #fff}
.card .b{transform:rotateY(180deg);background:repeating-linear-gradient(45deg,#3d8bff 0 18px,#5aa0ff 18px 36px);border:6px solid #fff}
.card .pic{position:absolute;left:0;right:0;top:0;bottom:52px;background:#eaf2ff}
.card .pic .art{left:0;top:0}
.card .nm{position:absolute;left:0;right:0;bottom:6px;text-align:center;font-size:34px;font-weight:900}
.card.win .f{border-color:#ffd23f;box-shadow:0 0 0 8px #ffd23f,0 0 40px #ffd23f}
.card.mine .f{border-color:#2fbf71}
.fb{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.fb .face{font-size:84px}
.fb .wear{font-size:40px;margin-top:6px;display:flex;flex-wrap:wrap;justify-content:center;gap:2px;max-width:170px}
#qbar{position:absolute;left:300px;top:690px;width:1285px;height:190px;display:flex;gap:14px;justify-content:center}
.q{flex:1;max-width:200px;background:#fff;border:0;border-radius:28px;box-shadow:0 8px 0 rgba(0,0,0,.18);font:inherit;font-size:30px;font-weight:900;color:#1e2a5a;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:8px 6px 12px;cursor:pointer;position:relative}
.q .qi{position:relative;width:110px;height:110px}
.q .qi .art{left:0;top:0}
.q.used{opacity:.4}
.q:active{transform:translateY(5px);box-shadow:0 3px 0 rgba(0,0,0,.18)}
#yn{position:absolute;left:300px;top:690px;width:1285px;height:190px;display:none;gap:40px;justify-content:center;align-items:center}
#yn button{font:inherit;font-size:64px;font-weight:900;border:0;border-radius:999px;padding:24px 70px;color:#fff;cursor:pointer}
#yes{background:#2fbf71;box-shadow:0 10px 0 #1d8a4f}#no{background:#ff5d5d;box-shadow:0 10px 0 #c93838}
#banner{position:absolute;left:300px;top:690px;width:1285px;height:190px;display:none;align-items:center;justify-content:center;gap:30px;z-index:20}
#banner .msg{font-size:46px;font-weight:900;background:#fff;border-radius:30px;padding:20px 34px;box-shadow:0 8px 0 rgba(0,0,0,.15)}
</style></head>
<body>
<div id="stage">
  <div id="bg"></div>
  <div class="bubble" id="say">Hi!</div>
  <div id="astro"></div>
  <div id="grid"></div>
  <div id="qbar"></div>
  <div id="yn"><button id="yes">YES</button><button id="no">NO</button></div>
  <div id="banner"><div class="msg"></div></div>
</div>
<script>
var AUDIO={};
var PICS={ astro:'../images/astro.png',
  GLASSES:'../images/l3/glasses.png', HAT:'../images/l3/hat.png', SCARF:'../images/l3/scarf.png', COAT:'../images/l3/coat.png', JACKET:'../images/l3/jacket.png', DRESS:'../images/l3/dress.png' };
["noa","tom","maya","ben","lia","omer","yael","dan","shira","adam","mia","eli"].forEach(function(n){ PICS['kid_'+n]='../images/l3/kid_'+n+'.png'; });
</script>
<script>
/* ===== Astro & Alex shared game base ===== */
var G=(function(){
  var W=1600,H=900, stage=document.getElementById('stage'), scale=1;
  var DEBUG=/[?&]debug=1/.test(location.search);
  function fit(){
    scale=Math.min(window.innerWidth/W, window.innerHeight/H);
    stage.style.transform='translate(-50%,-50%) scale('+scale+')';
  }
  window.addEventListener('resize',fit); fit();
  function toStage(e){
    var r=stage.getBoundingClientRect();
    return {x:(e.clientX-r.left)/scale, y:(e.clientY-r.top)/scale};
  }
  /* ---------- speech: one queue, never overlapping ---------- */
  var AUDIO=window.AUDIO||{}; var voice=null; var queue=Promise.resolve(); var pending=0;
  function pickVoice(){
    if(!('speechSynthesis' in window)) return;
    var vs=speechSynthesis.getVoices().filter(function(v){return /^en[-_]US/i.test(v.lang);});
    var pref=['Samantha','Google US English','Microsoft Aria','Microsoft Jenny','Karen','Ava','Allison'];
    for(var i=0;i<pref.length;i++){ for(var j=0;j<vs.length;j++){ if(vs[j].name.indexOf(pref[i])>=0){voice=vs[j];return;} } }
    voice=vs[0]||null;
  }
  if('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged=pickVoice; }
  function speakNow(text){
    return new Promise(function(res){
      var done=false; function fin(){ if(!done){done=true; res();} }
      var safety=setTimeout(fin, 1800+text.length*95);
      var file=AUDIO[text];
      if(file){ var a=new Audio(file); a.onended=fin; a.onerror=fin; a.play().catch(fin); return; }
      if(!('speechSynthesis' in window)){ setTimeout(fin, 500+text.length*55); return; }
      var u=new SpeechSynthesisUtterance(text.replace(/\.\.\./g,', '));
      u.lang='en-US'; u.rate=0.9; u.pitch=1.05; if(voice) u.voice=voice;
      u.onend=function(){clearTimeout(safety); setTimeout(fin,120);}; u.onerror=function(){clearTimeout(safety); fin();};
      speechSynthesis.speak(u);
    });
  }
  function say(text){ pending++; queue=queue.then(function(){return speakNow(text);}).then(function(){pending--;}); return queue; }
  function sayIfFree(text){ if(pending>0) return queue; return say(text); }
  function busy(){ return pending>0; }
  /* ---------- sound effects ---------- */
  var ac=null;
  function audioInit(){ try{ if(!ac) ac=new (window.AudioContext||window.webkitAudioContext)(); if(ac.state==='suspended') ac.resume(); }catch(e){} }
  function tone(f,d,type,vol,f2,delay){
    if(!ac) return; var t=ac.currentTime+(delay||0);
    var o=ac.createOscillator(), g=ac.createGain(); o.type=type||'sine'; o.frequency.setValueAtTime(f,t);
    if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+d);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol||0.2,t+0.015); g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+d+0.05);
  }
  function noise(d,vol,freq,delay){
    if(!ac) return; var t=ac.currentTime+(delay||0), n=Math.floor(ac.sampleRate*d), b=ac.createBuffer(1,n,ac.sampleRate), ch=b.getChannelData(0);
    for(var i=0;i<n;i++) ch[i]=(Math.random()*2-1)*Math.sin(Math.PI*i/n);
    var s=ac.createBufferSource(); s.buffer=b; var f=ac.createBiquadFilter(); f.type='bandpass'; f.frequency.value=freq||800; f.Q.value=0.7;
    var g=ac.createGain(); g.gain.value=vol||0.3; s.connect(f); f.connect(g); g.connect(ac.destination); s.start(t);
  }
  var sfx={
    pop:function(){tone(520,0.12,'sine',0.25,980);},
    ding:function(){tone(1046,0.35,'triangle',0.2); tone(1568,0.4,'triangle',0.12,null,0.08);},
    boing:function(){tone(220,0.35,'square',0.08,520);},
    soft:function(){tone(300,0.15,'sine',0.12,240);},
    whoosh:function(){noise(0.9,0.35,600);},
    cheer:function(){[523,659,784,1046].forEach(function(f,i){tone(f,0.25,'triangle',0.18,null,i*0.09);});},
    flip:function(){noise(0.12,0.25,2500);},
    sparkle:function(){[1318,1568,2093].forEach(function(f,i){tone(f,0.18,'sine',0.1,null,i*0.06);});},
    thump:function(){tone(120,0.2,'sine',0.35,60);},
    click:function(){tone(900,0.05,'square',0.06);}
  };
  /* ---------- pictures with placeholders ---------- */
  var img={};
  function loadOne(paths){
    paths=[].concat(paths);
    return new Promise(function(res){
      var i=0; (function next(){
        if(i>=paths.length) return res(null);
        var im=new Image(); im.onload=function(){res(im);}; im.onerror=function(){i++; next();}; im.src=paths[i];
      })();
    });
  }
  function loadPics(P){
    var keys=Object.keys(P);
    return Promise.all(keys.map(function(k){return loadOne(P[k]).then(function(im){img[k]=im;});}));
  }
  /* art(key,{x,y,w,h,emoji,word,cls,parent,z}) -> absolutely positioned element with the picture or a placeholder */
  function art(key,o){
    o=o||{}; var d=document.createElement('div'); d.className='art '+(o.cls||'');
    if(o.w!=null){d.style.width=o.w+'px';} if(o.h!=null){d.style.height=o.h+'px';}
    if(o.x!=null) d.style.left=o.x+'px'; if(o.y!=null) d.style.top=o.y+'px'; if(o.z!=null) d.style.zIndex=o.z;
    var im=img[key];
    if(im){ var c=document.createElement('img'); c.src=im.src; c.alt=''; d.appendChild(c); d.dataset.real='1'; }
    else{ var p=document.createElement('div'); p.className='ph'; p.style.fontSize=Math.round(Math.min(o.w||160,o.h||160)*0.62)+'px';
      p.innerHTML='<div class="e">'+(o.emoji||'🖼️')+'</div>'+(o.word?'<div class="w">'+o.word+'</div>':''); d.appendChild(p); }
    (o.parent||stage).appendChild(d); return d;
  }
  function has(key){ return !!img[key]; }
  /* ---------- helpers ---------- */
  function wait(ms){return new Promise(function(r){setTimeout(r,ms);});}
  function shuffle(a){a=a.slice(); for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t;} return a;}
  function rand(a,b){return a+Math.random()*(b-a);}
  function el(tag,cls,parent,html){var e=document.createElement(tag); if(cls)e.className=cls; if(html!=null)e.innerHTML=html; (parent||stage).appendChild(e); return e;}
  function anim(e,cls){ e.classList.remove(cls); void e.offsetWidth; e.classList.add(cls); setTimeout(function(){e.classList.remove(cls);},600); }
  /* ---------- confetti ---------- */
  var cv=el('canvas',''); cv.id='confetti'; cv.width=W; cv.height=H; var cx=cv.getContext('2d'), parts=[], running=false;
  function confetti(n){
    var cols=['#ff8a1f','#2fbf71','#3d8bff','#ffd23f','#ff5d8f','#9b5de5'];
    for(var i=0;i<(n||160);i++) parts.push({x:rand(0,W),y:rand(-300,-20),vx:rand(-2,2),vy:rand(3,8),r:rand(0,6.3),vr:rand(-.2,.2),s:rand(10,20),c:cols[i%cols.length]});
    if(!running){running=true; requestAnimationFrame(step);}
  }
  function step(){
    cx.clearRect(0,0,W,H);
    parts.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.r+=p.vr; cx.save(); cx.translate(p.x,p.y); cx.rotate(p.r); cx.fillStyle=p.c; cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); cx.restore();});
    parts=parts.filter(function(p){return p.y<H+40;});
    if(parts.length) requestAnimationFrame(step); else {running=false; cx.clearRect(0,0,W,H);}
  }
  /* ---------- start / end screens ---------- */
  function overlay(title,text,btn,cls){
    var o=el('div','overlay'); var c=el('div','ovcard',o);
    el('h1','',c,title); if(text) el('p','',c,text);
    var b=el('button','bigbtn '+(cls||''),c,btn); return {o:o,b:b,c:c};
  }
  function boot(opt){
    var s=overlay(opt.title,opt.instruction,'START');
    s.b.disabled=true; s.b.style.opacity=.5;
    loadPics(opt.pics||{}).then(function(){ s.b.disabled=false; s.b.style.opacity=1; if(opt.ready) opt.ready(); });
    s.b.addEventListener('click',function(){
      audioInit(); if('speechSynthesis' in window){ try{ speechSynthesis.cancel(); var u=new SpeechSynthesisUtterance(' '); u.volume=0; speechSynthesis.speak(u);}catch(e){} }
      sfx.click(); s.o.classList.add('hidden'); opt.start();
    });
    G.end=function(title,text){
      sfx.cheer(); confetti(220);
      var e=overlay(title||'Well done!',text||'','PLAY AGAIN','green');
      e.o.style.background='rgba(19,32,74,.35)';
      e.b.addEventListener('click',function(){ sfx.click(); e.o.remove(); opt.start(); });
    };
  }
  return {W:W,H:H,stage:stage,DEBUG:DEBUG,toStage:toStage,say:say,sayIfFree:sayIfFree,busy:busy,sfx:sfx,img:img,art:art,has:has,
    wait:wait,shuffle:shuffle,rand:rand,el:el,anim:anim,confetti:confetti,boot:boot,audioInit:audioInit,tone:tone,noise:noise,scale:function(){return scale;}};
})();

</script>
<script>
(function(){
/* exactly as in the designer sheet */
var KIDS=[['NOA','g','DRESS',1,1,0],['TOM','b','SHIRT',1,0,0],['MAYA','g','COAT',0,1,1],['BEN','b','JACKET',0,0,1],['LIA','g','DRESS',0,0,0],['OMER','b','COAT',1,0,1],
          ['YAEL','g','JACKET',1,1,0],['DAN','b','SHIRT',0,1,0],['SHIRA','g','COAT',1,0,0],['ADAM','b','JACKET',0,1,1],['MIA','g','SHIRT',0,0,1],['ELI','b','SHIRT',1,1,1]]
  .map(function(k){ return {name:k[0],g:k[1],top:k[2],HAT:!!k[3],GLASSES:!!k[4],SCARF:!!k[5],DRESS:k[2]==='DRESS',COAT:k[2]==='COAT',JACKET:k[2]==='JACKET'}; });
var QS=['GLASSES','HAT','SCARF','COAT','JACKET','DRESS'];
var E={GLASSES:'👓',HAT:'🧢',SCARF:'🧣',COAT:'🥼',JACKET:'🧥',DRESS:'👗',SHIRT:'👕',PANTS:'👖'};
var S=G.stage, grid=document.getElementById('grid'), qbar=document.getElementById('qbar'), sayEl=document.getElementById('say');
var cards=[], secret=null, mode='A', roundA=0, busy=false, asked=[];

function talk(t){ sayEl.textContent=t; G.anim(sayEl,'bounce'); return G.say(t); }
function build(){
  grid.innerHTML=''; cards=[];
  KIDS.forEach(function(k,i){
    var c=G.el('div','card',grid); var inn=G.el('div','in',c); var f=G.el('div','f',inn); G.el('div','b',inn);
    var pic=G.el('div','pic',f);
    var key='kid_'+k.name.toLowerCase();
    if(G.has(key)) G.art(key,{x:0,y:0,w:200,h:248,parent:pic}).style.cssText='position:absolute;inset:0';
    else { var fb=G.el('div','fb',pic); G.el('div','face',fb,k.g==='g'?'👧':'👦'); var wr=G.el('div','wear',fb);
      var list=(k.HAT?['HAT']:[]).concat(k.GLASSES?['GLASSES']:[]).concat(k.SCARF?['SCARF']:[]).concat([k.top]).concat(k.top==='DRESS'?[]:['PANTS']);
      wr.innerHTML=list.map(function(w){return E[w];}).join(''); }
    G.el('div','nm',f,k.name);
    var card={k:k,el:c,down:false}; cards.push(card);
    c.addEventListener('click',function(){ cardTap(card); });
  });
}
function buildQ(){
  qbar.innerHTML='';
  QS.forEach(function(q){
    var b=G.el('button','q',qbar); var qi=G.el('div','qi',b); G.art(q,{x:0,y:0,w:110,h:110,emoji:E[q],parent:qi}); G.el('span','',b,q+'?');
    b.addEventListener('click',function(){ ask(q,b); });
  });
}
function flip(card,down){ if(card.down===down) return; card.down=down; card.el.classList.toggle('down',down); G.sfx.flip(); }
function up(){ return cards.filter(function(c){return !c.down;}); }
async function ask(q,btn){
  if(busy) return;
  if(mode==='A'){
    busy=true; btn.classList.add('used');
    var yes=secret.k[q];
    await talk(yes?('Yes! '+q+'!'):('No '+q+'!'));
    var toFlip=up().filter(function(c){return c.k[q]!==yes;});
    for(var i=0;i<toFlip.length;i++){ flip(toFlip[i],true); await G.wait(110); }
    busy=false;
    if(up().length===1) reveal(up()[0]);
  } else if(mode==='B'){
    /* the teacher asks; the child answers with YES / NO */
    busy=true; btn.classList.add('used'); pendingQ=q; await G.say(q+'?');
    document.getElementById('qbar').style.display='none'; document.getElementById('yn').style.display='flex'; busy=false;
  }
}
var pendingQ=null;
async function answer(yes){
  if(busy||!pendingQ) return;
  var truth=secret.k[pendingQ];
  if(yes!==truth){ G.sfx.boing(); G.anim(document.getElementById(yes?'yes':'no'),'wobble'); await talk('Look again!'); return; }
  busy=true; G.sfx.pop(); var q=pendingQ; pendingQ=null;
  await talk(yes?('Yes! '+q+'!'):('No '+q+'!'));
  var toFlip=up().filter(function(c){return c.k[q]!==yes;});
  for(var i=0;i<toFlip.length;i++){ flip(toFlip[i],true); await G.wait(110); }
  document.getElementById('yn').style.display='none'; document.getElementById('qbar').style.display='flex';
  busy=false;
  if(up().length===1) reveal(up()[0]);
}
async function cardTap(card){
  if(busy||card.down) return;
  if(mode==='pick'){ secret=card; card.el.classList.add('mine'); G.sfx.pop(); busy=true;
    await talk('Shhh! It\'s a secret!'); cards.forEach(function(c){flip(c,true);}); await G.wait(700); cards.forEach(function(c){flip(c,false);}); card.el.classList.remove('mine');
    mode='B'; buildQ(); document.getElementById('qbar').style.display='flex'; busy=false; await talk('Teacher, ask a question!'); return; }
  if(mode!=='A') return;
  busy=true;
  if(card===secret){ busy=false; reveal(card); return; }
  await talk('Not '+card.k.name+'!'); flip(card,true); busy=false;
  if(up().length===1) reveal(up()[0]);
}
async function reveal(card){
  busy=true; cards.forEach(function(c){ if(c!==card) flip(c,true); });
  card.el.classList.add('win'); G.sfx.cheer(); G.confetti(90);
  await talk('This is '+card.k.name+'!');
  await G.wait(900); card.el.classList.remove('win'); busy=false;
  if(mode==='A'){ roundA++; if(roundA<3) roundStartA(); else offerB(); }
  else { G.end('Great guessing!','You played Guess the Neighbour.'); }
}
function roundStartA(){
  mode='A'; asked=[]; cards.forEach(function(c){flip(c,false);}); buildQ();
  secret=cards[Math.floor(Math.random()*cards.length)];
  setTimeout(function(){ talk(roundA===0?'I have a secret friend. Who is it? Ask me!':'I have a new secret friend!'); },500);
}
function offerB(){
  mode='wait'; qbar.style.display='none';
  var bn=document.getElementById('banner'); bn.style.display='flex'; bn.innerHTML='<div class="msg">Your turn! Hide a friend.</div>';
  var go=G.el('button','bigbtn green',bn,'MY TURN'); var fin=G.el('button','bigbtn',bn,'FINISH'); fin.style.fontSize='40px'; go.style.fontSize='40px';
  go.onclick=function(){ G.sfx.click(); bn.style.display='none'; cards.forEach(function(c){flip(c,false);}); mode='pick'; talk('Tap a friend. Keep it a secret!'); };
  fin.onclick=function(){ G.sfx.click(); bn.style.display='none'; G.end('Great guessing!','You played Guess the Neighbour.'); };
  talk('Your turn! You hide a friend.');
}
function start(){
  document.getElementById('banner').style.display='none'; document.getElementById('yn').style.display='none'; qbar.style.display='flex';
  document.getElementById('astro').innerHTML=''; G.art('astro',{x:0,y:0,w:270,h:380,emoji:'👽',word:'ASTRO',parent:document.getElementById('astro')});
  build(); roundA=0; roundStartA();
}
document.getElementById('yes').onclick=function(){answer(true);}; document.getElementById('no').onclick=function(){answer(false);};
window.__game={state:function(){return {mode:mode,roundA:roundA,secret:secret&&secret.k.name,up:up().map(function(c){return c.k.name;}),busy:busy,pending:pendingQ};},kids:KIDS};
G.boot({title:'Guess the Neighbour',instruction:'Astro has a secret friend.<br>Tap a clothes button to ask a question.<br>Tap a friend to guess!',pics:PICS,start:start});
})();
</script>
