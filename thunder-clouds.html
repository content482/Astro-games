<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Thunder Clouds</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#13204a;touch-action:none;user-select:none;-webkit-user-select:none}
body{font-family:ui-rounded,"Arial Rounded MT Bold","Nunito","Varela Round","Trebuchet MS",system-ui,sans-serif;color:#1e2a5a}
#stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform-origin:center center;overflow:hidden;background:#bfe6ff;border-radius:6px}
#stage img{-webkit-user-drag:none;user-select:none;pointer-events:none}
.layer{position:absolute;inset:0}
.overlay{position:absolute;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;background:rgba(19,32,74,.62);text-align:center;padding:40px}
.overlay.hidden{display:none}
.ovcard{background:#fff;border-radius:44px;padding:48px 70px;box-shadow:0 18px 0 rgba(0,0,0,.18);max-width:1150px;display:flex;flex-direction:column;align-items:center;gap:22px}
.ovcard h1{margin:0;font-size:84px;line-height:1.05;color:#1e2a5a}
.ovcard p{margin:0;font-size:40px;line-height:1.3;color:#3b4a7a}
.bigbtn{font:inherit;font-size:58px;font-weight:800;color:#fff;background:#ff8a1f;border:0;border-radius:999px;padding:22px 80px;box-shadow:0 10px 0 #c95f00;cursor:pointer;letter-spacing:2px}
.bigbtn:active{transform:translateY(6px);box-shadow:0 4px 0 #c95f00}
.bigbtn.green{background:#2fbf71;box-shadow:0 10px 0 #1d8a4f}
.ph{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100%;border-radius:26px;background:rgba(255,255,255,.88);border:5px dashed #8fa2d6;color:#1e2a5a;font-weight:800;text-align:center;overflow:hidden;line-height:1}
.ph .e{font-size:1em}
.ph .w{font-size:.28em;margin-top:.08em;letter-spacing:1px}
.art{position:absolute;display:flex;align-items:flex-end;justify-content:center}
.art>img{width:100%;height:100%;object-fit:contain}
.wobble{animation:wob .5s}
@keyframes wob{0%,100%{translate:0 0;rotate:0deg}20%{translate:-14px 0;rotate:-4deg}40%{translate:12px 0;rotate:3deg}60%{translate:-8px 0;rotate:-2deg}80%{translate:5px 0;rotate:0deg}}
.bounce{animation:bnc .45s}
@keyframes bnc{0%,100%{scale:1}40%{scale:1.18}70%{scale:.95}}
.bubble{pointer-events:none;position:absolute;background:#fff;border-radius:34px;padding:18px 30px;font-size:42px;font-weight:800;box-shadow:0 8px 0 rgba(0,0,0,.15);z-index:40;white-space:nowrap}
#confetti{position:absolute;inset:0;pointer-events:none;z-index:120}
#soundHint{position:absolute;right:18px;top:14px;z-index:90;font-size:34px;background:rgba(255,255,255,.85);border-radius:999px;padding:6px 16px;display:none}

#bg{position:absolute;inset:0;background:linear-gradient(#5fc4ff 0%,#bfe9ff 62%,#7ccf6a 62%,#5fb04f 100%)}
#bg img{width:100%;height:100%;object-fit:cover}
#bg .sun{position:absolute;right:90px;top:50px;width:150px;height:150px;border-radius:50%;background:radial-gradient(#fff6b0,#ffd23f 60%,#ffb703);box-shadow:0 0 80px #ffe066}
#bg .fence{position:absolute;left:0;right:0;top:450px;height:110px;background:repeating-linear-gradient(90deg,#e8c48f 0 46px,#cfa36a 46px 52px);border-top:8px solid #b98a52}
#machine{position:absolute;left:600px;top:440px;width:400px;height:450px;z-index:10}
#machine .art{left:0;top:0}
.mbox{position:absolute;left:40px;top:150px;width:320px;height:290px;background:linear-gradient(#9aa7c7,#6f7fa8);border-radius:36px;border:8px solid #4b5a85}
.mfun{position:absolute;left:70px;top:20px;width:0;height:0;border-left:130px solid transparent;border-right:130px solid transparent;border-top:140px solid #7d8bb0}
.mscreen{position:absolute;left:95px;top:185px;width:210px;height:110px;background:#203060;border-radius:16px;color:#9fe8ff;font-size:70px;display:flex;align-items:center;justify-content:center}
.mdial{position:absolute;top:320px;width:70px;height:70px;border-radius:50%;background:#ffd23f;border:7px solid #b38600}
#smoke{position:absolute;left:150px;top:-40px;width:100px;height:100px;pointer-events:none}
#smoke i{position:absolute;width:60px;height:60px;border-radius:50%;background:rgba(90,90,90,.45);animation:puff 2.2s infinite}
@keyframes puff{0%{transform:translate(0,40px) scale(.4);opacity:0}30%{opacity:1}100%{transform:translate(30px,-120px) scale(1.4);opacity:0}}
#label{position:absolute;left:150px;top:30px;width:100px;height:72px;background:#fff;border-radius:20px;font-size:58px;font-weight:900;display:flex;align-items:center;justify-content:center;color:#e0442d;z-index:3;box-shadow:0 5px 0 rgba(0,0,0,.2)}
#power{position:absolute;left:1010px;top:560px;width:70px;height:300px;background:#fff;border-radius:20px;border:6px solid #4b5a85;z-index:10;display:flex;flex-direction:column-reverse;padding:6px;gap:6px}
#power i{flex:1;border-radius:8px;background:#e3e8f4}
#power i.on{background:linear-gradient(#ffe066,#ffb703);box-shadow:0 0 14px #ffd23f}
.cloud{position:absolute;width:310px;height:215px;z-index:20;cursor:grab;touch-action:none}
.cloud.drag{z-index:60;cursor:grabbing;filter:drop-shadow(0 16px 10px rgba(0,0,0,.25))}
.cloud .shape{position:absolute;inset:0}
.cloud .shape img{width:100%;height:100%;object-fit:contain}
.cshape{position:absolute;left:20px;top:60px;width:270px;height:120px;background:#fff;border-radius:70px;box-shadow:inset 0 -14px 0 #e2ecf7}
.cshape:before{content:'';position:absolute;left:40px;top:-55px;width:120px;height:120px;background:#fff;border-radius:50%}
.cshape:after{content:'';position:absolute;left:125px;top:-75px;width:130px;height:130px;background:#fff;border-radius:50%}
.cloud .pic{position:absolute;left:105px;top:22px;width:100px;height:100px}
.cloud .pic .art{left:0;top:0}
.cloud .word{position:absolute;left:0;right:0;top:128px;text-align:center;font-size:50px;font-weight:900;color:#1e2a5a;letter-spacing:2px}
.word .snd{transition:all .3s}
.word .snd.glow{color:#e0442d;background:#fff36b;border-radius:10px;padding:0 4px;box-shadow:0 0 20px #ffd23f}
#flash{position:absolute;inset:0;background:#fffbe0;opacity:0;pointer-events:none;z-index:70}
.bolt{position:absolute;font-size:120px;z-index:65;pointer-events:none}
</style></head>
<body>
<div id="stage">
  <div id="bg"></div>
  <div id="machine"></div>
  <div id="power"></div>
  <div id="flash"></div>
</div>
<script>
var AUDIO={};
var PICS={
  bg:'../images/l3/yard_sun.jpg', broken:'../images/l3/weather_machine_broken.png', working:'../images/l3/weather_machine.png', cloud:'../images/l3/cloud.png',
  thumb:'../images/phonics/thumb.png', teeth:'../images/phonics/teeth.png', bath:'../images/phonics/bath.png', mouth:'../images/phonics/mouth.png', moth:'../images/phonics/moth.png', three:'../images/phonics/three.png',
  fish:'../images/phonics/fish.png', shoe:'../images/phonics/shoe.png', chair:'../images/phonics/chair.png', cheese:'../images/phonics/cheese.png', sheep:'../images/phonics/sheep.png'
};
</script>
<script>
/* ===== Astro & Alex shared game base ===== */
var G=(function(){
  var W=1600,H=900, stage=document.getElementById('stage'), scale=1;
  var DEBUG=/[?&]debug=1/.test(location.search);
  function fit(){
    scale=Math.min(window.innerWidth/W, window.innerHeight/H);
    stage.style.transform='translate(-50%,-50%) scale('+scale+')';
  }
  window.addEventListener('resize',fit); fit();
  function toStage(e){
    var r=stage.getBoundingClientRect();
    return {x:(e.clientX-r.left)/scale, y:(e.clientY-r.top)/scale};
  }
  /* ---------- speech: one queue, never overlapping ---------- */
  var AUDIO=window.AUDIO||{}; var voice=null; var queue=Promise.resolve(); var pending=0;
  function pickVoice(){
    if(!('speechSynthesis' in window)) return;
    var vs=speechSynthesis.getVoices().filter(function(v){return /^en[-_]US/i.test(v.lang);});
    var pref=['Samantha','Google US English','Microsoft Aria','Microsoft Jenny','Karen','Ava','Allison'];
    for(var i=0;i<pref.length;i++){ for(var j=0;j<vs.length;j++){ if(vs[j].name.indexOf(pref[i])>=0){voice=vs[j];return;} } }
    voice=vs[0]||null;
  }
  if('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged=pickVoice; }
  function speakNow(text){
    return new Promise(function(res){
      var done=false; function fin(){ if(!done){done=true; res();} }
      var safety=setTimeout(fin, 1800+text.length*95);
      var file=AUDIO[text];
      if(file){ var a=new Audio(file); a.onended=fin; a.onerror=fin; a.play().catch(fin); return; }
      if(!('speechSynthesis' in window)){ setTimeout(fin, 500+text.length*55); return; }
      var u=new SpeechSynthesisUtterance(text.replace(/\.\.\./g,', '));
      u.lang='en-US'; u.rate=0.9; u.pitch=1.05; if(voice) u.voice=voice;
      u.onend=function(){clearTimeout(safety); setTimeout(fin,120);}; u.onerror=function(){clearTimeout(safety); fin();};
      speechSynthesis.speak(u);
    });
  }
  function say(text){ pending++; queue=queue.then(function(){return speakNow(text);}).then(function(){pending--;}); return queue; }
  function sayIfFree(text){ if(pending>0) return queue; return say(text); }
  function busy(){ return pending>0; }
  /* ---------- sound effects ---------- */
  var ac=null;
  function audioInit(){ try{ if(!ac) ac=new (window.AudioContext||window.webkitAudioContext)(); if(ac.state==='suspended') ac.resume(); }catch(e){} }
  function tone(f,d,type,vol,f2,delay){
    if(!ac) return; var t=ac.currentTime+(delay||0);
    var o=ac.createOscillator(), g=ac.createGain(); o.type=type||'sine'; o.frequency.setValueAtTime(f,t);
    if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+d);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol||0.2,t+0.015); g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+d+0.05);
  }
  function noise(d,vol,freq,delay){
    if(!ac) return; var t=ac.currentTime+(delay||0), n=Math.floor(ac.sampleRate*d), b=ac.createBuffer(1,n,ac.sampleRate), ch=b.getChannelData(0);
    for(var i=0;i<n;i++) ch[i]=(Math.random()*2-1)*Math.sin(Math.PI*i/n);
    var s=ac.createBufferSource(); s.buffer=b; var f=ac.createBiquadFilter(); f.type='bandpass'; f.frequency.value=freq||800; f.Q.value=0.7;
    var g=ac.createGain(); g.gain.value=vol||0.3; s.connect(f); f.connect(g); g.connect(ac.destination); s.start(t);
  }
  var sfx={
    pop:function(){tone(520,0.12,'sine',0.25,980);},
    ding:function(){tone(1046,0.35,'triangle',0.2); tone(1568,0.4,'triangle',0.12,null,0.08);},
    boing:function(){tone(220,0.35,'square',0.08,520);},
    soft:function(){tone(300,0.15,'sine',0.12,240);},
    whoosh:function(){noise(0.9,0.35,600);},
    cheer:function(){[523,659,784,1046].forEach(function(f,i){tone(f,0.25,'triangle',0.18,null,i*0.09);});},
    flip:function(){noise(0.12,0.25,2500);},
    sparkle:function(){[1318,1568,2093].forEach(function(f,i){tone(f,0.18,'sine',0.1,null,i*0.06);});},
    thump:function(){tone(120,0.2,'sine',0.35,60);},
    click:function(){tone(900,0.05,'square',0.06);}
  };
  /* ---------- pictures with placeholders ---------- */
  var img={};
  function loadOne(paths){
    paths=[].concat(paths);
    return new Promise(function(res){
      var i=0; (function next(){
        if(i>=paths.length) return res(null);
        var im=new Image(); im.onload=function(){res(im);}; im.onerror=function(){i++; next();}; im.src=paths[i];
      })();
    });
  }
  function loadPics(P){
    var keys=Object.keys(P);
    return Promise.all(keys.map(function(k){return loadOne(P[k]).then(function(im){img[k]=im;});}));
  }
  /* art(key,{x,y,w,h,emoji,word,cls,parent,z}) -> absolutely positioned element with the picture or a placeholder */
  function art(key,o){
    o=o||{}; var d=document.createElement('div'); d.className='art '+(o.cls||'');
    if(o.w!=null){d.style.width=o.w+'px';} if(o.h!=null){d.style.height=o.h+'px';}
    if(o.x!=null) d.style.left=o.x+'px'; if(o.y!=null) d.style.top=o.y+'px'; if(o.z!=null) d.style.zIndex=o.z;
    var im=img[key];
    if(im){ var c=document.createElement('img'); c.src=im.src; c.alt=''; d.appendChild(c); d.dataset.real='1'; }
    else{ var p=document.createElement('div'); p.className='ph'; p.style.fontSize=Math.round(Math.min(o.w||160,o.h||160)*0.62)+'px';
      p.innerHTML='<div class="e">'+(o.emoji||'🖼️')+'</div>'+(o.word?'<div class="w">'+o.word+'</div>':''); d.appendChild(p); }
    (o.parent||stage).appendChild(d); return d;
  }
  function has(key){ return !!img[key]; }
  /* ---------- helpers ---------- */
  function wait(ms){return new Promise(function(r){setTimeout(r,ms);});}
  function shuffle(a){a=a.slice(); for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t;} return a;}
  function rand(a,b){return a+Math.random()*(b-a);}
  function el(tag,cls,parent,html){var e=document.createElement(tag); if(cls)e.className=cls; if(html!=null)e.innerHTML=html; (parent||stage).appendChild(e); return e;}
  function anim(e,cls){ e.classList.remove(cls); void e.offsetWidth; e.classList.add(cls); setTimeout(function(){e.classList.remove(cls);},600); }
  /* ---------- confetti ---------- */
  var cv=el('canvas',''); cv.id='confetti'; cv.width=W; cv.height=H; var cx=cv.getContext('2d'), parts=[], running=false;
  function confetti(n){
    var cols=['#ff8a1f','#2fbf71','#3d8bff','#ffd23f','#ff5d8f','#9b5de5'];
    for(var i=0;i<(n||160);i++) parts.push({x:rand(0,W),y:rand(-300,-20),vx:rand(-2,2),vy:rand(3,8),r:rand(0,6.3),vr:rand(-.2,.2),s:rand(10,20),c:cols[i%cols.length]});
    if(!running){running=true; requestAnimationFrame(step);}
  }
  function step(){
    cx.clearRect(0,0,W,H);
    parts.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.r+=p.vr; cx.save(); cx.translate(p.x,p.y); cx.rotate(p.r); cx.fillStyle=p.c; cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); cx.restore();});
    parts=parts.filter(function(p){return p.y<H+40;});
    if(parts.length) requestAnimationFrame(step); else {running=false; cx.clearRect(0,0,W,H);}
  }
  /* ---------- start / end screens ---------- */
  function overlay(title,text,btn,cls){
    var o=el('div','overlay'); var c=el('div','ovcard',o);
    el('h1','',c,title); if(text) el('p','',c,text);
    var b=el('button','bigbtn '+(cls||''),c,btn); return {o:o,b:b,c:c};
  }
  function boot(opt){
    var s=overlay(opt.title,opt.instruction,'START');
    s.b.disabled=true; s.b.style.opacity=.5;
    loadPics(opt.pics||{}).then(function(){ s.b.disabled=false; s.b.style.opacity=1; if(opt.ready) opt.ready(); });
    s.b.addEventListener('click',function(){
      audioInit(); if('speechSynthesis' in window){ try{ speechSynthesis.cancel(); var u=new SpeechSynthesisUtterance(' '); u.volume=0; speechSynthesis.speak(u);}catch(e){} }
      sfx.click(); s.o.classList.add('hidden'); opt.start();
    });
    G.end=function(title,text){
      sfx.cheer(); confetti(220);
      var e=overlay(title||'Well done!',text||'','PLAY AGAIN','green');
      e.o.style.background='rgba(19,32,74,.35)';
      e.b.addEventListener('click',function(){ sfx.click(); e.o.remove(); opt.start(); });
    };
  }
  return {W:W,H:H,stage:stage,DEBUG:DEBUG,toStage:toStage,say:say,sayIfFree:sayIfFree,busy:busy,sfx:sfx,img:img,art:art,has:has,
    wait:wait,shuffle:shuffle,rand:rand,el:el,anim:anim,confetti:confetti,boot:boot,audioInit:audioInit,tone:tone,noise:noise,scale:function(){return scale;}};
})();

</script>
<script>
(function(){
var TH=[{w:'thumb',e:'👍'},{w:'three',e:'3️⃣'},{w:'teeth',e:'🦷'},{w:'bath',e:'🛁'},{w:'mouth',e:'👄'},{w:'moth',e:'🦋'}];
var OTHER=[{w:'fish',e:'🐟'},{w:'shoe',e:'👟'},{w:'chair',e:'🪑'},{w:'cheese',e:'🧀'},{w:'sheep',e:'🐑'}];
TH.forEach(function(c){c.th=true;}); OTHER.forEach(function(c){c.th=false;});
var S=G.stage, mach=document.getElementById('machine'), clouds=[], fed=[], playing=false, last=performance.now(), drag=null;
var LANES=[60,250], SPEED=75, FUNNEL={x1:600,x2:1000,y1:380,y2:700};

function wordHTML(w){ var i=w.indexOf('th'); return w.slice(0,i)+'<span class="snd">th</span>'+w.slice(i+2); }
function drawMachine(working){
  mach.innerHTML='';
  var key=working?'working':'broken';
  if(G.has(key)){ G.art(key,{x:0,y:0,w:400,h:450,parent:mach}); }
  else{
    G.el('div','mfun',mach); var b=G.el('div','mbox',mach);
    var sc=G.el('div','mscreen',mach,working?'☀️':'⚡'); sc.style.left='95px';
    [90,240].forEach(function(x){ var d=G.el('div','mdial',mach); d.style.left=x+'px'; });
  }
  if(!working){ var sm=G.el('div','',mach); sm.id='smoke'; for(var i=0;i<3;i++){ var p=G.el('i','',sm); p.style.animationDelay=(i*.7)+'s'; } }
  G.el('div','',mach,'th').id='label';
}
function setup(){
  var bg=document.getElementById('bg'); bg.innerHTML='';
  if(G.has('bg')){ var i=document.createElement('img'); i.src=G.img.bg.src; bg.appendChild(i); } else { G.el('div','sun',bg); G.el('div','fence',bg); }
  drawMachine(false);
  var p=document.getElementById('power'); p.innerHTML=''; for(var k=0;k<TH.length;k++) G.el('i','',p);
  clouds.forEach(function(c){c.el.remove();}); clouds=[]; fed=[];
}
function pick(){
  var onScreen=clouds.map(function(c){return c.c.w;});
  var thLeft=TH.filter(function(c){return fed.indexOf(c.w)<0 && onScreen.indexOf(c.w)<0;});
  var oth=OTHER.filter(function(c){return onScreen.indexOf(c.w)<0;});
  var thOnScreen=clouds.filter(function(c){return c.c.th && fed.indexOf(c.c.w)<0;}).length;
  if(thLeft.length && (thOnScreen===0 || Math.random()<0.45)) return thLeft[Math.floor(Math.random()*thLeft.length)];
  return oth[Math.floor(Math.random()*oth.length)] || thLeft[0];
}
function makeCloud(x,lane){
  var c=pick(); if(!c) return;
  var d=G.el('div','cloud',S); var sh=G.el('div','shape',d);
  if(G.has('cloud')){ var im=document.createElement('img'); im.src=G.img.cloud.src; sh.appendChild(im); } else G.el('div','cshape',sh);
  var p=G.el('div','pic',d); G.art(c.w,{x:0,y:0,w:100,h:100,emoji:c.e,parent:p});
  var wd=G.el('div','word',d); wd.innerHTML=c.th?wordHTML(c.w):c.w;
  var cl={c:c,el:d,x:x,y:LANES[lane]+G.rand(-15,15),lane:lane,bob:Math.random()*6,speed:SPEED*G.rand(.8,1.2),state:'drift'};
  clouds.push(cl); pos(cl);
  d.addEventListener('pointerdown',function(e){ if(!playing||cl.state!=='drift') return; e.preventDefault(); var p=G.toStage(e);
    drag={cl:cl,dx:p.x-cl.x,dy:p.y-cl.y,sx:p.x,sy:p.y,moved:false}; cl.state='drag'; d.classList.add('drag'); d.setPointerCapture(e.pointerId); });
  d.addEventListener('pointermove',function(e){ if(!drag||drag.cl!==cl) return; var p=G.toStage(e);
    if(Math.abs(p.x-drag.sx)+Math.abs(p.y-drag.sy)>12) drag.moved=true; cl.x=p.x-drag.dx; cl.y=p.y-drag.dy; pos(cl); });
  d.addEventListener('pointerup',function(e){ if(!drag||drag.cl!==cl) return; var moved=drag.moved; drag=null; d.classList.remove('drag');
    if(!moved){ cl.state='drift'; G.sayIfFree(c.w); G.anim(d.querySelector('.pic'),'bounce'); return; }
    var cx=cl.x+155, cy=cl.y+107;
    if(cx>FUNNEL.x1 && cx<FUNNEL.x2 && cy>FUNNEL.y1 && cy<FUNNEL.y2) feed(cl); else { cl.state='return'; }
  });
  return cl;
}
function pos(cl){ cl.el.style.left=cl.x+'px'; cl.el.style.top=cl.y+'px'; }
function remove(cl){ cl.el.remove(); clouds=clouds.filter(function(o){return o!==cl;}); }
function feed(cl){
  if(cl.c.th){
    cl.state='eaten'; G.sfx.pop();
    cl.el.querySelector('.snd').classList.add('glow');
    var sx=cl.x, sy=cl.y, t0=performance.now();
    cl.el.animate([{transform:'scale(1)'},{transform:'scale(1.12)'},{transform:'scale(1.12)'}],{duration:900,fill:'forwards'});
    fed.push(cl.c.w);
    G.say(cl.c.w+'... '+cl.c.w+'!').then(function(){
      cl.el.animate([{transform:'scale(1.12)',opacity:1},{transform:'translate(0,260px) scale(.1)',opacity:0}],{duration:450,fill:'forwards'}).onfinish=function(){
        remove(cl); thunder(); var bars=document.querySelectorAll('#power i'); bars[fed.length-1].classList.add('on'); G.anim(mach,'bounce');
        if(fed.length>=TH.length) win(); };
    });
  } else {
    cl.state='spit'; G.anim(mach,'wobble'); sneeze();
    cl.vy=-900; cl.vx=G.rand(-200,200);
  }
}
function thunder(){ G.noise(1.2,0.6,120); G.tone(70,0.9,'sawtooth',0.08,40); var f=document.getElementById('flash'); f.animate([{opacity:0},{opacity:.7},{opacity:0},{opacity:.4},{opacity:0}],{duration:500}); }
function sneeze(){ G.tone(500,0.18,'sawtooth',0.07,900); G.noise(0.35,0.5,3000,0.2); }
async function win(){
  playing=false; drawMachine(true); G.sfx.sparkle();
  for(var i=0;i<6;i++){ (function(i){ setTimeout(function(){ var b=G.el('div','bolt',S,'⚡'); b.style.left=(560+Math.random()*420)+'px'; b.style.top=(330+Math.random()*120)+'px';
    b.animate([{opacity:0,transform:'scale(.4)'},{opacity:1,transform:'scale(1.1)'},{opacity:0,transform:'scale(1.4)'}],{duration:700}).onfinish=function(){b.remove();}; thunder(); },i*220); })(i); }
  clouds.slice().forEach(function(cl){ cl.el.animate([{opacity:1},{opacity:0}],{duration:600,fill:'forwards'}); });
  await G.wait(1500); await G.say('It works!');
  G.end('It works!','You found all the TH words.');
}
function tick(now){
  var dt=Math.min(0.05,(now-last)/1000); last=now;
  if(playing){
    clouds.slice().forEach(function(cl){
      if(cl.state==='drift'){ cl.bob+=dt; cl.x+=cl.speed*dt; cl.y=cl.y+(LANES[cl.lane]+Math.sin(cl.bob*1.3)*12-cl.y)*Math.min(1,dt*2); pos(cl);
        if(cl.x>1620){ remove(cl); } }
      else if(cl.state==='return'){ var ty=LANES[cl.lane]; cl.y+=(ty-cl.y)*Math.min(1,dt*3); pos(cl); if(Math.abs(cl.y-ty)<6) cl.state='drift'; }
      else if(cl.state==='spit'){ cl.vy+=1400*dt; cl.y+=cl.vy*dt; cl.x+=cl.vx*dt; pos(cl); if(cl.vy>0){ cl.state='return'; } }
    });
    [0,1].forEach(function(l){
      var inLane=clouds.filter(function(c){return c.lane===l;});
      var minX=Math.min.apply(null,inLane.map(function(c){return c.x;}).concat([9999]));
      var want = l===0 ? 2 : 2;
      if(inLane.length<want && minX>380) makeCloud(-330,l);
    });
  }
  requestAnimationFrame(tick);
}
function start(){
  setup(); playing=true; last=performance.now();
  makeCloud(260,0); makeCloud(760,1); makeCloud(-150,1);
  G.say('The machine needs TH words! Drag them in.');
}
window.__game={state:function(){return {fed:fed.length,clouds:clouds.map(function(c){return {w:c.c.w,th:c.c.th,s:c.state,x:c.x+155,y:c.y+107};})};}};
G.boot({title:'Thunder Clouds',instruction:'The weather machine needs words with <b style="color:#e0442d">th</b>.<br>Press and hold a <b>th</b> cloud, then <b>drag</b> it down into the machine.<br><span style="font-size:32px">Tap a cloud to hear its word.</span>',pics:PICS,ready:setup,start:start});
requestAnimationFrame(tick);
})();
</script>
</body></html>
