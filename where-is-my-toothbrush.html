<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#13204a;touch-action:none;user-select:none;-webkit-user-select:none}
body{font-family:ui-rounded,"Arial Rounded MT Bold","Nunito","Varela Round","Trebuchet MS",system-ui,sans-serif;color:#1e2a5a}

.layer{position:absolute;inset:0}

.bigbtn{font:inherit;font-size:58px;font-weight:800;color:#fff;background:#ff8a1f;border:0;border-radius:999px;padding:22px 80px;box-shadow:0 10px 0 #c95f00;cursor:pointer;letter-spacing:2px}

@keyframes bnc{0%,100%{scale:1}40%{scale:1.18}70%{scale:.95}}
.bubble{pointer-events:none;position:absolute;background:#fff;border-radius:34px;padding:18px 30px;font-size:42px;font-weight:800;box-shadow:0 8px 0 rgba(0,0,0,.15);z-index:40;white-space:nowrap}

.bot{position:absolute}
.bot .art{left:0;top:0}
.rb{position:absolute;inset:0}
.rb .body{position:absolute;left:18%;top:28%;width:64%;height:52%;background:radial-gradient(circle at 35% 30%,#e8eef9,#b6c3dc);border-radius:46%;border:6px solid #6b7690}
.rb .scr{position:absolute;left:28%;top:36%;width:44%;height:26%;background:#20345f;border-radius:30%;display:flex;align-items:center;justify-content:center;gap:14%}
.rb .scr i{width:16%;height:40%;background:#7cf3ff;border-radius:50%;box-shadow:0 0 10px #7cf3ff}
.rb .ant{position:absolute;left:48%;top:14%;width:4%;height:15%;background:#6b7690}

.rb .arm{position:absolute;top:50%;width:22%;height:6%;background:#6b7690;border-radius:20px}
.rb .arm.l{left:2%;transform-origin:100% 50%;transform:rotate(20deg)}.rb .arm.r{right:2%;transform-origin:0 50%;transform:rotate(-20deg)}
.rb.up .arm.l{transform:rotate(70deg)}.rb.up .arm.r{transform:rotate(-70deg)}
.rb .prop{position:absolute;line-height:1;text-align:center}
.rb.soak .body{background:radial-gradient(circle at 35% 30%,#cfe6ff,#7fa9d9)}

#view{position:absolute;inset:0;overflow:hidden;background:#e8d9c0}
#room{position:absolute;left:0;top:0;width:1600px;height:900px;transform-origin:0 0;transition:transform .35s}

.wall{position:absolute;left:0;right:0;top:0;height:560px;background:repeating-linear-gradient(90deg,#d7e8ff 0 90px,#c8dcf7 90px 180px)}
.floor{position:absolute;left:0;right:0;top:560px;bottom:0;background:#c9a37a}
.junk{position:absolute;line-height:1;pointer-events:none}
.item{position:absolute;width:100px;height:100px;cursor:pointer}

.item .ph{border-width:0;background:transparent}

.towel{position:absolute;inset:14px 6px;background:repeating-linear-gradient(0deg,#ff8fb1 0 14px,#fff 14px 22px);border-radius:10px}
.paste{position:absolute;left:10px;top:38px;width:80px;height:30px;background:linear-gradient(90deg,#fff 0 70%,#3d8bff 70%);border-radius:10px 4px 4px 10px;border:3px solid #9aa3b4}
.cbox{position:absolute;left:20px;top:6px;width:60px;height:88px;background:#ffb703;border:4px solid #c27c00;border-radius:6px;font-size:30px;text-align:center;line-height:80px}

#hud{position:absolute;inset:0;pointer-events:none;z-index:30}
#hud>*{pointer-events:auto}
#astro{position:absolute;left:20px;top:560px;width:220px;height:320px;pointer-events:none!important}

#basket{position:absolute;left:220px;top:760px;width:240px;height:120px;border-radius:0 0 90px 90px;background:repeating-linear-gradient(45deg,#c98d45 0 14px,#a8702f 14px 28px);border:7px solid #8a5a22;display:flex;flex-wrap:wrap;align-content:flex-start;justify-content:center;padding:6px;gap:2px;font-size:38px}

#bot{position:absolute;right:30px;top:600px;width:200px;height:230px}

#need .slots{display:flex;gap:10px}
#need .slots i{width:70px;height:70px;border-radius:16px;border:4px dashed #9aa3b4;font-style:normal;font-size:46px;display:flex;align-items:center;justify-content:center}
#need .slots i.on{border:4px solid #2fbf71;background:#e4f8ec}
.hb{position:absolute;font:inherit;font-size:34px;font-weight:900;border:0;border-radius:999px;padding:12px 26px;cursor:pointer;box-shadow:0 7px 0 rgba(0,0,0,.2)}
#hint{right:30px;top:24px;background:#ffd23f;display:none}
#zoom{right:30px;top:110px;background:#fff}
#again{left:30px;top:24px;background:#3d8bff;color:#fff}
#say{position:absolute;left:50%;top:130px;transform:translateX(-50%);font-size:40px;white-space:nowrap;text-align:center}
</style></head>
<body>
<div id="stage">
  <div id="view"><div id="room"></div></div>
  <div id="hud">
    <div id="astro"></div><div id="basket"></div><div id="bot" class="bot"></div>
    <div id="need"><span id="needw"></span><span class="slots"></span></div>

  </div>
</div>
<script>
var AUDIO={};
var PICS={ bg:'images/l6/bedroom_messy.jpg', astro:['images/l6/astro_pj.png','images/astro.png'] };
['toothbrush','toothpaste','towel','soap','shirt','socks','cereal','spoon','alarm'].forEach(function(k){ PICS['item_'+k]='images/l6/item_'+k+'.png'; });
['idle','wave'].forEach(function(k){ PICS['bot_'+k]='images/l6/bot_'+k+'.png'; });
/* where each hidden item sits in the room (stage px, item top-left). Adjust after the designer's room arrives; ?debug=1 outlines them. */
var SPOTS={toothbrush:[1180,470,0.9,-30],toothpaste:[700,690,0.9,15],towel:[300,360,1.1,10],soap:[1240,780,0.8,0],shirt:[880,250,1.0,-12],
  socks:[540,520,0.85,20],cereal:[1040,700,1.0,-8],spoon:[160,480,0.8,40],alarm:[640,170,0.9,0]};
</script>
<script>
/* ===== Astro & Alex shared game base ===== */
var G=(function(){
  var W=1600,H=900, stage=document.getElementById('stage'), scale=1;
  var DEBUG=/[?&]debug=1/.test(location.search);
  function fit(){
    scale=Math.min(window.innerWidth/W, window.innerHeight/H);
    stage.style.transform='translate(-50%,-50%) scale('+scale+')';
  }
  window.addEventListener('resize',fit); fit();
  function toStage(e){
    var r=stage.getBoundingClientRect();
    return {x:(e.clientX-r.left)/scale, y:(e.clientY-r.top)/scale};
  }
  /* ---------- speech: one queue, never overlapping ---------- */
  var AUDIO=window.AUDIO||{}; var voice=null; var queue=Promise.resolve(); var pending=0;
  function pickVoice(){
    if(!('speechSynthesis' in window)) return;
    var vs=speechSynthesis.getVoices().filter(function(v){return /^en[-_]US/i.test(v.lang);});
    var pref=['Samantha','Google US English','Microsoft Aria','Microsoft Jenny','Karen','Ava','Allison'];
    for(var i=0;i<pref.length;i++){ for(var j=0;j<vs.length;j++){ if(vs[j].name.indexOf(pref[i])>=0){voice=vs[j];return;} } }
    voice=vs[0]||null;
  }
  if('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged=pickVoice; }
  function speakNow(text){
    return new Promise(function(res){
      var done=false; function fin(){ if(!done){done=true; res();} }
      var safety=setTimeout(fin, 1800+text.length*95);
      var file=AUDIO[text];
      if(file){ var a=new Audio(file); a.onended=fin; a.onerror=fin; a.play().catch(fin); return; }
      if(!('speechSynthesis' in window)){ setTimeout(fin, 500+text.length*55); return; }
      var u=new SpeechSynthesisUtterance(text.replace(/\.\.\./g,', '));
      u.lang='en-US'; u.rate=0.9; u.pitch=1.05; if(voice) u.voice=voice;
      u.onend=function(){clearTimeout(safety); setTimeout(fin,120);}; u.onerror=function(){clearTimeout(safety); fin();};
      speechSynthesis.speak(u);
    });
  }
  function say(text){ pending++; queue=queue.then(function(){return speakNow(text);}).then(function(){pending--;}); return queue; }
  function sayIfFree(text){ if(pending>0) return queue; return say(text); }
  function busy(){ return pending>0; }
  /* ---------- sound effects ---------- */
  var ac=null;
  function audioInit(){ try{ if(!ac) ac=new (window.AudioContext||window.webkitAudioContext)(); if(ac.state==='suspended') ac.resume(); }catch(e){} }
  function tone(f,d,type,vol,f2,delay){
    if(!ac) return; var t=ac.currentTime+(delay||0);
    var o=ac.createOscillator(), g=ac.createGain(); o.type=type||'sine'; o.frequency.setValueAtTime(f,t);
    if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+d);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol||0.2,t+0.015); g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+d+0.05);
  }
  function noise(d,vol,freq,delay){
    if(!ac) return; var t=ac.currentTime+(delay||0), n=Math.floor(ac.sampleRate*d), b=ac.createBuffer(1,n,ac.sampleRate), ch=b.getChannelData(0);
    for(var i=0;i<n;i++) ch[i]=(Math.random()*2-1)*Math.sin(Math.PI*i/n);
    var s=ac.createBufferSource(); s.buffer=b; var f=ac.createBiquadFilter(); f.type='bandpass'; f.frequency.value=freq||800; f.Q.value=0.7;
    var g=ac.createGain(); g.gain.value=vol||0.3; s.connect(f); f.connect(g); g.connect(ac.destination); s.start(t);
  }
  var sfx={
    pop:function(){tone(520,0.12,'sine',0.25,980);},
    ding:function(){tone(1046,0.35,'triangle',0.2); tone(1568,0.4,'triangle',0.12,null,0.08);},
    boing:function(){tone(220,0.35,'square',0.08,520);},
    soft:function(){tone(300,0.15,'sine',0.12,240);},
    whoosh:function(){noise(0.9,0.35,600);},
    cheer:function(){[523,659,784,1046].forEach(function(f,i){tone(f,0.25,'triangle',0.18,null,i*0.09);});},
    flip:function(){noise(0.12,0.25,2500);},
    sparkle:function(){[1318,1568,2093].forEach(function(f,i){tone(f,0.18,'sine',0.1,null,i*0.06);});},
    thump:function(){tone(120,0.2,'sine',0.35,60);},
    click:function(){tone(900,0.05,'square',0.06);}
  };
  /* ---------- pictures with placeholders ---------- */
  var img={};
  function loadOne(paths){
    paths=[].concat(paths);
    return new Promise(function(res){
      var i=0; (function next(){
        if(i>=paths.length) return res(null);
        var im=new Image(); im.onload=function(){res(im);}; im.onerror=function(){i++; next();}; im.src=paths[i];
      })();
    });
  }
  function loadPics(P){
    var keys=Object.keys(P);
    return Promise.all(keys.map(function(k){return loadOne(P[k]).then(function(im){img[k]=im;});}));
  }
  /* art(key,{x,y,w,h,emoji,word,cls,parent,z}) -> absolutely positioned element with the picture or a placeholder */
  function art(key,o){
    o=o||{}; var d=document.createElement('div'); d.className='art '+(o.cls||'');
    if(o.w!=null){d.style.width=o.w+'px';} if(o.h!=null){d.style.height=o.h+'px';}
    if(o.x!=null) d.style.left=o.x+'px'; if(o.y!=null) d.style.top=o.y+'px'; if(o.z!=null) d.style.zIndex=o.z;
    var im=img[key];
    if(im){ var c=document.createElement('img'); c.src=im.src; c.alt=''; d.appendChild(c); d.dataset.real='1'; }
    else{ var p=document.createElement('div'); p.className='ph'; p.style.fontSize=Math.round(Math.min(o.w||160,o.h||160)*0.62)+'px';
      p.innerHTML='<div class="e">'+(o.emoji||'🖼️')+'</div>'+(o.word?'<div class="w">'+o.word+'</div>':''); d.appendChild(p); }
    (o.parent||stage).appendChild(d); return d;
  }
  function has(key){ return !!img[key]; }
  /* ---------- helpers ---------- */
  function wait(ms){return new Promise(function(r){setTimeout(r,ms);});}
  function shuffle(a){a=a.slice(); for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t;} return a;}
  function rand(a,b){return a+Math.random()*(b-a);}
  function el(tag,cls,parent,html){var e=document.createElement(tag); if(cls)e.className=cls; if(html!=null)e.innerHTML=html; (parent||stage).appendChild(e); return e;}
  function anim(e,cls){ e.classList.remove(cls); void e.offsetWidth; e.classList.add(cls); setTimeout(function(){e.classList.remove(cls);},600); }
  /* ---------- confetti ---------- */
  var cv=el('canvas',''); cv.id='confetti'; cv.width=W; cv.height=H; var cx=cv.getContext('2d'), parts=[], running=false;
  function confetti(n){
    var cols=['#ff8a1f','#2fbf71','#3d8bff','#ffd23f','#ff5d8f','#9b5de5'];
    for(var i=0;i<(n||160);i++) parts.push({x:rand(0,W),y:rand(-300,-20),vx:rand(-2,2),vy:rand(3,8),r:rand(0,6.3),vr:rand(-.2,.2),s:rand(10,20),c:cols[i%cols.length]});
    if(!running){running=true; requestAnimationFrame(step);}
  }
  function step(){
    cx.clearRect(0,0,W,H);
    parts.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.r+=p.vr; cx.save(); cx.translate(p.x,p.y); cx.rotate(p.r); cx.fillStyle=p.c; cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); cx.restore();});
    parts=parts.filter(function(p){return p.y<H+40;});
    if(parts.length) requestAnimationFrame(step); else {running=false; cx.clearRect(0,0,W,H);}
  }
  /* ---------- start / end screens ---------- */
  function overlay(title,text,btn,cls){
    var o=el('div','overlay'); var c=el('div','ovcard',o);
    el('h1','',c,title); if(text) el('p','',c,text);
    var b=el('button','bigbtn '+(cls||''),c,btn); return {o:o,b:b,c:c};
  }
  function boot(opt){
    var s=overlay(opt.title,opt.instruction,'START');
    s.b.disabled=true; s.b.style.opacity=.5;
    loadPics(opt.pics||{}).then(function(){ s.b.disabled=false; s.b.style.opacity=1; if(opt.ready) opt.ready(); });
    s.b.addEventListener('click',function(){
      audioInit(); if('speechSynthesis' in window){ try{ speechSynthesis.cancel(); var u=new SpeechSynthesisUtterance(' '); u.volume=0; speechSynthesis.speak(u);}catch(e){} }
      sfx.click(); s.o.classList.add('hidden'); opt.start();
    });
    G.end=function(title,text){
      sfx.cheer(); confetti(220);
      var e=overlay(title||'Well done!',text||'','PLAY AGAIN','green');
      e.o.style.background='rgba(19,32,74,.35)';
      e.b.addEventListener('click',function(){ sfx.click(); e.o.remove(); opt.start(); });
    };
  }
  return {W:W,H:H,stage:stage,DEBUG:DEBUG,toStage:toStage,say:say,sayIfFree:sayIfFree,busy:busy,sfx:sfx,img:img,art:art,has:has,
    wait:wait,shuffle:shuffle,rand:rand,el:el,anim:anim,confetti:confetti,boot:boot,audioInit:audioInit,tone:tone,noise:noise,scale:function(){return scale;}};
})();

/* the Morning-Bot: designer picture images/l6/bot_<pose>.png if present, otherwise drawn here */
function drawBot(parent,w,h,pose){
  parent.innerHTML=''; var key='bot_'+pose;
  if(G.has(key)){ G.art(key,{x:0,y:0,w:w,h:h,parent:parent}); return; }
  var r=G.el('div','rb'+(pose==='wake'||pose==='wave'?' up':'')+(pose==='soaked'?' soak':''),parent);
  G.el('div','ant',r); G.el('div','arm l',r); G.el('div','arm r',r); G.el('div','body',r); var s=G.el('div','scr',r); G.el('i','',s); G.el('i','',s); G.el('div','wheel',r);
  var P={shower:['🚿','35%','-6%',0.32],brush:['🪥','62%','34%',0.22],dressed:['👕','30%','52%',0.3],breakfast:['🥣','62%','48%',0.24],soaked:['💦','60%','10%',0.26],wave:['👋','72%','22%',0.22],wake:['⭐','40%','-4%',0.2]};
  var p=P[pose]; if(p){ var e=G.el('div','prop',r,p[0]); e.style.left=p[1]; e.style.top=p[2]; e.style.fontSize=Math.round(w*p[3])+'px'; }
  if(pose==='soaked'){ var s2=G.el('div','prop',r,'👕'); s2.style.left='30%'; s2.style.top='52%'; s2.style.fontSize=Math.round(w*0.3)+'px'; s2.style.filter='hue-rotate(160deg) brightness(.8)'; }
}

</script>
<script>
(function(){
var ITEMS={toothbrush:{e:'🪥',w:'TOOTHBRUSH'},toothpaste:{e:'',w:'TOOTHPASTE',draw:'paste'},towel:{e:'',w:'TOWEL',draw:'towel'},soap:{e:'🧼',w:'SOAP'},shirt:{e:'👕',w:'SHIRT'},
           socks:{e:'🧦',w:'SOCKS'},cereal:{e:'',w:'CEREAL',draw:'cbox'},spoon:{e:'🥄',w:'SPOON'},alarm:{e:'⏰',w:'ALARM CLOCK'}};
var TASKS=[{r:'SHOWER',ask:'Find what we need to SHOWER!',done:'Now I can SHOWER!',need:['towel','soap']},{r:'BRUSH TEETH',ask:'Find what we need to BRUSH our TEETH!',done:'Now I can BRUSH my TEETH!',need:['toothbrush','toothpaste']},{r:'GET DRESSED',ask:'Find what we need to GET DRESSED!',done:'Now I can GET DRESSED!',need:['shirt','socks']},{r:'BREAKFAST',ask:'Find what we need for BREAKFAST!',done:'Now I can eat BREAKFAST!',need:['cereal','spoon']},{r:'WAKE UP',ask:'Find what we need to WAKE UP!',done:'Ring ring! Now I WAKE UP!',need:['alarm']}];
var JUNK=[['🧸',90,420,110],['📚',380,470,90],['🛏️',20,250,260],['🧩',820,560,80],['🚗',460,720,90],['🎈',1300,150,110],['📦',1240,560,150],['🎒',980,480,110],['⚽',1380,620,90],['🪀',760,420,70],['🖍️',300,640,70],['🛹',540,800,110],['🎲',1100,820,60],['🪁',150,90,120],['📕',1450,420,80],['🥎',900,820,70],['🪴',1480,250,120],['🧺',1050,300,110],['🎮',620,620,70]];
var S=G.stage, room=document.getElementById('room'), sayEl=document.getElementById('say');
var order=[], ti=0, items={}, found=[], last=0, playing=false, zoomed=false, zx=0, zy=0, glowEl=null;
function talk(t){ sayEl.textContent=t; sayEl.style.display='block'; G.anim(sayEl,'bounce'); return G.say(t); }
function build(){
  room.innerHTML=''; items={};
  if(G.has('bg')){ var im=document.createElement('img'); im.className='bgi'; im.src=G.img.bg.src; room.appendChild(im); }
  else { G.el('div','wall',room); G.el('div','floor',room); JUNK.forEach(function(j){ var d=G.el('div','junk',room,j[0]); d.style.cssText+=';left:'+j[1]+'px;top:'+j[2]+'px;font-size:'+j[3]+'px'; }); }
  Object.keys(ITEMS).forEach(function(k){ var s=SPOTS[k], d=G.el('div','item',room); d.style.left=s[0]+'px'; d.style.top=s[1]+'px'; d.style.transform='scale('+s[2]+') rotate('+s[3]+'deg)';
    if(G.has('item_'+k)) G.art('item_'+k,{x:0,y:0,w:100,h:100,parent:d}); else if(ITEMS[k].draw){ G.el('div',ITEMS[k].draw,d,ITEMS[k].draw==='cbox'?'🥣':''); } else { var e=G.el('div','',d,ITEMS[k].e); e.style.cssText='font-size:80px;line-height:100px;text-align:center'; }
    if(G.DEBUG) d.style.outline='3px dashed red';
    items[k]={el:d,k:k}; d.addEventListener('click',function(ev){ if(panMoved) return; tapItem(k); }); });
}
function showNeed(){ var T=order[ti]; document.getElementById('needw').textContent=T.r+':'; var sl=document.querySelector('#need .slots'); sl.innerHTML='';
  T.need.forEach(function(k){ var i=G.el('i','',sl,'?'); i.dataset.k=k; }); }
async function tapItem(k){
  if(!playing) return; var T=order[ti]; var it=items[k];
  if(T.need.indexOf(k)>=0 && found.indexOf(k)<0){
    found.push(k); last=Date.now(); clearGlow(); G.sfx.pop(); G.sfx.ding(); it.el.classList.add('found');
    var sr=S.getBoundingClientRect(), k2=G.scale(), r=it.el.getBoundingClientRect(), b=document.getElementById('basket').getBoundingClientRect();
    var fl=it.el.cloneNode(true); fl.style.cssText='position:absolute;width:100px;height:100px;z-index:50;left:'+((r.left-sr.left)/k2)+'px;top:'+((r.top-sr.top)/k2)+'px'; S.appendChild(fl); it.el.style.visibility='hidden';
    fl.animate([{transform:'scale(1)'},{transform:'translate('+((b.left-r.left)/k2+60)+'px,'+((b.top-r.top)/k2-20)+'px) scale(.6)'}],{duration:600,easing:'ease-in',fill:'forwards'}).onfinish=function(){ fl.remove(); var m=G.el('div','',document.getElementById('basket'),ITEMS[k].e||'✔️'); };
    var slot=document.querySelector('#need .slots i[data-k="'+k+'"]'); slot.classList.add('on'); slot.textContent=ITEMS[k].e||'✔️';
    G.say(ITEMS[k].w+'!');
    if(T.need.every(function(n){return found.indexOf(n)>=0;})){ playing=false; await G.wait(900); G.sfx.cheer(); await talk(T.done); ti++; found=[];
      if(ti<order.length){ await G.wait(300); ask(); } else { drawBot(document.getElementById('bot'),200,230,'wave'); await talk('Thank you! Sorry, says the robot.'); G.end('You found everything!','The Morning-Bot says sorry!'); } }
  } else { G.anim(it.el.firstChild||it.el,'wobble'); G.sfx.soft(); G.sayIfFree(ITEMS[k].w); }
}
function clearGlow(){ if(glowEl){ glowEl.remove(); glowEl=null; } document.getElementById('hint').style.display='none'; }
setInterval(function(){ if(playing && Date.now()-last>15000 && !glowEl) document.getElementById('hint').style.display='block'; },1000);
document.getElementById('hint').onclick=function(){ var T=order[ti]; var k=T.need.find(function(n){return found.indexOf(n)<0;}); if(!k) return; var s=SPOTS[k];
  glowEl=G.el('div','glow',room); glowEl.style.left=(s[0]-45)+'px'; glowEl.style.top=(s[1]-45)+'px'; this.style.display='none'; G.sfx.sparkle(); G.say('Look here!'); };
document.getElementById('again').onclick=function(){ if(playing) G.sayIfFree(order[ti].ask); };
/* zoom + pan for small screens */
function applyZoom(){ room.style.transform=zoomed?'translate('+zx+'px,'+zy+'px) scale(1.7)':''; }
document.getElementById('zoom').onclick=function(){ zoomed=!zoomed; zx=-400; zy=-250; this.textContent=zoomed?'🔍 BACK':'🔍 ZOOM'; applyZoom(); };
var pan=null, panMoved=false;
room.addEventListener('pointerdown',function(e){ panMoved=false; if(!zoomed) return; var p=G.toStage(e); pan={x:p.x,y:p.y,zx:zx,zy:zy}; });
window.addEventListener('pointermove',function(e){ if(!pan) return; var p=G.toStage(e); var dx=p.x-pan.x, dy=p.y-pan.y; if(Math.abs(dx)+Math.abs(dy)>12) panMoved=true;
  if(panMoved){ room.classList.add('pan'); zx=Math.max(-1120,Math.min(0,pan.zx+dx)); zy=Math.max(-630,Math.min(0,pan.zy+dy)); applyZoom(); } });
window.addEventListener('pointerup',function(){ pan=null; room.classList.remove('pan'); setTimeout(function(){panMoved=false;},0); });
async function ask(){ showNeed(); last=Date.now(); await talk(order[ti].ask); playing=true; }
function start(){ build(); document.getElementById('basket').innerHTML=''; var a=document.getElementById('astro'); a.innerHTML=''; G.art('astro',{x:0,y:0,w:220,h:320,emoji:'👽',parent:a});
  drawBot(document.getElementById('bot'),200,230,'idle'); order=G.shuffle(TASKS); ti=0; found=[]; zoomed=false; applyZoom();
  talk('The Morning-Bot hid everything!').then(ask); }
window.__game={state:function(){ var T=order[ti]; return {ti:ti,playing:playing,need:T?T.need.filter(function(n){return found.indexOf(n)<0;}):[],
  items:Object.keys(items).map(function(k){ var r=items[k].el.getBoundingClientRect(); return {k:k,cx:r.left+r.width/2,cy:r.top+r.height/2}; })}; }};
G.boot({title:'Where Is My Toothbrush?',instruction:'The Morning-Bot hid things in the bedroom!<br>Listen to Astro and <b>tap</b> the things he needs.<br><span style="font-size:32px">Small screen? Press 🔍 ZOOM.</span>',pics:PICS,ready:build,start:start});
})();
</script>
