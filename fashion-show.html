<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Weather Fashion Show</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#13204a;touch-action:none;user-select:none;-webkit-user-select:none}
body{font-family:ui-rounded,"Arial Rounded MT Bold","Nunito","Varela Round","Trebuchet MS",system-ui,sans-serif;color:#1e2a5a}
#stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform-origin:center center;overflow:hidden;background:#bfe6ff;border-radius:6px}
#stage img{-webkit-user-drag:none;user-select:none;pointer-events:none}
.layer{position:absolute;inset:0}
.overlay{position:absolute;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;background:rgba(19,32,74,.62);text-align:center;padding:40px}
.overlay.hidden{display:none}
.ovcard{background:#fff;border-radius:44px;padding:48px 70px;box-shadow:0 18px 0 rgba(0,0,0,.18);max-width:1150px;display:flex;flex-direction:column;align-items:center;gap:22px}
.ovcard h1{margin:0;font-size:84px;line-height:1.05;color:#1e2a5a}
.ovcard p{margin:0;font-size:40px;line-height:1.3;color:#3b4a7a}
.bigbtn{font:inherit;font-size:58px;font-weight:800;color:#fff;background:#ff8a1f;border:0;border-radius:999px;padding:22px 80px;box-shadow:0 10px 0 #c95f00;cursor:pointer;letter-spacing:2px}
.bigbtn:active{transform:translateY(6px);box-shadow:0 4px 0 #c95f00}
.bigbtn.green{background:#2fbf71;box-shadow:0 10px 0 #1d8a4f}
.ph{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100%;border-radius:26px;background:rgba(255,255,255,.88);border:5px dashed #8fa2d6;color:#1e2a5a;font-weight:800;text-align:center;overflow:hidden;line-height:1}
.ph .e{font-size:1em}
.ph .w{font-size:.28em;margin-top:.08em;letter-spacing:1px}
.art{position:absolute;display:flex;align-items:flex-end;justify-content:center}
.art>img{width:100%;height:100%;object-fit:contain}
.wobble{animation:wob .5s}
@keyframes wob{0%,100%{translate:0 0;rotate:0deg}20%{translate:-14px 0;rotate:-4deg}40%{translate:12px 0;rotate:3deg}60%{translate:-8px 0;rotate:-2deg}80%{translate:5px 0;rotate:0deg}}
.bounce{animation:bnc .45s}
@keyframes bnc{0%,100%{scale:1}40%{scale:1.18}70%{scale:.95}}
.bubble{pointer-events:none;position:absolute;background:#fff;border-radius:34px;padding:18px 30px;font-size:42px;font-weight:800;box-shadow:0 8px 0 rgba(0,0,0,.15);z-index:40;white-space:nowrap}
#confetti{position:absolute;inset:0;pointer-events:none;z-index:120}
#soundHint{position:absolute;right:18px;top:14px;z-index:90;font-size:34px;background:rgba(255,255,255,.85);border-radius:999px;padding:6px 16px;display:none}

#bg{position:absolute;inset:0;background:linear-gradient(#2b1f5c,#5a3f9e 55%,#7ccf6a 55%,#5fb04f)}
#bg img{width:100%;height:100%;object-fit:cover}
.runway{position:absolute;left:50%;top:330px;width:0;height:0;transform:translateX(-50%);border-bottom:570px solid #e9506f;border-left:420px solid transparent;border-right:420px solid transparent}
.runway:before{content:'';position:absolute;left:-90px;top:0;width:180px;height:570px}
.lights{position:absolute;left:0;right:0;top:40px;height:60px;display:flex;justify-content:space-around}
.lights i{width:26px;height:26px;border-radius:50%;background:#ffe066;box-shadow:0 0 22px #ffd23f;animation:tw 1.4s infinite alternate}
@keyframes tw{to{opacity:.35}}
.crowd{position:absolute;font-size:96px;line-height:1}
#astro{position:absolute;left:640px;top:200px;width:330px;height:460px;z-index:10;transform-origin:50% 100%}
#astro .art{left:0;top:0}
#astro .worn{position:absolute;width:96px;height:96px;z-index:3}
#astro .worn .art{left:0;top:0}
#astro .worn.glow{filter:drop-shadow(0 0 18px #ffd23f) brightness(1.15)}
#mood{position:absolute;left:930px;top:170px;font-size:110px;z-index:12;display:none}
#items{position:absolute;left:0;right:0;top:700px;height:180px;display:flex;justify-content:center;gap:40px;z-index:20}
.ib{width:170px;height:170px;background:#fff;border:0;border-radius:30px;box-shadow:0 8px 0 rgba(0,0,0,.2);position:relative;cursor:pointer}
.ib .art{left:15px;top:15px}
.ib.done{opacity:.35}
#thumbs{position:absolute;left:0;right:0;top:700px;height:180px;display:none;justify-content:center;gap:60px;z-index:20}
#thumbs button{font:inherit;font-size:48px;font-weight:900;border:0;border-radius:40px;padding:18px 40px;color:#fff;cursor:pointer;display:flex;align-items:center;gap:16px}
#thumbs .up{background:#2fbf71;box-shadow:0 10px 0 #1d8a4f}#thumbs .dn{background:#ff7a59;box-shadow:0 10px 0 #c9502f}
#thumbs span{font-size:80px}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:90}
#photo{position:absolute;inset:0;z-index:85;display:none;flex-direction:column;align-items:center;justify-content:center;gap:24px;background:rgba(19,32,74,.55)}
#photo .row{display:flex;gap:26px}
.ph4{width:280px;height:340px;background:#fff;padding:12px 12px 56px;position:relative;box-shadow:0 12px 0 rgba(0,0,0,.2)}
.ph4 .in{position:relative;width:100%;height:100%;background:linear-gradient(#5a3f9e,#e9506f);overflow:hidden}
.ph4 .st{position:absolute;right:-18px;top:-18px;font-size:74px}
.ph4 b{position:absolute;left:0;right:0;bottom:10px;text-align:center;font-size:30px}
#photo .btns{display:flex;gap:30px}
</style></head>
<body>
<div id="stage">
  <div id="bg"></div>
  <div id="astro"></div>
  <div id="mood"></div>
  <div class="bubble" id="callout" style="display:none;left:1000px;top:250px;font-size:54px"></div>
  <button id="again" title="Listen again" style="position:absolute;left:470px;top:240px;width:110px;height:110px;border-radius:50%;border:0;background:#3d8bff;color:#fff;font-size:58px;box-shadow:0 8px 0 #2766c4;z-index:30;cursor:pointer;display:none">👂</button>
  <div id="items"></div>
  <div id="thumbs"><button class="up"><span>👍</span>I like it!</button><button class="dn"><span>👎</span>I don't like it!</button></div>
  <div id="photo"><div class="row"></div><div class="btns"></div></div>
  <div id="flash"></div>
</div>
<script>
var AUDIO={};
var PICS={ runway:'images/l3/runway.jpg', astro:'images/astro.png', bow:'images/l3/astro_bow.png', sulk:'images/l3/astro_sulk.png',
  astro_snow:'images/l3/astro_snow.png', astro_rain:'images/l3/astro_rain.png', astro_sun:'images/l3/astro_sun.png', astro_wind:'images/l3/astro_wind.png',
  SHIRT:'images/l3/shirt.png', PANTS:'images/l3/pants.png', DRESS:'images/l3/dress.png', JACKET:'images/l3/jacket.png', HAT:'images/l3/hat.png',
  SOCKS:'images/l3/socks.png', SHOES:'images/l3/shoes.png', COAT:'images/l3/coat.png', GLASSES:'images/l3/glasses.png', SCARF:'images/l3/scarf.png' };
</script>
<script>
/* ===== Astro & Alex shared game base ===== */
var G=(function(){
  var W=1600,H=900, stage=document.getElementById('stage'), scale=1;
  var DEBUG=/[?&]debug=1/.test(location.search);
  function fit(){
    scale=Math.min(window.innerWidth/W, window.innerHeight/H);
    stage.style.transform='translate(-50%,-50%) scale('+scale+')';
  }
  window.addEventListener('resize',fit); fit();
  function toStage(e){
    var r=stage.getBoundingClientRect();
    return {x:(e.clientX-r.left)/scale, y:(e.clientY-r.top)/scale};
  }
  /* ---------- speech: one queue, never overlapping ---------- */
  var AUDIO=window.AUDIO||{}; var voice=null; var queue=Promise.resolve(); var pending=0;
  function pickVoice(){
    if(!('speechSynthesis' in window)) return;
    var vs=speechSynthesis.getVoices().filter(function(v){return /^en[-_]US/i.test(v.lang);});
    var pref=['Samantha','Google US English','Microsoft Aria','Microsoft Jenny','Karen','Ava','Allison'];
    for(var i=0;i<pref.length;i++){ for(var j=0;j<vs.length;j++){ if(vs[j].name.indexOf(pref[i])>=0){voice=vs[j];return;} } }
    voice=vs[0]||null;
  }
  if('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged=pickVoice; }
  function speakNow(text){
    return new Promise(function(res){
      var done=false; function fin(){ if(!done){done=true; res();} }
      var safety=setTimeout(fin, 1800+text.length*95);
      var file=AUDIO[text];
      if(file){ var a=new Audio(file); a.onended=fin; a.onerror=fin; a.play().catch(fin); return; }
      if(!('speechSynthesis' in window)){ setTimeout(fin, 500+text.length*55); return; }
      var u=new SpeechSynthesisUtterance(text.replace(/\.\.\./g,', '));
      u.lang='en-US'; u.rate=0.9; u.pitch=1.05; if(voice) u.voice=voice;
      u.onend=function(){clearTimeout(safety); setTimeout(fin,120);}; u.onerror=function(){clearTimeout(safety); fin();};
      speechSynthesis.speak(u);
    });
  }
  function say(text){ pending++; queue=queue.then(function(){return speakNow(text);}).then(function(){pending--;}); return queue; }
  function sayIfFree(text){ if(pending>0) return queue; return say(text); }
  function busy(){ return pending>0; }
  /* ---------- sound effects ---------- */
  var ac=null;
  function audioInit(){ try{ if(!ac) ac=new (window.AudioContext||window.webkitAudioContext)(); if(ac.state==='suspended') ac.resume(); }catch(e){} }
  function tone(f,d,type,vol,f2,delay){
    if(!ac) return; var t=ac.currentTime+(delay||0);
    var o=ac.createOscillator(), g=ac.createGain(); o.type=type||'sine'; o.frequency.setValueAtTime(f,t);
    if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+d);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol||0.2,t+0.015); g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+d+0.05);
  }
  function noise(d,vol,freq,delay){
    if(!ac) return; var t=ac.currentTime+(delay||0), n=Math.floor(ac.sampleRate*d), b=ac.createBuffer(1,n,ac.sampleRate), ch=b.getChannelData(0);
    for(var i=0;i<n;i++) ch[i]=(Math.random()*2-1)*Math.sin(Math.PI*i/n);
    var s=ac.createBufferSource(); s.buffer=b; var f=ac.createBiquadFilter(); f.type='bandpass'; f.frequency.value=freq||800; f.Q.value=0.7;
    var g=ac.createGain(); g.gain.value=vol||0.3; s.connect(f); f.connect(g); g.connect(ac.destination); s.start(t);
  }
  var sfx={
    pop:function(){tone(520,0.12,'sine',0.25,980);},
    ding:function(){tone(1046,0.35,'triangle',0.2); tone(1568,0.4,'triangle',0.12,null,0.08);},
    boing:function(){tone(220,0.35,'square',0.08,520);},
    soft:function(){tone(300,0.15,'sine',0.12,240);},
    whoosh:function(){noise(0.9,0.35,600);},
    cheer:function(){[523,659,784,1046].forEach(function(f,i){tone(f,0.25,'triangle',0.18,null,i*0.09);});},
    flip:function(){noise(0.12,0.25,2500);},
    sparkle:function(){[1318,1568,2093].forEach(function(f,i){tone(f,0.18,'sine',0.1,null,i*0.06);});},
    thump:function(){tone(120,0.2,'sine',0.35,60);},
    click:function(){tone(900,0.05,'square',0.06);}
  };
  /* ---------- pictures with placeholders ---------- */
  var img={};
  function loadOne(paths){
    paths=[].concat(paths);
    return new Promise(function(res){
      var i=0; (function next(){
        if(i>=paths.length) return res(null);
        var im=new Image(); im.onload=function(){res(im);}; im.onerror=function(){i++; next();}; im.src=paths[i];
      })();
    });
  }
  function loadPics(P){
    var keys=Object.keys(P);
    return Promise.all(keys.map(function(k){return loadOne(P[k]).then(function(im){img[k]=im;});}));
  }
  /* art(key,{x,y,w,h,emoji,word,cls,parent,z}) -> absolutely positioned element with the picture or a placeholder */
  function art(key,o){
    o=o||{}; var d=document.createElement('div'); d.className='art '+(o.cls||'');
    if(o.w!=null){d.style.width=o.w+'px';} if(o.h!=null){d.style.height=o.h+'px';}
    if(o.x!=null) d.style.left=o.x+'px'; if(o.y!=null) d.style.top=o.y+'px'; if(o.z!=null) d.style.zIndex=o.z;
    var im=img[key];
    if(im){ var c=document.createElement('img'); c.src=im.src; c.alt=''; d.appendChild(c); d.dataset.real='1'; }
    else{ var p=document.createElement('div'); p.className='ph'; p.style.fontSize=Math.round(Math.min(o.w||160,o.h||160)*0.62)+'px';
      p.innerHTML='<div class="e">'+(o.emoji||'🖼️')+'</div>'+(o.word?'<div class="w">'+o.word+'</div>':''); d.appendChild(p); }
    (o.parent||stage).appendChild(d); return d;
  }
  function has(key){ return !!img[key]; }
  /* ---------- helpers ---------- */
  function wait(ms){return new Promise(function(r){setTimeout(r,ms);});}
  function shuffle(a){a=a.slice(); for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t;} return a;}
  function rand(a,b){return a+Math.random()*(b-a);}
  function el(tag,cls,parent,html){var e=document.createElement(tag); if(cls)e.className=cls; if(html!=null)e.innerHTML=html; (parent||stage).appendChild(e); return e;}
  function anim(e,cls){ e.classList.remove(cls); void e.offsetWidth; e.classList.add(cls); setTimeout(function(){e.classList.remove(cls);},600); }
  /* ---------- confetti ---------- */
  var cv=el('canvas',''); cv.id='confetti'; cv.width=W; cv.height=H; var cx=cv.getContext('2d'), parts=[], running=false;
  function confetti(n){
    var cols=['#ff8a1f','#2fbf71','#3d8bff','#ffd23f','#ff5d8f','#9b5de5'];
    for(var i=0;i<(n||160);i++) parts.push({x:rand(0,W),y:rand(-300,-20),vx:rand(-2,2),vy:rand(3,8),r:rand(0,6.3),vr:rand(-.2,.2),s:rand(10,20),c:cols[i%cols.length]});
    if(!running){running=true; requestAnimationFrame(step);}
  }
  function step(){
    cx.clearRect(0,0,W,H);
    parts.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.r+=p.vr; cx.save(); cx.translate(p.x,p.y); cx.rotate(p.r); cx.fillStyle=p.c; cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); cx.restore();});
    parts=parts.filter(function(p){return p.y<H+40;});
    if(parts.length) requestAnimationFrame(step); else {running=false; cx.clearRect(0,0,W,H);}
  }
  /* ---------- start / end screens ---------- */
  function overlay(title,text,btn,cls){
    var o=el('div','overlay'); var c=el('div','ovcard',o);
    el('h1','',c,title); if(text) el('p','',c,text);
    var b=el('button','bigbtn '+(cls||''),c,btn); return {o:o,b:b,c:c};
  }
  function boot(opt){
    var s=overlay(opt.title,opt.instruction,'START');
    s.b.disabled=true; s.b.style.opacity=.5;
    loadPics(opt.pics||{}).then(function(){ s.b.disabled=false; s.b.style.opacity=1; if(opt.ready) opt.ready(); });
    s.b.addEventListener('click',function(){
      audioInit(); if('speechSynthesis' in window){ try{ speechSynthesis.cancel(); var u=new SpeechSynthesisUtterance(' '); u.volume=0; speechSynthesis.speak(u);}catch(e){} }
      sfx.click(); s.o.classList.add('hidden'); opt.start();
    });
    G.end=function(title,text){
      sfx.cheer(); confetti(220);
      var e=overlay(title||'Well done!',text||'','PLAY AGAIN','green');
      e.o.style.background='rgba(19,32,74,.35)';
      e.b.addEventListener('click',function(){ sfx.click(); e.o.remove(); opt.start(); });
    };
  }
  return {W:W,H:H,stage:stage,DEBUG:DEBUG,toStage:toStage,say:say,sayIfFree:sayIfFree,busy:busy,sfx:sfx,img:img,art:art,has:has,
    wait:wait,shuffle:shuffle,rand:rand,el:el,anim:anim,confetti:confetti,boot:boot,audioInit:audioInit,tone:tone,noise:noise,scale:function(){return scale;}};
})();

</script>
<script>
(function(){
var E={SHIRT:'👕',PANTS:'👖',DRESS:'👗',JACKET:'🧥',HAT:'🧢',SOCKS:'🧦',SHOES:'👟',COAT:'🥼',GLASSES:'👓',SCARF:'🧣'};
var OUT=[{w:'snow',set:['COAT','SCARF','HAT'],name:'SNOW'},{w:'rain',set:['JACKET','PANTS','SHOES'],name:'RAIN'},{w:'sun',set:['SHIRT','GLASSES','HAT'],name:'SUN'},{w:'wind',set:['JACKET','SCARF','PANTS'],name:'WIND'}];
var SPOT={HAT:[170,100],GLASSES:[170,196],SCARF:[170,252],COAT:[170,300],JACKET:[170,300],SHIRT:[170,300],PANTS:[170,362],SHOES:[170,408]};
var S=G.stage, astro=document.getElementById('astro'), itemsEl=document.getElementById('items'), thumbs=document.getElementById('thumbs'), mood=document.getElementById('mood');
var idx=0, cur=null, need=null, choices=[], waiting=null;

function setupBg(){
  var bg=document.getElementById('bg'); bg.innerHTML='';
  if(G.has('runway')){ var i=document.createElement('img'); i.src=G.img.runway.src; bg.appendChild(i); return; }
  G.el('div','runway',bg); var l=G.el('div','lights',bg); for(var k=0;k<14;k++){ var d=G.el('i','',l); d.style.animationDelay=(k*.15)+'s'; }
  var people=['🧑','👩','👧','👦','👵','🧔','👨','👱‍♀️'];
  for(var r=0;r<2;r++) for(var j=0;j<4;j++){ var p=G.el('div','crowd',bg,people[(r*4+j)%8]); p.style.left=(40+j*130+r*40)+'px'; p.style.top=(520+r*150)+'px';
    var q=G.el('div','crowd',bg,people[(r*4+j+3)%8]); q.style.left=(1100+j*120-r*40)+'px'; q.style.top=(520+r*150)+'px'; }
}
function drawAstro(o,parent,w,h,glow){
  parent.innerHTML='';
  if(G.has('astro_'+o.w)){ G.art('astro_'+o.w,{x:0,y:0,w:w,h:h,parent:parent}); return; }
  G.art('astro',{x:0,y:0,w:w,h:h,emoji:'👽',parent:parent});
  var k=w/330; o.set.forEach(function(it){ var d=G.el('div','worn',parent); d.dataset.w=it; d.style.cssText='position:absolute;width:'+(96*k)+'px;height:'+(96*k)+'px;left:'+((SPOT[it][0]-48)*k)+'px;top:'+((SPOT[it][1]-48)*k)+'px;z-index:'+(it==='HAT'||it==='GLASSES'||it==='SHOES'?4:3);
    G.art(it,{x:0,y:0,w:96*k,h:96*k,emoji:E[it],parent:d}); });
}
function clap(n){ for(var i=0;i<(n||8);i++) G.noise(0.06,0.5,1800,i*0.09+Math.random()*0.04); }
async function walkIn(){
  astro.style.display='block';
  await astro.animate([{transform:'translateY(-200px) scale(.35)',opacity:0},{transform:'translateY(-90px) scale(.6)',opacity:1,offset:.4},{transform:'translateY(0) scale(1)'}],{duration:1800,easing:'ease-out'}).finished;
  await astro.animate([{transform:'rotateY(0)'},{transform:'rotateY(360deg)'}],{duration:700}).finished;
  clap(10);
}
function showItems(){
  itemsEl.innerHTML=''; itemsEl.style.display='flex';
  G.shuffle(cur.set).forEach(function(w){ var b=G.el('button','ib',itemsEl); b.dataset.w=w; G.art(w,{x:15,y:15,w:140,h:140,emoji:E[w],word:w,parent:b});
    b.addEventListener('click',function(){ tapItem(w,b); }); });
}
async function tapItem(w,b){
  if(!need || b.classList.contains('done')) return;
  if(w!==need){ G.sfx.boing(); G.anim(b,'wobble'); return; }
  b.classList.add('done'); G.sfx.sparkle(); clap(6);
  var worn=astro.querySelector('.worn[data-w="'+w+'"]'); if(worn){ worn.classList.add('glow'); G.anim(worn,'bounce'); } else G.anim(astro,'bounce');
  var r=waiting; need=null; waiting=null; r&&r();
}
function waitFor(w){ need=w; return new Promise(function(r){ waiting=r; }); }
async function outfit(){
  cur=OUT[idx]; mood.style.display='none'; itemsEl.style.display='none'; thumbs.style.display='none';
  drawAstro(cur,astro,330,460); await walkIn();
  await G.say(cur.w==='sun'?'Here is my sunny outfit!':'Here is my '+cur.w+'y outfit!');
  showItems();
  var co=document.getElementById('callout'), ag=document.getElementById('again'); ag.style.display='block';
  for(var i=0;i<cur.set.length;i++){ var w=cur.set[i]; co.textContent='Tap the '+w+'!'; co.style.display='block'; G.anim(co,'bounce'); await G.say(w+'!'); await waitFor(w); await G.wait(250); }
  co.style.display='none'; ag.style.display='none';
  itemsEl.style.display='none'; thumbs.style.display='flex';
  await G.say('Do you like it?');
}
async function vote(like){
  if(thumbs.style.display!=='flex') return;
  thumbs.style.display='none'; choices[idx]=like;
  await G.say(like?'I like it!':"I don't like it!");
  if(like){ G.sfx.cheer(); clap(14);
    if(G.has('bow')){ astro.innerHTML=''; G.art('bow',{x:0,y:0,w:330,h:460,parent:astro}); }
    else await astro.animate([{transform:'rotate(0)'},{transform:'rotate(18deg) translateY(30px)'},{transform:'rotate(0)'}],{duration:900}).finished;
    await G.say('Thank you!');
  } else {
    if(G.has('sulk')){ astro.innerHTML=''; G.art('sulk',{x:0,y:0,w:330,h:460,parent:astro}); } else { mood.textContent='😤'; mood.style.display='block'; G.anim(astro,'wobble'); }
    G.tone(330,0.5,'triangle',0.15,220); await G.wait(900);
    mood.textContent='😄'; mood.style.display='block'; await G.say('Ha ha! OK!');
  }
  await astro.animate([{transform:'translateX(0)',opacity:1},{transform:'translateX(700px)',opacity:0}],{duration:900,easing:'ease-in'}).finished;
  astro.style.display='none'; mood.style.display='none';
  idx++; if(idx<OUT.length) outfit(); else photo();
}
async function photo(){
  await G.say('Smile!'); G.noise(0.15,0.6,4000);
  document.getElementById('flash').animate([{opacity:0},{opacity:1},{opacity:0}],{duration:600});
  var P=document.getElementById('photo'), row=P.querySelector('.row'), btns=P.querySelector('.btns'); row.innerHTML=''; btns.innerHTML='';
  P.style.display='flex';
  OUT.forEach(function(o,i){ var c=G.el('div','ph4',row); c.style.transform='rotate('+[-4,3,-2,4][i]+'deg)'; var inn=G.el('div','in',c);
    var a=G.el('div','',inn); a.style.cssText="position:absolute;left:0;top:6px;width:256px;height:272px"; drawAstro(o,a,195,272); a.style.transform="translateX(30px)";
    G.el('div','st',c,choices[i]?'👍':'👎'); G.el('b','',c,o.name); });
  var save=G.el('button','bigbtn',btns,'SAVE PHOTO'); save.style.fontSize='44px';
  var fin=G.el('button','bigbtn green',btns,'FINISH'); fin.style.fontSize='44px';
  save.onclick=savePhoto; fin.onclick=function(){ P.style.display='none'; G.end('What a show!','Astro was ready for every weather.'); };
  G.sfx.cheer(); G.confetti(140);
}
function savePhoto(){
  var c=document.createElement('canvas'); c.width=1600; c.height=900; var x=c.getContext('2d');
  var gr=x.createLinearGradient(0,0,0,900); gr.addColorStop(0,'#5a3f9e'); gr.addColorStop(1,'#e9506f'); x.fillStyle=gr; x.fillRect(0,0,1600,900);
  if(G.has('runway')) try{ x.drawImage(G.img.runway,0,0,1600,900); }catch(e){}
  x.fillStyle='#fff'; x.font='bold 70px sans-serif'; x.textAlign='center'; x.fillText("Astro's Weather Fashion Show",800,100);
  OUT.forEach(function(o,i){ var X=70+i*375, Y=160; x.fillStyle='#fff'; x.fillRect(X,Y,330,520);
    var im=G.img['astro_'+o.w]||G.img.astro; if(im){ var s=Math.min(300/im.width,420/im.height); x.drawImage(im,X+165-im.width*s/2,Y+20,im.width*s,im.height*s); }
    if(!G.img['astro_'+o.w]){ x.font='60px sans-serif'; o.set.forEach(function(it,j){ x.fillText(E[it],X+60,Y+90+j*80); }); }
    x.font='90px sans-serif'; x.fillText(choices[i]?'👍':'👎',X+280,Y+80); x.fillStyle='#1e2a5a'; x.font='bold 46px sans-serif'; x.fillText(o.name,X+165,Y+495); });
  try{ c.toBlob(function(b){ var a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='astro_fashion_show.png'; document.body.appendChild(a); a.click(); a.remove(); }); }
  catch(e){ G.say('Sorry, I can\'t save here.'); }
}
function start(){ document.getElementById('photo').style.display='none'; setupBg(); idx=0; choices=[]; astro.style.display='none';
  G.say('Welcome to the weather fashion show!').then(outfit); }
document.getElementById('again').onclick=function(){ if(need) G.sayIfFree(need+'!'); };
thumbs.querySelector('.up').onclick=function(){vote(true);}; thumbs.querySelector('.dn').onclick=function(){vote(false);};
window.__game={state:function(){return {idx:idx,need:need,thumbs:thumbs.style.display==='flex',photo:document.getElementById('photo').style.display==='flex'};}};
G.boot({title:'Weather Fashion Show',instruction:'Astro shows his outfits.<br>Listen! <b>Tap</b> the clothes in the order Astro says them.<br>Then tell him: I like it! or I don\'t like it!',pics:PICS,ready:setupBg,start:start});
})();
</script>
