<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>HURRY!</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#13204a;touch-action:none;user-select:none;-webkit-user-select:none}
body{font-family:ui-rounded,"Arial Rounded MT Bold","Nunito","Varela Round","Trebuchet MS",system-ui,sans-serif;color:#1e2a5a}
#stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform-origin:center center;overflow:hidden;background:#bfe6ff;border-radius:6px}
#stage img{-webkit-user-drag:none;user-select:none;pointer-events:none}
.layer{position:absolute;inset:0}
.overlay{position:absolute;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;background:rgba(19,32,74,.62);text-align:center;padding:40px}
.overlay.hidden{display:none}
.ovcard{background:#fff;border-radius:44px;padding:48px 70px;box-shadow:0 18px 0 rgba(0,0,0,.18);max-width:1150px;display:flex;flex-direction:column;align-items:center;gap:22px}
.ovcard h1{margin:0;font-size:84px;line-height:1.05;color:#1e2a5a}
.ovcard p{margin:0;font-size:40px;line-height:1.3;color:#3b4a7a}
.bigbtn{font:inherit;font-size:58px;font-weight:800;color:#fff;background:#ff8a1f;border:0;border-radius:999px;padding:22px 80px;box-shadow:0 10px 0 #c95f00;cursor:pointer;letter-spacing:2px}
.bigbtn:active{transform:translateY(6px);box-shadow:0 4px 0 #c95f00}
.bigbtn.green{background:#2fbf71;box-shadow:0 10px 0 #1d8a4f}
.ph{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100%;border-radius:26px;background:rgba(255,255,255,.88);border:5px dashed #8fa2d6;color:#1e2a5a;font-weight:800;text-align:center;overflow:hidden;line-height:1}
.ph .e{font-size:1em}
.ph .w{font-size:.28em;margin-top:.08em;letter-spacing:1px}
.art{position:absolute;display:flex;align-items:flex-end;justify-content:center}
.art>img{width:100%;height:100%;object-fit:contain}
.wobble{animation:wob .5s}
@keyframes wob{0%,100%{translate:0 0;rotate:0deg}20%{translate:-14px 0;rotate:-4deg}40%{translate:12px 0;rotate:3deg}60%{translate:-8px 0;rotate:-2deg}80%{translate:5px 0;rotate:0deg}}
.bounce{animation:bnc .45s}
@keyframes bnc{0%,100%{scale:1}40%{scale:1.18}70%{scale:.95}}
.bubble{pointer-events:none;position:absolute;background:#fff;border-radius:34px;padding:18px 30px;font-size:42px;font-weight:800;box-shadow:0 8px 0 rgba(0,0,0,.15);z-index:40;white-space:nowrap}
#confetti{position:absolute;inset:0;pointer-events:none;z-index:120}
#soundHint{position:absolute;right:18px;top:14px;z-index:90;font-size:34px;background:rgba(255,255,255,.85);border-radius:999px;padding:6px 16px;display:none}

#view{position:absolute;left:0;top:150px;width:1600px;height:750px;overflow:hidden;background:#fff1d6}
#world{position:absolute;left:0;top:0;height:750px;will-change:transform}
#world>img{position:absolute;left:0;top:0;height:750px;width:auto}
.rm{position:absolute;top:0;height:640px}
.rm .lab{position:absolute;left:30px;top:20px;font-size:34px;font-weight:900;color:rgba(30,42,90,.5)}
.prop{position:absolute;line-height:1}
.flr{position:absolute;left:0;right:0;top:640px;height:110px;background:#c9a37a;border-top:8px solid #a8805a}
.ob{position:absolute;width:110px;height:110px;top:545px;z-index:3}
.ob .art{left:0;top:0}
#hero{position:absolute;left:330px;top:300px;width:230px;height:340px;z-index:5;pointer-events:none}
#hero .art{left:0;top:0}
#hero.dash{filter:drop-shadow(-40px 0 0 rgba(61,139,255,.35)) drop-shadow(-80px 0 0 rgba(61,139,255,.2))}
#street{position:absolute;left:0;top:0;width:1600px;height:150px;background:linear-gradient(#bfe6ff 0 55%,#8a8f99 55%);overflow:hidden}
#street .line{position:absolute;left:0;right:0;top:112px;height:6px;background:repeating-linear-gradient(90deg,#fff 0 40px,transparent 40px 80px)}
#stop{position:absolute;right:60px;top:10px;font-size:60px}
#stoplab{position:absolute;right:20px;top:72px;font-size:22px;font-weight:900;background:#fff;border-radius:8px;padding:0 8px}
#bus{position:absolute;left:0;top:30px;width:180px;height:90px;z-index:2}
#bus .art{left:0;top:0}
#bus .ph{background:transparent;border:0}
#cards{position:absolute;left:0;right:0;top:300px;z-index:20;display:none;justify-content:center;gap:40px}
.rc{width:260px;height:230px;background:#fff;border:0;border-radius:30px;box-shadow:0 10px 0 rgba(0,0,0,.2);cursor:pointer;position:relative;display:flex;flex-direction:column;align-items:center;padding-top:8px;font:inherit}
.rc .pic{position:relative;width:220px;height:160px}
.rc .pic .art{left:0;top:0}
.rc b{font-size:28px;color:#1e2a5a;margin-top:2px}
#flash{position:absolute;left:50%;top:330px;transform:translateX(-50%);width:360px;height:300px;z-index:25;display:none}
#flash .art{left:0;top:0}
#say{position:absolute;left:50%;top:170px;transform:translateX(-50%);font-size:52px;z-index:30}
#jump{position:absolute;right:30px;bottom:30px;width:200px;height:150px;border-radius:80px;border:0;background:rgba(255,138,31,.9);box-shadow:0 8px 0 #c95f00;color:#fff;font-size:48px;font-weight:900;z-index:30;touch-action:none}
#lines{position:absolute;left:0;top:0;width:1600px;height:750px;pointer-events:none;z-index:4}
</style></head>
<body>
<div id="stage">
  <div id="street"><div class="line"></div><div id="stop">🚏</div><div id="stoplab">SCHOOL BUS</div><div id="bus"></div></div>
  <div id="view"><div id="world"></div><div id="hero"></div></div>
  <div id="cards"></div>
  <div id="flash"></div>
  <button id="jump">JUMP</button>
  <div class="bubble" id="say" style="display:none"></div>
</div>
<script>
var AUDIO={};
var PICS={ house:'images/l6/house_run.jpg', bus:'images/l6/bus.png', run1:['images/l6/astro_run1.png','images/astro.png'], run2:['images/l6/astro_run2.png','images/astro.png'],
  ob_car:'images/l6/ob_car.png', ob_cat:'images/l6/ob_cat.png', ob_books:'images/l6/ob_books.png' };
['wake','shower','brush','dressed','breakfast'].forEach(function(k){ PICS['card_'+k]='images/l6/card_'+k+'.png'; });
</script>
<script>
/* ===== Astro & Alex shared game base ===== */
var G=(function(){
  var W=1600,H=900, stage=document.getElementById('stage'), scale=1;
  var DEBUG=/[?&]debug=1/.test(location.search);
  function fit(){
    scale=Math.min(window.innerWidth/W, window.innerHeight/H);
    stage.style.transform='translate(-50%,-50%) scale('+scale+')';
  }
  window.addEventListener('resize',fit); fit();
  function toStage(e){
    var r=stage.getBoundingClientRect();
    return {x:(e.clientX-r.left)/scale, y:(e.clientY-r.top)/scale};
  }
  /* ---------- speech: one queue, never overlapping ---------- */
  var AUDIO=window.AUDIO||{}; var voice=null; var queue=Promise.resolve(); var pending=0;
  function pickVoice(){
    if(!('speechSynthesis' in window)) return;
    var vs=speechSynthesis.getVoices().filter(function(v){return /^en[-_]US/i.test(v.lang);});
    var pref=['Samantha','Google US English','Microsoft Aria','Microsoft Jenny','Karen','Ava','Allison'];
    for(var i=0;i<pref.length;i++){ for(var j=0;j<vs.length;j++){ if(vs[j].name.indexOf(pref[i])>=0){voice=vs[j];return;} } }
    voice=vs[0]||null;
  }
  if('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged=pickVoice; }
  function speakNow(text,o){ o=o||{};
    return new Promise(function(res){
      var done=false; function fin(){ if(!done){done=true; res();} }
      var safety=setTimeout(fin, 1800+text.length*95);
      var file=AUDIO[text];
      if(file){ var a=new Audio(file); a.onended=fin; a.onerror=fin; a.play().catch(fin); return; }
      if(!('speechSynthesis' in window)){ setTimeout(fin, 500+text.length*55); return; }
      var u=new SpeechSynthesisUtterance(text.replace(/\.\.\./g,', '));
      u.lang='en-US'; u.rate=o.rate||0.9; u.pitch=o.pitch||1.05; if(voice) u.voice=voice;
      u.onend=function(){clearTimeout(safety); setTimeout(fin,120);}; u.onerror=function(){clearTimeout(safety); fin();};
      speechSynthesis.speak(u);
    });
  }
  function say(text,o){ pending++; queue=queue.then(function(){return speakNow(text,o);}).then(function(){pending--;}); return queue; }
  function sayIfFree(text){ if(pending>0) return queue; return say(text); }
  function busy(){ return pending>0; }
  /* ---------- sound effects ---------- */
  var ac=null;
  function audioInit(){ try{ if(!ac) ac=new (window.AudioContext||window.webkitAudioContext)(); if(ac.state==='suspended') ac.resume(); }catch(e){} }
  function tone(f,d,type,vol,f2,delay){
    if(!ac) return; var t=ac.currentTime+(delay||0);
    var o=ac.createOscillator(), g=ac.createGain(); o.type=type||'sine'; o.frequency.setValueAtTime(f,t);
    if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+d);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol||0.2,t+0.015); g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+d+0.05);
  }
  function noise(d,vol,freq,delay){
    if(!ac) return; var t=ac.currentTime+(delay||0), n=Math.floor(ac.sampleRate*d), b=ac.createBuffer(1,n,ac.sampleRate), ch=b.getChannelData(0);
    for(var i=0;i<n;i++) ch[i]=(Math.random()*2-1)*Math.sin(Math.PI*i/n);
    var s=ac.createBufferSource(); s.buffer=b; var f=ac.createBiquadFilter(); f.type='bandpass'; f.frequency.value=freq||800; f.Q.value=0.7;
    var g=ac.createGain(); g.gain.value=vol||0.3; s.connect(f); f.connect(g); g.connect(ac.destination); s.start(t);
  }
  var sfx={
    pop:function(){tone(520,0.12,'sine',0.25,980);},
    ding:function(){tone(1046,0.35,'triangle',0.2); tone(1568,0.4,'triangle',0.12,null,0.08);},
    boing:function(){tone(220,0.35,'square',0.08,520);},
    soft:function(){tone(300,0.15,'sine',0.12,240);},
    whoosh:function(){noise(0.9,0.35,600);},
    cheer:function(){[523,659,784,1046].forEach(function(f,i){tone(f,0.25,'triangle',0.18,null,i*0.09);});},
    flip:function(){noise(0.12,0.25,2500);},
    sparkle:function(){[1318,1568,2093].forEach(function(f,i){tone(f,0.18,'sine',0.1,null,i*0.06);});},
    thump:function(){tone(120,0.2,'sine',0.35,60);},
    click:function(){tone(900,0.05,'square',0.06);}
  };
  /* ---------- pictures with placeholders ---------- */
  var img={};
  function loadOne(paths){
    paths=[].concat(paths);
    return new Promise(function(res){
      var i=0; (function next(){
        if(i>=paths.length) return res(null);
        var im=new Image(); im.onload=function(){res(im);}; im.onerror=function(){i++; next();}; im.src=paths[i];
      })();
    });
  }
  function loadPics(P){
    var keys=Object.keys(P);
    return Promise.all(keys.map(function(k){return loadOne(P[k]).then(function(im){img[k]=im;});}));
  }
  /* art(key,{x,y,w,h,emoji,word,cls,parent,z}) -> absolutely positioned element with the picture or a placeholder */
  function art(key,o){
    o=o||{}; var d=document.createElement('div'); d.className='art '+(o.cls||'');
    if(o.w!=null){d.style.width=o.w+'px';} if(o.h!=null){d.style.height=o.h+'px';}
    if(o.x!=null) d.style.left=o.x+'px'; if(o.y!=null) d.style.top=o.y+'px'; if(o.z!=null) d.style.zIndex=o.z;
    var im=img[key];
    if(im){ var c=document.createElement('img'); c.src=im.src; c.alt=''; d.appendChild(c); d.dataset.real='1'; }
    else{ var p=document.createElement('div'); p.className='ph'; p.style.fontSize=Math.round(Math.min(o.w||160,o.h||160)*0.62)+'px';
      p.innerHTML='<div class="e">'+(o.emoji||'🖼️')+'</div>'+(o.word?'<div class="w">'+o.word+'</div>':''); d.appendChild(p); }
    (o.parent||stage).appendChild(d); return d;
  }
  function has(key){ return !!img[key]; }
  /* ---------- helpers ---------- */
  function wait(ms){return new Promise(function(r){setTimeout(r,ms);});}
  function shuffle(a){a=a.slice(); for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t;} return a;}
  function rand(a,b){return a+Math.random()*(b-a);}
  function el(tag,cls,parent,html){var e=document.createElement(tag); if(cls)e.className=cls; if(html!=null)e.innerHTML=html; (parent||stage).appendChild(e); return e;}
  function anim(e,cls){ e.classList.remove(cls); void e.offsetWidth; e.classList.add(cls); setTimeout(function(){e.classList.remove(cls);},600); }
  /* ---------- confetti ---------- */
  var cv=el('canvas',''); cv.id='confetti'; cv.width=W; cv.height=H; var cx=cv.getContext('2d'), parts=[], running=false;
  function confetti(n){
    var cols=['#ff8a1f','#2fbf71','#3d8bff','#ffd23f','#ff5d8f','#9b5de5'];
    for(var i=0;i<(n||160);i++) parts.push({x:rand(0,W),y:rand(-300,-20),vx:rand(-2,2),vy:rand(3,8),r:rand(0,6.3),vr:rand(-.2,.2),s:rand(10,20),c:cols[i%cols.length]});
    if(!running){running=true; requestAnimationFrame(step);}
  }
  function step(){
    cx.clearRect(0,0,W,H);
    parts.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.r+=p.vr; cx.save(); cx.translate(p.x,p.y); cx.rotate(p.r); cx.fillStyle=p.c; cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); cx.restore();});
    parts=parts.filter(function(p){return p.y<H+40;});
    if(parts.length) requestAnimationFrame(step); else {running=false; cx.clearRect(0,0,W,H);}
  }
  /* ---------- start / end screens ---------- */
  function overlay(title,text,btn,cls){
    var o=el('div','overlay'); var c=el('div','ovcard',o);
    el('h1','',c,title); if(text) el('p','',c,text);
    var b=el('button','bigbtn '+(cls||''),c,btn); return {o:o,b:b,c:c};
  }
  function boot(opt){
    var s=overlay(opt.title,opt.instruction,'START');
    s.b.disabled=true; s.b.style.opacity=.5;
    loadPics(opt.pics||{}).then(function(){ s.b.disabled=false; s.b.style.opacity=1; if(opt.ready) opt.ready(); });
    s.b.addEventListener('click',function(){
      audioInit(); if('speechSynthesis' in window){ try{ speechSynthesis.cancel(); var u=new SpeechSynthesisUtterance(' '); u.volume=0; speechSynthesis.speak(u);}catch(e){} }
      sfx.click(); s.o.classList.add('hidden'); opt.start();
    });
    G.end=function(title,text){
      sfx.cheer(); confetti(220);
      var e=overlay(title||'Well done!',text||'','PLAY AGAIN','green');
      e.o.style.background='rgba(19,32,74,.35)';
      e.b.addEventListener('click',function(){ sfx.click(); e.o.remove(); opt.start(); });
    };
  }
  return {W:W,H:H,stage:stage,DEBUG:DEBUG,toStage:toStage,say:say,sayIfFree:sayIfFree,busy:busy,sfx:sfx,img:img,art:art,has:has,
    wait:wait,shuffle:shuffle,rand:rand,el:el,anim:anim,confetti:confetti,boot:boot,audioInit:audioInit,tone:tone,noise:noise,scale:function(){return scale;}};
})();

</script>
<script>
(function(){
var R={wake:['WAKE UP','⏰'],shower:['SHOWER','🚿'],brush:['BRUSH TEETH','🪥'],dressed:['GET DRESSED','👕'],breakfast:['BREAKFAST','🥣']};
var ROOMS=[['Bedroom','#dbe9ff',[['🛏️',300,330,280]]],['Bathroom','#d6f3ff',[['🚿',380,200,260]]],['Bathroom','#d6f3ff',[['🪞',300,120,200],['🚰',330,330,160]]],['Bedroom','#ffe7f0',[['🚪',330,170,320]]],['Kitchen','#fff1d6',[['🍳',260,300,150],['🥛',520,330,120]]],['Front door','#e8ffe9',[['🚪',400,170,320]]]];
var CP=[{k:'wake',x:520},{k:'shower',x:1560},{k:'brush',x:2620},{k:'dressed',x:3720},{k:'breakfast',x:4760}];
var OBS=[['ob_car','🚗',1050],['ob_cat','🐈',2100],['ob_books','📚',3170],['ob_cat','🐈',4250],['ob_car','🚗',5300]];
var ROOMW=1100, WORLD=6600, DOOR=5980, HERO_X=445, SPEED=330, TOTAL=75;
var S=G.stage, world=document.getElementById('world'), hero=document.getElementById('hero'), sayEl=document.getElementById('say'), cardsEl=document.getElementById('cards');
var wx=0, t=0, state='idle', cpi=0, boost=0, stumble=0, jumpY=0, jumpV=0, frame=0, ft=0, last=performance.now(), busWait=false, obs=[], heroKey='';
function talk(s){ sayEl.textContent=s; sayEl.style.display='block'; G.anim(sayEl,'bounce'); clearTimeout(talk.t); talk.t=setTimeout(function(){sayEl.style.display='none';},2500); return G.say(s); }
function build(){
  world.innerHTML=''; world.style.width=WORLD+'px'; obs=[];
  if(G.has('house')){ var im=document.createElement('img'); im.src=G.img.house.src; world.appendChild(im); }
  else { ROOMS.forEach(function(r,i){ var d=G.el('div','rm',world); d.style.left=(i*ROOMW)+'px'; d.style.width=ROOMW+'px'; d.style.background=r[1]; d.style.borderRight='12px solid #fff';
      G.el('div','lab',d,r[0]); r[2].forEach(function(p){ var e=G.el('div','prop',d,p[0]); e.style.left=p[1]+'px'; e.style.top=p[2]+'px'; e.style.fontSize=p[3]+'px'; }); });
    var f=G.el('div','flr',world); f.style.width=WORLD+'px'; }
  OBS.forEach(function(o){ var d=G.el('div','ob',world); d.style.left=o[2]+'px'; G.art(o[0],{x:0,y:0,w:110,h:110,emoji:o[1],parent:d}); obs.push({x:o[2],el:d,hit:false}); });
  var b=document.getElementById('bus'); b.innerHTML=''; G.art('bus',{x:0,y:0,w:180,h:90,emoji:'🚌',parent:b});
}
function drawHero(k){ if(k===heroKey) return; heroKey=k; hero.innerHTML=''; G.art(k,{x:0,y:0,w:230,h:340,emoji:'👽',parent:hero}); }
function showCards(k){
  var opts=G.shuffle([k].concat(G.shuffle(Object.keys(R).filter(function(x){return x!==k;})).slice(0,2)));
  cardsEl.innerHTML=''; cardsEl.style.display='flex';
  opts.forEach(function(o){ var b=G.el('button','rc',cardsEl); b.dataset.k=o; var p=G.el('div','pic',b); G.art('card_'+o,{x:0,y:0,w:220,h:160,emoji:R[o][1],parent:p}); G.el('b','',b,R[o][0]);
    b.addEventListener('pointerdown',function(e){ e.stopPropagation(); pickCard(o,b); }); });
}
async function pickCard(o,b){
  if(state!=='cp') return; var k=CP[cpi].k;
  if(o!==k){ G.sfx.boing(); G.anim(b,'wobble'); G.sayIfFree(R[k][0]+'!'); return; }
  state='busy'; cardsEl.style.display='none'; G.sfx.ding();
  var f=document.getElementById('flash'); f.innerHTML=''; G.art('card_'+k,{x:0,y:0,w:360,h:300,emoji:R[k][1],parent:f}); f.style.display='block'; f.animate([{transform:'translateX(-50%) scale(.4)'},{transform:'translateX(-50%) scale(1.1)'},{transform:'translateX(-50%) scale(1)'}],{duration:500});
  await G.wait(700); f.style.display='none';
  talk('I HURRY!'); boost=1.3; cpi++; state='run'; G.sfx.whoosh();
}
function jump(){ if(state==='run' && jumpY===0 && jumpV===0){ jumpV=-1500; G.tone(420,0.15,'sine',0.12,760); } }
function tick(now){
  var dt=Math.min(0.05,(now-last)/1000); last=now;
  if(state!=='idle' && state!=='done'){
    if(!busWait){ t+=dt; if(t>=TOTAL){ t=TOTAL; busWait=true; talk('The driver is kind! He waits!'); } }
    var bx=(t/TOTAL)*(1600-60-180-120); document.getElementById('bus').style.left=bx+'px';
  }
  if(state==='run'){
    var sp=SPEED*(boost>0?2.2:1)*(stumble>0?0.15:1); boost=Math.max(0,boost-dt); stumble=Math.max(0,stumble-dt);
    wx+=sp*dt; hero.classList.toggle('dash',boost>0);
    if(jumpV!==0||jumpY<0){ jumpV+=4200*dt; jumpY+=jumpV*dt; if(jumpY>=0){ jumpY=0; jumpV=0; } }
    ft+=dt; if(ft>0.12){ ft=0; frame^=1; } drawHero(frame?'run2':'run1');
    hero.style.transform='translateY('+jumpY+'px)'+(G.has('run1')?'':' rotate('+(frame?4:-4)+'deg)')+(stumble>0?' rotate(18deg)':'');
    obs.forEach(function(o){ var sx=o.x-wx; if(!o.hit && sx<HERO_X+40 && sx>HERO_X-60){ if(jumpY>-90){ o.hit=true; stumble=0.8; G.sfx.thump(); } else o.hit=true; } });
    if(cpi<CP.length && wx>=CP[cpi].x-HERO_X){ wx=CP[cpi].x-HERO_X; state='cp'; hero.style.transform=''; var k=CP[cpi].k; showCards(k); G.say(R[k][0]+'!'); }
    if(cpi>=CP.length && wx>=DOOR-HERO_X){ wx=DOOR-HERO_X; finish(); }
  }
  world.style.transform='translateX('+(-wx)+'px)';
  requestAnimationFrame(tick);
}
async function finish(){
  state='done'; hero.style.transform=''; document.getElementById('bus').animate([{left:document.getElementById('bus').style.left},{left:(1600-60-180-120)+'px'}],{duration:600,fill:'forwards'});
  G.sfx.cheer(); G.confetti(150); await talk('I made it! Here is the bus!'); G.end('You made the bus!','Astro did his whole morning.');
}
document.getElementById('jump').addEventListener('pointerdown',function(e){ e.preventDefault(); jump(); });
document.getElementById('view').addEventListener('pointerdown',function(){ jump(); });
window.addEventListener('keydown',function(e){ if(e.key===' '||e.key==='ArrowUp'){ e.preventDefault(); jump(); } });
async function start(){ build(); wx=0; t=0; cpi=0; boost=0; stumble=0; jumpY=0; jumpV=0; busWait=false; heroKey=''; drawHero('run1'); state='busy'; cardsEl.style.display='none';
  await talk('The bus is coming! HURRY!'); state='run'; }
window.__game={state:function(){ var nx=obs.find(function(o){return !o.hit && o.x-wx>HERO_X-60;}); return {state:state,cpi:cpi,k:CP[cpi]&&CP[cpi].k,t:t,obDist:nx?nx.x-wx-HERO_X:9999}; }};
G.boot({title:'HURRY!',instruction:'The school bus is coming!<br>Listen and <b>tap</b> the right card at each stop.<br>Tap the room or press JUMP to jump over things!',pics:PICS,ready:build,start:start});
requestAnimationFrame(tick);
})();
</script>
