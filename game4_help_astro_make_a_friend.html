    background-position:center bottom;
    background-repeat:no-repeat;
  }

  /* ---------------- characters ---------------- */
  #astro-char, #alex-char{
    position:absolute; bottom:8%;
    pointer-events:none;
  }
  #astro-char{ left:8%; transition:left .12s linear; }
  #alex-char{ left:74%; }
  #astro-char img{ display:block; height:150px; width:auto; filter:drop-shadow(0 8px 10px rgba(0,0,0,0.3)); }
  #alex-char img{ display:block; height:165px; width:auto; filter:drop-shadow(0 8px 10px rgba(0,0,0,0.3)); }

  @keyframes glowPulse{
    0%,100%{ filter:drop-shadow(0 8px 10px rgba(0,0,0,0.3)) drop-shadow(0 0 0 rgba(95,217,232,0)); }
    50%{ filter:drop-shadow(0 8px 10px rgba(0,0,0,0.3)) drop-shadow(0 0 22px rgba(95,217,232,0.9)); }
  }
  .talking img{ animation:glowPulse 1s ease-in-out infinite; }

  @keyframes happyBounce{
    0%,100%{ transform:scale(1) rotate(0deg); }
    30%{ transform:scale(1.15) rotate(-3deg); }
    60%{ transform:scale(0.95) rotate(3deg); }
  }
  .celebrate img{ animation:happyBounce 0.6s ease; }

  #hug-hearts{ position:absolute; left:50%; bottom:40%; transform:translate(-50%,0); font-size:32px; opacity:0; pointer-events:none; transition:opacity .3s, transform .3s; z-index:15; }
  #hug-hearts.show{ opacity:1; transform:translate(-50%,-14px) scale(1.15); }
  #astro-char.hugging{ left:56% !important; }
  #alex-char.hugging{ transform:translateX(-10px); }
  #alex-char{ transition:transform .5s ease; }

  /* ---------------- stage UI ---------------- */
  #stage-badge{
    position:absolute; top:12px; left:50%; transform:translateX(-50%);
    z-index:15; background:rgba(10,14,40,0.75); border:2px solid rgba(95,217,232,0.5);
    color:var(--white); font-weight:800; font-size:12px; padding:5px 14px; border-radius:999px;
  }
  #caption-bar{
    position:absolute; left:50%; bottom:16px; transform:translateX(-50%);
    width:min(560px,92%); z-index:15;
    background:rgba(10,14,40,0.88); border:3px solid rgba(95,217,232,0.55); border-radius:20px;
    padding:14px 18px; box-shadow:0 8px 24px rgba(0,0,0,0.35);
  }
  #caption-speaker{ display:inline-block; font-size:11px; font-weight:800; letter-spacing:1px; color:#08340C; background:var(--fuel-amber); padding:3px 12px; border-radius:999px; margin-bottom:8px; }
  #caption-text{ color:var(--white); font-size:clamp(16px,3.4vw,21px); font-weight:700; line-height:1.4; min-height:1.3em; }
  #instruction-text{ color:#AEB8E8; font-weight:700; font-size:13px; margin-top:6px; }

  #stage-area{
    position:absolute; left:50%; bottom:120px; transform:translateX(-50%);
    width:min(560px,92%); z-index:15;
    display:flex; flex-direction:column; align-items:center; gap:10px;
  }

  .bubble-row{ display:flex; gap:18px; justify-content:center; flex-wrap:wrap; }
  .bubble-choice{ cursor:pointer; transition:transform .1s; }
  .bubble-choice img{ display:block; filter:drop-shadow(0 5px 8px rgba(0,0,0,0.3)); }
  .bubble-choice:active{ transform:scale(0.94); }
  .bubble-choice.wrong-shake{ animation:wrongShake 0.4s; }
  @keyframes wrongShake{ 0%,100%{transform:translateX(0);} 25%{transform:translateX(-8px);} 75%{transform:translateX(8px);} }

  #move-track{ position:relative; width:100%; height:10px; background:rgba(255,255,255,0.15); border-radius:999px; }
  #move-fill{ position:absolute; left:0; top:0; height:100%; width:0%; background:linear-gradient(90deg,var(--astro-green-dark),var(--astro-green)); border-radius:999px; }
  #move-hint{ text-align:center; color:var(--white); font-weight:700; font-size:13px; }

  #dragzone{ position:relative; width:100%; height:90px; }
  #nametag-chip{
    position:absolute; left:6%; top:20px; cursor:grab;
    background:var(--fuel-amber); color:#08340C; font-weight:800; font-size:14px;
    padding:10px 18px; border-radius:999px; box-shadow:0 4px 10px rgba(0,0,0,0.3);
    touch-action:none;
  }
  #dropzone{
    position:absolute; right:4%; top:8px; width:110px; height:56px;
    border:3px dashed rgba(255,255,255,0.5); border-radius:16px;
    display:flex; align-items:center; justify-content:center;
    color:rgba(255,255,255,0.6); font-weight:800; font-size:12px;
  }
  #dropzone.hover{ border-color:var(--astro-green); background:rgba(126,217,87,0.15); }

  #balloon-wrap{ position:relative; cursor:pointer; margin-bottom:4px; }
  #balloon-wrap img{ display:block; filter:drop-shadow(0 6px 10px rgba(0,0,0,0.3)); }
  #balloon-number{
    position:absolute; left:50%; top:38%; transform:translate(-50%,-50%);
    font-size:34px; font-weight:800; color:#fff; text-shadow:0 2px 4px rgba(0,0,0,0.35);
  }
  #balloon-wrap.popped{ animation:popReveal 0.4s ease-out forwards; }
  @keyframes popReveal{ 0%{ transform:scale(1);} 40%{ transform:scale(1.3);} 100%{ transform:scale(1.12);} }

  .match-row{ display:flex; gap:18px; justify-content:center; }
  .match-card{
    background:rgba(255,255,255,0.1); border:3px solid rgba(95,217,232,0.5); border-radius:16px;
    padding:12px; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:6px; width:100px;
  }
  .match-card:active{ background:rgba(95,217,232,0.25); }
  .match-card img{ display:block; max-height:64px; width:auto; }
  .match-card .label{ color:var(--white); font-weight:800; font-size:12px; }
  .match-card.wrong-shake{ animation:wrongShake 0.4s; }

  #hug-btn{ background:none; border:none; padding:0; cursor:pointer; }
  #hug-btn img{ display:block; height:64px; width:auto; filter:drop-shadow(0 5px 10px rgba(0,0,0,0.3)); }
  #hug-btn:active img{ transform:scale(0.94); }

  .overlay{
    position:absolute; inset:0; z-index:30;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; gap:16px; padding:24px;
    background:radial-gradient(ellipse at center, rgba(20,26,72,0.92) 0%, rgba(7,10,34,0.97) 78%);
  }
  .hidden{ display:none !important; }
  .overlay h1{ color:var(--white); font-size:clamp(24px,6vw,38px); margin:0; }
  .overlay p.sub{ color:#C7CFF2; font-size:clamp(14px,3vw,17px); max-width:420px; margin:0; line-height:1.5; }
  .big-btn{
    font-family:inherit; font-size:22px; font-weight:800; color:#08340C;
    background:linear-gradient(180deg,#9BEE6E,var(--astro-green) 60%,var(--astro-green-dark));
    border:none; border-radius:999px; padding:16px 44px; cursor:pointer;
    box-shadow:0 6px 0 #2F6B1B, 0 10px 18px rgba(0,0,0,0.35);
  }
  .big-btn:active{ transform:translateY(4px); box-shadow:0 2px 0 #2F6B1B; }
  .ghost-btn{
    font-family:inherit; font-size:15px; font-weight:700; color:var(--ui-cyan);
    background:transparent; border:2px solid rgba(95,217,232,0.5); border-radius:999px; padding:10px 22px; cursor:pointer;
  }
  #particles-layer{ position:absolute; inset:0; pointer-events:none; z-index:26; overflow:hidden; }
  .confetti{ position:absolute; width:8px; height:8px; border-radius:2px; top:0; left:0; }
</style>
</head>

<script>
(function(){
  "use strict";
  function boot(){

    function speakFallback(text){
      try{
        if('speechSynthesis' in window){
          window.speechSynthesis.cancel();
          var u = new SpeechSynthesisUtterance(text);
          u.rate = 0.86; u.pitch = 1.0; u.lang = 'en-US';
          window.speechSynthesis.speak(u);
        }
      }catch(e){}
    }
    function speakWord(text, audioName){
      var done=false;
      if(audioName){
        var a = new Audio(audioName);
        a.oncanplaythrough=function(){ if(!done){done=true;a.play();} };
        a.onerror=function(){ if(!done){done=true;speakFallback(text);} };
        a.load();
        setTimeout(function(){ if(!done){done=true;speakFallback(text);} },700);
      } else { speakFallback(text); }
    }
    var AudioCtx = window.AudioContext || window.webkitAudioContext;
    var actx=null;
    function tone(freq,dur,type,vol){
      try{
        if(!actx) actx=new AudioCtx();
        var o=actx.createOscillator(), g=actx.createGain();
        o.type=type||'sine'; o.frequency.value=freq; g.gain.value=vol!=null?vol:0.15;
        o.connect(g); g.connect(actx.destination);
        var now=actx.currentTime;
        g.gain.setValueAtTime(g.gain.value,now);
        g.gain.exponentialRampToValueAtTime(0.001, now+dur);
        o.start(now); o.stop(now+dur);
      }catch(e){}
    }
    function sfxWrong(){ tone(300,0.12,'sine',0.10); }
    function sfxGood(){ tone(880,0.12,'triangle',0.16); setTimeout(function(){tone(1320,0.12,'triangle',0.14);},80); }
    function sfxSuccess(){ [523,659,784,1047].forEach(function(f,i){ setTimeout(function(){tone(f,0.26,'triangle',0.16);},i*100); }); }

    var astroChar = document.getElementById('astro-char');
    var alexChar = document.getElementById('alex-char');
    var stageArea = document.getElementById('stage-area');
    var stageBadge = document.getElementById('stage-badge');
    var captionSpeaker = document.getElementById('caption-speaker');
    var captionText = document.getElementById('caption-text');
    var instructionText = document.getElementById('instruction-text');
    var container = document.getElementById('game-container');

    function say(speaker, text, instruction){
      captionSpeaker.textContent = speaker;
      captionText.textContent = text;
      instructionText.textContent = instruction || '';
      speakWord(text, null);
    }
    function glow(who, on){
      var el = who==='astro' ? astroChar : alexChar;
      el.classList.toggle('talking', on);
    }
    function celebrate(who){
      var el = who==='astro' ? astroChar : alexChar;
      el.classList.remove('celebrate'); void el.offsetWidth; el.classList.add('celebrate');
    }

    function confettiBurst(p, colors){
      var layer = document.getElementById('particles-layer');
      colors = colors || ['#FFC93C','#7ED957','#5FD9E8','#F4F7FF'];
      for(var i=0;i<16;i++){
        var el = document.createElement('div');
        el.className='confetti';
        el.style.background = colors[i%colors.length];
        el.style.left = p.x+'px'; el.style.top = p.y+'px';
        layer.appendChild(el);
        var ang = Math.random()*Math.PI*2;
        var dist = 40+Math.random()*60;
        var dx = Math.cos(ang)*dist, dy = Math.sin(ang)*dist - 26;
        el.animate([
          { transform:'translate(0,0) rotate(0deg)', opacity:1 },
          { transform:'translate('+dx+'px,'+dy+'px) rotate('+(Math.random()*360)+'deg)', opacity:0 }
        ], { duration:650+Math.random()*250, easing:'ease-out' });
        setTimeout(function(el2){ return function(){ el2.remove(); }; }(el), 1000);
      }
    }

    var STEP_TOTAL = 7;
    function setStep(n){ stageBadge.textContent = 'Step '+n+'/'+STEP_TOTAL; }

    /* =========================================================
       STEP 1 - MOVE
    ========================================================= */
    function stepMove(){
      setStep(1);
      say('ASTRO','Astro sees a boy named Alex.','Drag Astro to walk over and meet him!');
      stageArea.innerHTML =
        '<div id="move-track"><div id="move-fill"></div></div>'+
        '<div id="move-hint">Drag Astro \u2192</div>';

      var fill = document.getElementById('move-fill');
      var startLeft = 8, targetLeft = 58;
      var curLeft = startLeft;
      astroChar.style.left = curLeft+'%';

      var dragging = false;
      function pctFromEvent(e){
        var rect = container.getBoundingClientRect();
        var clientX = (e.touches && e.touches[0]) ? e.touches[0].clientX : e.clientX;
        var pct = ((clientX-rect.left)/rect.width)*100;
        return Math.max(startLeft, Math.min(targetLeft+6, pct));
      }
      function onDown(){ dragging = true; }
      function onMove(e){
        if(!dragging) return;
        curLeft = pctFromEvent(e);
        astroChar.style.left = curLeft+'%';
        var prog = Math.max(0, Math.min(100, ((curLeft-startLeft)/(targetLeft-startLeft))*100));
        fill.style.width = prog+'%';
        if(curLeft >= targetLeft){
          dragging = false;
          container.removeEventListener('pointermove', onMove);
          container.removeEventListener('pointerdown', onDown);
          fill.style.width = '100%';
          sfxGood();
          setTimeout(stepGreet, 500);
        }
      }
      container.addEventListener('pointerdown', onDown);
      container.addEventListener('pointermove', onMove);
      window.addEventListener('pointerup', function(){ dragging=false; });
    }

    /* =========================================================
       STEP 3 - DRAG & GIVE name tag
    ========================================================= */
    function stepName(){
      setStep(3);
      say('ALEX',"What's your name?",'Drag the name tag to Alex!');
      stageArea.innerHTML =
        '<div id="dragzone">'+
          '<div id="nametag-chip">ASTRO</div>'+
          '<div id="dropzone">Drop here</div>'+
        '</div>';

      var chip = document.getElementById('nametag-chip');
      var zone = document.getElementById('dropzone');
      var dzEl = document.getElementById('dragzone');
      var dragging = false, offX=0, offY=0;

      function within(a,b){
        return !(a.right<b.left || a.left>b.right || a.bottom<b.top || a.top>b.bottom);
      }
      chip.addEventListener('pointerdown', function(e){
        dragging = true;
        chip.setPointerCapture(e.pointerId);
        var cr = container.getBoundingClientRect();
        var r = chip.getBoundingClientRect();
        offX = e.clientX - r.left; offY = e.clientY - r.top;
        var startLeft = r.left - cr.left;
        var startTop = r.top - cr.top;
        container.appendChild(chip);
        chip.style.position='absolute'; chip.style.zIndex=50;
        chip.style.left = startLeft+'px'; chip.style.top = startTop+'px';
      });
      chip.addEventListener('pointermove', function(e){
        if(!dragging) return;
        var cr = container.getBoundingClientRect();
        chip.style.left = (e.clientX-offX-cr.left)+'px';
        chip.style.top = (e.clientY-offY-cr.top)+'px';
        var a = chip.getBoundingClientRect();
        var b = zone.getBoundingClientRect();
        zone.classList.toggle('hover', within(a,b));
      });
      chip.addEventListener('pointerup', function(){
        if(!dragging) return;
        dragging = false;
        var a = chip.getBoundingClientRect();
        var b = zone.getBoundingClientRect();
        if(within(a,b)){
          chip.style.pointerEvents='none';
          sfxSuccess();
          confettiBurst({ x:b.left-container.getBoundingClientRect().left+b.width/2, y:b.top-container.getBoundingClientRect().top+b.height/2 });
          say('ASTRO','My name is Astro.','');
          glow('astro', true); glow('alex', false); celebrate('astro');
          setTimeout(function(){
            say('ALEX','My name is Alex.','');
            glow('astro', false); glow('alex', true); celebrate('alex');
            setTimeout(stepAge, 1500);
          }, 1400);
        } else {
          dzEl.appendChild(chip);
          chip.style.position='absolute'; chip.style.left='6%'; chip.style.top='20px'; chip.style.zIndex='';
          zone.classList.remove('hover');
        }
      });
    }

    function renderMatch(options, onCorrect){
      var row = document.createElement('div');
      row.className = 'match-row';
      options.forEach(function(opt){
        var card = document.createElement('div');
        card.className = 'match-card';
        card.innerHTML = '<img src="data:image/png;base64,'+opt.img+'" alt="'+opt.label+'"><div class="label">'+opt.label+'</div>';
        card.addEventListener('click', function(){
          if(opt.correct){
            sfxGood();
            onCorrect();
          } else {
            card.classList.remove('wrong-shake'); void card.offsetWidth; card.classList.add('wrong-shake');
            sfxWrong();
          }
        });
        row.appendChild(card);
      });
      stageArea.innerHTML = '';
      stageArea.appendChild(row);
    }

      document.getElementById('opt-goodbye2').addEventListener('click', function(){
        sfxGood();
        say('ASTRO','Goodbye for now, Alex!','');
        glow('astro', true); glow('alex', false);
        setTimeout(function(){
          say('ALEX','Goodbye, Astro! See you soon!','');
          glow('astro', false); glow('alex', true);
          setTimeout(finishGame, 1600);
        }, 1300);
      });
      document.getElementById('opt-hello2').addEventListener('click', function(e){
        var card = e.currentTarget;
        card.classList.remove('wrong-shake'); void card.offsetWidth; card.classList.add('wrong-shake');
        sfxWrong();
        say('ASTRO','We already said hello!','Try the other one!');
      });
    }

    function finishGame(){
      document.getElementById('end-overlay').classList.remove('hidden');
    }

    function resetAll(){
      astroChar.classList.remove('hugging','talking','celebrate');
      alexChar.classList.remove('hugging','talking','celebrate');
      astroChar.style.left = '8%';
      stepMove();
    }

    document.getElementById('start-btn').addEventListener('click', function(){
      document.getElementById('start-overlay').classList.add('hidden');
      resetAll();
    });
    document.getElementById('replay-btn').addEventListener('click', function(){
      document.getElementById('end-overlay').classList.add('hidden');
      resetAll();
    });
    document.getElementById('continue-btn').addEventListener('click', function(){
      window.dispatchEvent(new CustomEvent('astroGame4Complete'));
      try{ window.parent.postMessage({type:'astroGame4Complete'}, '*'); }catch(e){}
    });

  }
  if(document.readyState === "loading"){
    document.addEventListener("DOMContentLoaded", boot);
  } else {
    boot();
