<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Program the Morning-Bot</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#13204a;touch-action:none;user-select:none;-webkit-user-select:none}
body{font-family:ui-rounded,"Arial Rounded MT Bold","Nunito","Varela Round","Trebuchet MS",system-ui,sans-serif;color:#1e2a5a}
#stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform-origin:center center;overflow:hidden;background:#bfe6ff;border-radius:6px}
#stage img{-webkit-user-drag:none;user-select:none;pointer-events:none}
.layer{position:absolute;inset:0}
.overlay{position:absolute;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;background:rgba(19,32,74,.62);text-align:center;padding:40px}
.overlay.hidden{display:none}
.ovcard{background:#fff;border-radius:44px;padding:48px 70px;box-shadow:0 18px 0 rgba(0,0,0,.18);max-width:1150px;display:flex;flex-direction:column;align-items:center;gap:22px}
.ovcard h1{margin:0;font-size:84px;line-height:1.05;color:#1e2a5a}
.ovcard p{margin:0;font-size:40px;line-height:1.3;color:#3b4a7a}
.bigbtn{font:inherit;font-size:58px;font-weight:800;color:#fff;background:#ff8a1f;border:0;border-radius:999px;padding:22px 80px;box-shadow:0 10px 0 #c95f00;cursor:pointer;letter-spacing:2px}
.bigbtn:active{transform:translateY(6px);box-shadow:0 4px 0 #c95f00}
.bigbtn.green{background:#2fbf71;box-shadow:0 10px 0 #1d8a4f}
.ph{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100%;border-radius:26px;background:rgba(255,255,255,.88);border:5px dashed #8fa2d6;color:#1e2a5a;font-weight:800;text-align:center;overflow:hidden;line-height:1}
.ph .e{font-size:1em}
.ph .w{font-size:.28em;margin-top:.08em;letter-spacing:1px}
.art{position:absolute;display:flex;align-items:flex-end;justify-content:center}
.art>img{width:100%;height:100%;object-fit:contain}
.wobble{animation:wob .5s}
@keyframes wob{0%,100%{translate:0 0;rotate:0deg}20%{translate:-14px 0;rotate:-4deg}40%{translate:12px 0;rotate:3deg}60%{translate:-8px 0;rotate:-2deg}80%{translate:5px 0;rotate:0deg}}
.bounce{animation:bnc .45s}
@keyframes bnc{0%,100%{scale:1}40%{scale:1.18}70%{scale:.95}}
.bubble{pointer-events:none;position:absolute;background:#fff;border-radius:34px;padding:18px 30px;font-size:42px;font-weight:800;box-shadow:0 8px 0 rgba(0,0,0,.15);z-index:40;white-space:nowrap}
#confetti{position:absolute;inset:0;pointer-events:none;z-index:120}
#soundHint{position:absolute;right:18px;top:14px;z-index:90;font-size:34px;background:rgba(255,255,255,.85);border-radius:999px;padding:6px 16px;display:none}

.bot{position:absolute}
.bot .art{left:0;top:0}
.rb{position:absolute;inset:0}
.rb .body{position:absolute;left:18%;top:28%;width:64%;height:52%;background:radial-gradient(circle at 35% 30%,#e8eef9,#b6c3dc);border-radius:46%;border:6px solid #6b7690}
.rb .scr{position:absolute;left:28%;top:36%;width:44%;height:26%;background:#20345f;border-radius:30%;display:flex;align-items:center;justify-content:center;gap:14%}
.rb .scr i{width:16%;height:40%;background:#7cf3ff;border-radius:50%;box-shadow:0 0 10px #7cf3ff}
.rb .ant{position:absolute;left:48%;top:14%;width:4%;height:15%;background:#6b7690}
.rb .ant:after{content:'';position:absolute;left:-90%;top:-60%;width:280%;height:40%;border-radius:50%;background:#ff5d8f}
.rb .wheel{position:absolute;left:38%;top:78%;width:24%;height:18%;border-radius:50%;background:#2d3644;border:5px solid #9aa3b4}
.rb .arm{position:absolute;top:50%;width:22%;height:6%;background:#6b7690;border-radius:20px}
.rb .arm.l{left:2%;transform-origin:100% 50%;transform:rotate(20deg)}.rb .arm.r{right:2%;transform-origin:0 50%;transform:rotate(-20deg)}
.rb.up .arm.l{transform:rotate(70deg)}.rb.up .arm.r{transform:rotate(-70deg)}
.rb .prop{position:absolute;line-height:1;text-align:center}
.rb.soak .body{background:radial-gradient(circle at 35% 30%,#cfe6ff,#7fa9d9)}

#bg{position:absolute;inset:0;background:linear-gradient(#26306b 0 74%,#5a4a6a 74%)}
#bg img{width:100%;height:100%;object-fit:cover}
.moonwin{position:absolute;left:330px;top:60px;width:260px;height:220px;background:#0b1440;border:16px solid #c9d3ea;border-radius:10px;font-size:90px;display:flex;align-items:flex-start;justify-content:flex-end;padding:10px}
.bedp{position:absolute;left:20px;top:560px;width:330px;height:140px;background:#7a4a9e;border-radius:30px}
#alex{position:absolute;left:20px;top:340px;width:240px;height:360px;z-index:5;pointer-events:none}
#alex .art{left:0;top:0}
#bot{position:absolute;left:300px;top:330px;width:320px;height:360px;z-index:6}
#prog{position:absolute;left:700px;top:40px;width:860px;height:560px;background:#141c33;border-radius:30px;border:8px solid #6b7690;padding:24px;display:flex;flex-direction:column;gap:12px;z-index:4}
#prog h3{margin:0;color:#7cff9b;font-family:"Courier New",monospace;font-size:38px}
#slots{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.slot{border:5px dashed #3e4a5c;border-radius:20px;position:relative;display:flex;align-items:flex-start;justify-content:flex-start}
.slot b{position:absolute;left:12px;top:6px;color:#7cff9b;font-size:34px;font-family:"Courier New",monospace;z-index:2}
.slot.cur{border-color:#ffd23f;box-shadow:0 0 22px #ffd23f}
.slot.bad{border-color:#ff5d5d}
.card{position:absolute;width:230px;height:200px;background:#fff;border-radius:22px;box-shadow:0 7px 0 rgba(0,0,0,.25);cursor:grab;touch-action:none;z-index:20;display:flex;flex-direction:column;align-items:center}
.card .pic{position:relative;width:200px;height:140px;margin-top:6px}
.card .pic .art{left:0;top:0}
.card .lb{font-size:28px;font-weight:900;color:#1e2a5a;margin-top:4px}
.card.drag{z-index:60;box-shadow:0 18px 18px rgba(0,0,0,.35)}
.card.shake{animation:wob .5s 2}
#run{position:absolute;left:1020px;top:615px;font-size:52px;display:none;z-index:30;background:#2fbf71;box-shadow:0 10px 0 #1d8a4f}
#listen{position:absolute;left:210px;top:240px;width:110px;height:110px;border-radius:50%;border:0;background:#3d8bff;color:#fff;font-size:58px;box-shadow:0 8px 0 #2766c4;z-index:30;cursor:pointer}
#say{position:absolute;left:20px;top:80px;font-size:36px;max-width:640px;white-space:normal;text-align:center;z-index:40}
#tray{position:absolute;left:0;right:0;top:700px;height:200px}
</style></head>
<body>
<div id="stage">
  <div id="bg"></div>
  <div id="alex"></div>
  <div id="bot" class="bot"></div>
  <div id="prog"><h3>&gt; MORNING PROGRAM_</h3><div id="slots"></div></div>
  <div id="tray"></div>
  <button class="bigbtn" id="run">▶ RUN</button>
  <button id="listen" title="Listen again">👂</button>
  <div class="bubble" id="say" style="display:none"></div>
</div>
<script>
var AUDIO={};
var PICS={ bg:'images/l6/bedroom_night.jpg', alex:['images/l6/alex_talk.png','images/alex_friend.png'] };
['wake','shower','brush','dressed','breakfast','hurry'].forEach(function(k){ PICS['card_'+k]='images/l6/card_'+k+'.png'; });
['idle','wake','shower','brush','dressed','breakfast','soaked','wave'].forEach(function(k){ PICS['bot_'+k]='images/l6/bot_'+k+'.png'; });
</script>
<script>
/* ===== Astro & Alex shared game base ===== */
var G=(function(){
  var W=1600,H=900, stage=document.getElementById('stage'), scale=1;
  var DEBUG=/[?&]debug=1/.test(location.search);
  function fit(){
    scale=Math.min(window.innerWidth/W, window.innerHeight/H);
    stage.style.transform='translate(-50%,-50%) scale('+scale+')';
  }
  window.addEventListener('resize',fit); fit();
  function toStage(e){
    var r=stage.getBoundingClientRect();
    return {x:(e.clientX-r.left)/scale, y:(e.clientY-r.top)/scale};
  }
  /* ---------- speech: one queue, never overlapping ---------- */
  var AUDIO=window.AUDIO||{}; var voice=null; var queue=Promise.resolve(); var pending=0;
  function pickVoice(){
    if(!('speechSynthesis' in window)) return;
    var vs=speechSynthesis.getVoices().filter(function(v){return /^en[-_]US/i.test(v.lang);});
    var pref=['Samantha','Google US English','Microsoft Aria','Microsoft Jenny','Karen','Ava','Allison'];
    for(var i=0;i<pref.length;i++){ for(var j=0;j<vs.length;j++){ if(vs[j].name.indexOf(pref[i])>=0){voice=vs[j];return;} } }
    voice=vs[0]||null;
  }
  if('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged=pickVoice; }
  function speakNow(text){
    return new Promise(function(res){
      var done=false; function fin(){ if(!done){done=true; res();} }
      var safety=setTimeout(fin, 1800+text.length*95);
      var file=AUDIO[text];
      if(file){ var a=new Audio(file); a.onended=fin; a.onerror=fin; a.play().catch(fin); return; }
      if(!('speechSynthesis' in window)){ setTimeout(fin, 500+text.length*55); return; }
      var u=new SpeechSynthesisUtterance(text.replace(/\.\.\./g,', '));
      u.lang='en-US'; u.rate=0.9; u.pitch=1.05; if(voice) u.voice=voice;
      u.onend=function(){clearTimeout(safety); setTimeout(fin,120);}; u.onerror=function(){clearTimeout(safety); fin();};
      speechSynthesis.speak(u);
    });
  }
  function say(text){ pending++; queue=queue.then(function(){return speakNow(text);}).then(function(){pending--;}); return queue; }
  function sayIfFree(text){ if(pending>0) return queue; return say(text); }
  function busy(){ return pending>0; }
  /* ---------- sound effects ---------- */
  var ac=null;
  function audioInit(){ try{ if(!ac) ac=new (window.AudioContext||window.webkitAudioContext)(); if(ac.state==='suspended') ac.resume(); }catch(e){} }
  function tone(f,d,type,vol,f2,delay){
    if(!ac) return; var t=ac.currentTime+(delay||0);
    var o=ac.createOscillator(), g=ac.createGain(); o.type=type||'sine'; o.frequency.setValueAtTime(f,t);
    if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+d);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol||0.2,t+0.015); g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+d+0.05);
  }
  function noise(d,vol,freq,delay){
    if(!ac) return; var t=ac.currentTime+(delay||0), n=Math.floor(ac.sampleRate*d), b=ac.createBuffer(1,n,ac.sampleRate), ch=b.getChannelData(0);
    for(var i=0;i<n;i++) ch[i]=(Math.random()*2-1)*Math.sin(Math.PI*i/n);
    var s=ac.createBufferSource(); s.buffer=b; var f=ac.createBiquadFilter(); f.type='bandpass'; f.frequency.value=freq||800; f.Q.value=0.7;
    var g=ac.createGain(); g.gain.value=vol||0.3; s.connect(f); f.connect(g); g.connect(ac.destination); s.start(t);
  }
  var sfx={
    pop:function(){tone(520,0.12,'sine',0.25,980);},
    ding:function(){tone(1046,0.35,'triangle',0.2); tone(1568,0.4,'triangle',0.12,null,0.08);},
    boing:function(){tone(220,0.35,'square',0.08,520);},
    soft:function(){tone(300,0.15,'sine',0.12,240);},
    whoosh:function(){noise(0.9,0.35,600);},
    cheer:function(){[523,659,784,1046].forEach(function(f,i){tone(f,0.25,'triangle',0.18,null,i*0.09);});},
    flip:function(){noise(0.12,0.25,2500);},
    sparkle:function(){[1318,1568,2093].forEach(function(f,i){tone(f,0.18,'sine',0.1,null,i*0.06);});},
    thump:function(){tone(120,0.2,'sine',0.35,60);},
    click:function(){tone(900,0.05,'square',0.06);}
  };
  /* ---------- pictures with placeholders ---------- */
  var img={};
  function loadOne(paths){
    paths=[].concat(paths);
    return new Promise(function(res){
      var i=0; (function next(){
        if(i>=paths.length) return res(null);
        var im=new Image(); im.onload=function(){res(im);}; im.onerror=function(){i++; next();}; im.src=paths[i];
      })();
    });
  }
  function loadPics(P){
    var keys=Object.keys(P);
    return Promise.all(keys.map(function(k){return loadOne(P[k]).then(function(im){img[k]=im;});}));
  }
  /* art(key,{x,y,w,h,emoji,word,cls,parent,z}) -> absolutely positioned element with the picture or a placeholder */
  function art(key,o){
    o=o||{}; var d=document.createElement('div'); d.className='art '+(o.cls||'');
    if(o.w!=null){d.style.width=o.w+'px';} if(o.h!=null){d.style.height=o.h+'px';}
    if(o.x!=null) d.style.left=o.x+'px'; if(o.y!=null) d.style.top=o.y+'px'; if(o.z!=null) d.style.zIndex=o.z;
    var im=img[key];
    if(im){ var c=document.createElement('img'); c.src=im.src; c.alt=''; d.appendChild(c); d.dataset.real='1'; }
    else{ var p=document.createElement('div'); p.className='ph'; p.style.fontSize=Math.round(Math.min(o.w||160,o.h||160)*0.62)+'px';
      p.innerHTML='<div class="e">'+(o.emoji||'🖼️')+'</div>'+(o.word?'<div class="w">'+o.word+'</div>':''); d.appendChild(p); }
    (o.parent||stage).appendChild(d); return d;
  }
  function has(key){ return !!img[key]; }
  /* ---------- helpers ---------- */
  function wait(ms){return new Promise(function(r){setTimeout(r,ms);});}
  function shuffle(a){a=a.slice(); for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t;} return a;}
  function rand(a,b){return a+Math.random()*(b-a);}
  function el(tag,cls,parent,html){var e=document.createElement(tag); if(cls)e.className=cls; if(html!=null)e.innerHTML=html; (parent||stage).appendChild(e); return e;}
  function anim(e,cls){ e.classList.remove(cls); void e.offsetWidth; e.classList.add(cls); setTimeout(function(){e.classList.remove(cls);},600); }
  /* ---------- confetti ---------- */
  var cv=el('canvas',''); cv.id='confetti'; cv.width=W; cv.height=H; var cx=cv.getContext('2d'), parts=[], running=false;
  function confetti(n){
    var cols=['#ff8a1f','#2fbf71','#3d8bff','#ffd23f','#ff5d8f','#9b5de5'];
    for(var i=0;i<(n||160);i++) parts.push({x:rand(0,W),y:rand(-300,-20),vx:rand(-2,2),vy:rand(3,8),r:rand(0,6.3),vr:rand(-.2,.2),s:rand(10,20),c:cols[i%cols.length]});
    if(!running){running=true; requestAnimationFrame(step);}
  }
  function step(){
    cx.clearRect(0,0,W,H);
    parts.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.r+=p.vr; cx.save(); cx.translate(p.x,p.y); cx.rotate(p.r); cx.fillStyle=p.c; cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); cx.restore();});
    parts=parts.filter(function(p){return p.y<H+40;});
    if(parts.length) requestAnimationFrame(step); else {running=false; cx.clearRect(0,0,W,H);}
  }
  /* ---------- start / end screens ---------- */
  function overlay(title,text,btn,cls){
    var o=el('div','overlay'); var c=el('div','ovcard',o);
    el('h1','',c,title); if(text) el('p','',c,text);
    var b=el('button','bigbtn '+(cls||''),c,btn); return {o:o,b:b,c:c};
  }
  function boot(opt){
    var s=overlay(opt.title,opt.instruction,'START');
    s.b.disabled=true; s.b.style.opacity=.5;
    loadPics(opt.pics||{}).then(function(){ s.b.disabled=false; s.b.style.opacity=1; if(opt.ready) opt.ready(); });
    s.b.addEventListener('click',function(){
      audioInit(); if('speechSynthesis' in window){ try{ speechSynthesis.cancel(); var u=new SpeechSynthesisUtterance(' '); u.volume=0; speechSynthesis.speak(u);}catch(e){} }
      sfx.click(); s.o.classList.add('hidden'); opt.start();
    });
    G.end=function(title,text){
      sfx.cheer(); confetti(220);
      var e=overlay(title||'Well done!',text||'','PLAY AGAIN','green');
      e.o.style.background='rgba(19,32,74,.35)';
      e.b.addEventListener('click',function(){ sfx.click(); e.o.remove(); opt.start(); });
    };
  }
  return {W:W,H:H,stage:stage,DEBUG:DEBUG,toStage:toStage,say:say,sayIfFree:sayIfFree,busy:busy,sfx:sfx,img:img,art:art,has:has,
    wait:wait,shuffle:shuffle,rand:rand,el:el,anim:anim,confetti:confetti,boot:boot,audioInit:audioInit,tone:tone,noise:noise,scale:function(){return scale;}};
})();

/* the Morning-Bot: designer picture images/l6/bot_<pose>.png if present, otherwise drawn here */
function drawBot(parent,w,h,pose){
  parent.innerHTML=''; var key='bot_'+pose;
  if(G.has(key)){ G.art(key,{x:0,y:0,w:w,h:h,parent:parent}); return; }
  var r=G.el('div','rb'+(pose==='wake'||pose==='wave'?' up':'')+(pose==='soaked'?' soak':''),parent);
  G.el('div','ant',r); G.el('div','arm l',r); G.el('div','arm r',r); G.el('div','body',r); var s=G.el('div','scr',r); G.el('i','',s); G.el('i','',s); G.el('div','wheel',r);
  var P={shower:['🚿','35%','-6%',0.32],brush:['🪥','62%','34%',0.22],dressed:['👕','30%','52%',0.3],breakfast:['🥣','62%','48%',0.24],soaked:['💦','60%','10%',0.26],wave:['👋','72%','22%',0.22],wake:['⭐','40%','-4%',0.2]};
  var p=P[pose]; if(p){ var e=G.el('div','prop',r,p[0]); e.style.left=p[1]; e.style.top=p[2]; e.style.fontSize=Math.round(w*p[3])+'px'; }
  if(pose==='soaked'){ var s2=G.el('div','prop',r,'👕'); s2.style.left='30%'; s2.style.top='52%'; s2.style.fontSize=Math.round(w*0.3)+'px'; s2.style.filter='hue-rotate(160deg) brightness(.8)'; }
}

</script>
<script>
(function(){
var R={wake:{lb:'WAKE UP',e:'⏰',say:'I wake up.'},shower:{lb:'SHOWER',e:'🚿',say:'I shower.'},brush:{lb:'BRUSH TEETH',e:'🪥',say:'I brush my teeth.'},
       dressed:{lb:'GET DRESSED',e:'👕',say:'I get dressed.'},breakfast:{lb:'BREAKFAST',e:'🥣',say:'I eat breakfast.'},hurry:{lb:'HURRY',e:'🏃',say:'I hurry!'}};
var ORDERS=[['wake','shower','brush','dressed','breakfast'],['wake','shower','brush','dressed','breakfast','hurry']];
var S=G.stage, sayEl=document.getElementById('say'), botEl=document.getElementById('bot');
var round=0, order=[], slots=[], cards=[], drag=null, busy=false;
function talk(t){ sayEl.textContent=t; sayEl.style.display='block'; G.anim(sayEl,'bounce'); return G.say(t); }
function scene(){
  var bg=document.getElementById('bg'); bg.innerHTML='';
  if(G.has('bg')){ var im=document.createElement('img'); im.src=G.img.bg.src; bg.appendChild(im); } else { G.el('div','moonwin',bg,'🌙'); G.el('div','bedp',bg); }
  var a=document.getElementById('alex'); a.innerHTML=''; G.art('alex',{x:0,y:0,w:240,h:360,emoji:'🧒',parent:a});
  drawBot(botEl,320,360,'idle');
}
function routineLine(){ return order.map(function(k){return R[k].say;}).join(' '); }
function build(){
  order=ORDERS[round]; var n=order.length;
  var sl=document.getElementById('slots'); sl.innerHTML=''; slots=[];
  for(var i=0;i<6;i++){ var d=G.el('div','slot',sl,'<b>'+(i+1)+'</b>'); if(i>=n) d.style.visibility='hidden'; slots.push({el:d,card:null,i:i}); }
  cards.forEach(function(c){c.el.remove();}); cards=[];
  G.shuffle(order).forEach(function(k,i){
    var d=G.el('div','card',S); var p=G.el('div','pic',d); G.art('card_'+k,{x:0,y:0,w:200,h:140,emoji:R[k].e,parent:p}); G.el('div','lb',d,R[k].lb);
    var c={k:k,el:d,hx:40+i*(n===6?258:310)+(n===6?0:60),hy:705,x:0,y:0,slot:null}; c.x=c.hx; c.y=c.hy; cards.push(c); pos(c);
    d.addEventListener('pointerdown',function(e){ if(busy) return; e.preventDefault(); var q=G.toStage(e); drag={c:c,dx:q.x-c.x,dy:q.y-c.y,sx:q.x,sy:q.y,moved:false}; d.classList.add('drag'); d.setPointerCapture(e.pointerId); });
    d.addEventListener('pointermove',function(e){ if(!drag||drag.c!==c) return; var q=G.toStage(e); if(Math.abs(q.x-drag.sx)+Math.abs(q.y-drag.sy)>10) drag.moved=true; c.x=q.x-drag.dx; c.y=q.y-drag.dy; pos(c); });
    d.addEventListener('pointerup',function(e){ if(!drag||drag.c!==c) return; var moved=drag.moved; drag=null; d.classList.remove('drag');
      if(!moved){ if(c.slot) unslot(c); else { var f=slots.find(function(s,i){return i<order.length && !s.card;}); if(f) toSlot(c,f); } check(); return; }
      var cx=c.x+115, cy=c.y+100; var hit=slots.find(function(s,i){ if(i>=order.length) return false; var r=rect(s.el); return cx>r.x&&cx<r.x+r.w&&cy>r.y&&cy<r.y+r.h; });
      if(hit){ if(hit.card && hit.card!==c){ var other=hit.card; if(c.slot){ var old=c.slot; toSlot(other,old); } else unslot(other); } toSlot(c,hit); } else if(c.slot) unslot(c); else home(c);
      check(); });
  });
}
function rect(el){ var sr=S.getBoundingClientRect(),k=G.scale(),r=el.getBoundingClientRect(); return {x:(r.left-sr.left)/k,y:(r.top-sr.top)/k,w:r.width/k,h:r.height/k}; }
function pos(c){ c.el.style.left=c.x+'px'; c.el.style.top=c.y+'px'; }
function toSlot(c,s){ if(c.slot) c.slot.card=null; if(s.card && s.card!==c) unslot(s.card); var r=rect(s.el); c.x=r.x+(r.w-230)/2; c.y=r.y+(r.h-200)/2+6; pos(c); c.slot=s; s.card=c; G.sfx.click(); s.el.classList.remove('bad'); }
function unslot(c){ if(c.slot){ c.slot.card=null; c.slot.el.classList.remove('bad'); } c.slot=null; home(c); }
function home(c){ c.x=c.hx; c.y=c.hy; pos(c); }
function check(){ var full=slots.slice(0,order.length).every(function(s){return s.card;}); document.getElementById('run').style.display=full?'block':'none'; }
async function run(){
  if(busy) return; busy=true; document.getElementById('run').style.display='none';
  var prog=slots.slice(0,order.length).map(function(s){return s.card.k;}); var did={};
  for(var i=0;i<prog.length;i++){
    var k=prog[i]; slots[i].el.classList.add('cur');
    var problem=null;
    if(k==='dressed' && !did.shower && prog.indexOf('shower')>i) problem='soaked';
    else if(k==='breakfast' && !did.wake) problem='sleepy';
    else if(k!==order[i]) problem='spin';
    if(problem){ slots[i].el.classList.remove('cur'); await oops(problem,prog); busy=false; return; }
    drawBot(botEl,320,360,k==='hurry'?'wave':k); G.anim(botEl,'bounce'); G.sfx.pop(); await G.say(R[k].lb+'!'); did[k]=true; await G.wait(250); slots[i].el.classList.remove('cur');
  }
  drawBot(botEl,320,360,'wave'); G.sfx.cheer(); G.confetti(90); await talk('It works! Good morning!'); await G.wait(600);
  round++; if(round<ORDERS.length){ drawBot(botEl,320,360,'idle'); build(); check(); await talk('Now a new program!'); await alexSays(); busy=false; }
  else G.end('The Morning-Bot works!','You programmed the whole morning.');
}
async function oops(kind,prog){
  if(kind==='soaked'){ drawBot(botEl,320,360,'shower'); await G.wait(400); drawBot(botEl,320,360,'soaked'); G.noise(0.6,0.4,2500); await talk('Oh no! Clothes in the shower! I am wet!'); }
  else if(kind==='sleepy'){ drawBot(botEl,320,360,'breakfast'); var z=G.el('div','prop',botEl.querySelector('.rb')||botEl,'💤'); z.style.cssText='position:absolute;left:5%;top:0;font-size:70px'; await talk('Zzz... I am still asleep!'); }
  else { botEl.animate([{transform:'rotate(0)'},{transform:'rotate(360deg)'}],{duration:800}); G.sfx.boing(); await talk('Huh? That is not the right order!'); }
  slots.slice(0,order.length).forEach(function(s,i){ if(s.card && s.card.k!==order[i]){ s.el.classList.add('bad'); G.anim(s.card.el,'shake'); } });
  await G.wait(600); drawBot(botEl,320,360,'idle'); check(); talk('Fix the red boxes and press RUN!');
}
async function alexSays(){ sayEl.textContent='🎧 Listen to Alex!'; sayEl.style.display='block'; await G.say(routineLine()); }
document.getElementById('run').onclick=run;
document.getElementById('listen').onclick=function(){ if(!busy) G.sayIfFree(routineLine()); };
async function start(){ scene(); round=0; build(); check(); busy=true; await talk("This is my Morning-Bot! Let's program it."); await alexSays(); busy=false; }
window.__game={state:function(){ return {round:round,busy:busy,order:order,cards:cards.map(function(c){var r=c.el.getBoundingClientRect(); return {k:c.k,slot:c.slot?c.slot.i:-1,cx:r.left+r.width/2,cy:r.top+r.height/2};}),
  slots:slots.map(function(s){var r=s.el.getBoundingClientRect(); return {cx:r.left+r.width/2,cy:r.top+r.height/2};})}; }};
G.boot({title:'Program the Morning-Bot',instruction:'Listen to Alex\'s morning.<br><b>Drag</b> the cards into the robot\'s program in the right order<br>(or tap a card to add it). Then press RUN!',pics:PICS,ready:scene,start:start});
})();
</script>
