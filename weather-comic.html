<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>The Weather Machine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#13204a;touch-action:none;user-select:none;-webkit-user-select:none}
body{font-family:ui-rounded,"Arial Rounded MT Bold","Nunito","Varela Round","Trebuchet MS",system-ui,sans-serif;color:#1e2a5a}
#stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform-origin:center center;overflow:hidden;background:#bfe6ff;border-radius:6px}
#stage img{-webkit-user-drag:none;user-select:none;pointer-events:none}
.layer{position:absolute;inset:0}
.overlay{position:absolute;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;background:rgba(19,32,74,.62);text-align:center;padding:40px}
.overlay.hidden{display:none}
.ovcard{background:#fff;border-radius:44px;padding:48px 70px;box-shadow:0 18px 0 rgba(0,0,0,.18);max-width:1150px;display:flex;flex-direction:column;align-items:center;gap:22px}
.ovcard h1{margin:0;font-size:84px;line-height:1.05;color:#1e2a5a}
.ovcard p{margin:0;font-size:40px;line-height:1.3;color:#3b4a7a}
.bigbtn{font:inherit;font-size:58px;font-weight:800;color:#fff;background:#ff8a1f;border:0;border-radius:999px;padding:22px 80px;box-shadow:0 10px 0 #c95f00;cursor:pointer;letter-spacing:2px}
.bigbtn:active{transform:translateY(6px);box-shadow:0 4px 0 #c95f00}
.bigbtn.green{background:#2fbf71;box-shadow:0 10px 0 #1d8a4f}
.ph{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100%;border-radius:26px;background:rgba(255,255,255,.88);border:5px dashed #8fa2d6;color:#1e2a5a;font-weight:800;text-align:center;overflow:hidden;line-height:1}
.ph .e{font-size:1em}
.ph .w{font-size:.28em;margin-top:.08em;letter-spacing:1px}
.art{position:absolute;display:flex;align-items:flex-end;justify-content:center}
.art>img{width:100%;height:100%;object-fit:contain}
.wobble{animation:wob .5s}
@keyframes wob{0%,100%{translate:0 0;rotate:0deg}20%{translate:-14px 0;rotate:-4deg}40%{translate:12px 0;rotate:3deg}60%{translate:-8px 0;rotate:-2deg}80%{translate:5px 0;rotate:0deg}}
.bounce{animation:bnc .45s}
@keyframes bnc{0%,100%{scale:1}40%{scale:1.18}70%{scale:.95}}
.bubble{pointer-events:none;position:absolute;background:#fff;border-radius:34px;padding:18px 30px;font-size:42px;font-weight:800;box-shadow:0 8px 0 rgba(0,0,0,.15);z-index:40;white-space:nowrap}
#confetti{position:absolute;inset:0;pointer-events:none;z-index:120}
#soundHint{position:absolute;right:18px;top:14px;z-index:90;font-size:34px;background:rgba(255,255,255,.85);border-radius:999px;padding:6px 16px;display:none}

#bg{position:absolute;inset:0;background:radial-gradient(circle at 50% 40%,#ffe9a8,#ffb86b)}
#view{position:absolute;inset:0;overflow:hidden;touch-action:pan-y}
#track{position:absolute;left:0;top:0;height:900px;transition:transform .55s cubic-bezier(.3,.9,.3,1)}
.slot{position:absolute;top:0;width:1600px;height:900px}
.page{position:absolute;left:90px;top:14px;width:1420px;height:790px;background:#fffdf6;border-radius:10px;box-shadow:0 14px 0 rgba(0,0,0,.18),0 0 0 2px rgba(0,0,0,.08);transform-origin:0 0;transition:transform .6s cubic-bezier(.3,.9,.3,1)}
.page .num{position:absolute;right:20px;bottom:-1px;font:900 16px 'Comic Neue','Comic Sans MS',sans-serif;color:#999}
.panel{position:absolute;border:6px solid #1b1b1b;overflow:hidden;cursor:pointer;transition:opacity .4s,filter .4s;background:#cfeaff}
.page.zoom .panel.on{z-index:4;box-shadow:0 0 0 3000px rgba(19,32,74,.88)}
.panel>img.real{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.it{position:absolute;line-height:1;text-align:center;pointer-events:none}
.it .art{left:0;top:0}
.it .in{width:100%;height:100%;position:relative}
/* weather */
.fx{position:absolute;pointer-events:none}
.flake{width:12px;height:12px;border-radius:50%;background:#fff;box-shadow:0 0 4px #9cc;animation:fall linear infinite}
.drop{width:4px;height:30px;border-radius:3px;background:#5a8dd6;animation:fall linear infinite;rotate:12deg}
.streak{height:5px;border-radius:5px;background:rgba(255,255,255,.85);animation:blow linear infinite}
@keyframes fall{from{transform:translateY(-40px)}to{transform:translateY(var(--d))}}
@keyframes blow{from{transform:translateX(-260px)}to{transform:translateX(var(--d))}}
.shiver{animation:shiver .15s linear infinite}
@keyframes shiver{0%,100%{translate:0 0}50%{translate:3px 0}}
.bob{animation:bob 1.6s ease-in-out infinite}
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -10px}}
.jit{animation:jit .3s linear infinite}
@keyframes jit{0%{rotate:-4deg}50%{rotate:4deg}100%{rotate:-4deg}}
.spin{animation:spinr 3s linear infinite}
@keyframes spinr{to{rotate:360deg}}
.pulse{animation:pz 1s ease-in-out infinite}
@keyframes pz{0%,100%{scale:1}50%{scale:1.12}}
/* props */
.line{position:absolute;height:0;border-top:4px solid #6b4a2a}
.line span{position:absolute;top:-6px;transform-origin:50% 0}
.fence{position:absolute;left:0;right:0;background:repeating-linear-gradient(90deg,#fff 0 26px,transparent 26px 40px);opacity:.9}
.mound{position:absolute;background:#fff;border-radius:50% 50% 0 0}
.cloud{position:absolute;background:#8d97a8;border-radius:999px;box-shadow:inset 0 -14px 0 rgba(0,0,0,.12)}
.cloud:before,.cloud:after{content:'';position:absolute;background:inherit;border-radius:50%}
.cloud:before{width:55%;height:150%;left:12%;top:-70%}
.cloud:after{width:40%;height:120%;right:12%;top:-45%}
.cloud.white{background:#fff}
.door{position:absolute;background:#7a4a1f;border-radius:14px 14px 0 0;border:6px solid #5a3510}
.puddle{position:absolute;background:#7fb2e8;border-radius:50%;opacity:.8}
.motion{position:absolute;border-top:4px solid rgba(0,0,0,.35);border-radius:4px}
/* machine (em based) */
.mach{position:absolute}
.mach .ant{position:absolute;left:47%;top:.2em;width:.3em;height:2.2em;background:#3b4a75}
.mach .ball{position:absolute;left:calc(47% - .35em);top:0;width:1em;height:1em;border-radius:50%;background:#ff5d8f;box-shadow:0 0 .6em #ff5d8f}
.mach .body{position:absolute;left:0;right:0;top:2em;bottom:0;background:linear-gradient(#c3cdec,#7d8db8);border:.35em solid #3b4a75;border-radius:1.2em}
.mach .scr{position:absolute;left:12%;right:12%;top:.6em;height:2em;background:#203060;border-radius:.4em;color:#7ef;font-size:1em;display:flex;align-items:center;justify-content:center;letter-spacing:.2em}
.mach .btns{position:absolute;left:8%;right:8%;top:3.1em;display:grid;grid-template-columns:1fr 1fr;gap:.4em}
.mach .b{height:2.1em;border-radius:50%;background:#fff;border:.2em solid #3b4a75;display:flex;align-items:center;justify-content:center;font-size:1em}
.mach .b i{font-style:normal;font-size:1.3em}
.mach .b.glow{background:#ffd23f;box-shadow:0 0 1em .3em #ffd23f}
.mach.crazy{animation:jit .18s linear infinite}
.mach.crazy .scr{animation:flash .3s steps(2) infinite}
@keyframes flash{0%{background:#ff5d8f}100%{background:#3d8bff}}
/* text */
.bub,.cap,.sfx{position:absolute;z-index:5;pointer-events:none;transition:scale .2s,box-shadow .2s}
.bub{background:#fff;border:4px solid #1b1b1b;border-radius:30px;padding:8px 14px;font:700 27px/1.15 'Comic Neue','Comic Sans MS','Chalkboard SE',sans-serif;color:#1b1b1b;text-align:center}
.bub:before,.bub:after{content:'';position:absolute;left:var(--tx);width:0;height:0;border-style:solid}
.bub:before{bottom:-26px;margin-left:-14px;border-width:26px 14px 0 14px;border-color:#1b1b1b transparent transparent}
.bub:after{bottom:-19px;margin-left:-9px;border-width:20px 9px 0 9px;border-color:#fff transparent transparent}
.bub.up:before{bottom:auto;top:-26px;border-width:0 14px 26px 14px;border-color:transparent transparent #1b1b1b}
.bub.up:after{bottom:auto;top:-19px;border-width:0 9px 20px 9px;border-color:transparent transparent #fff}
.bub b{color:#d6336c}
.cap{background:#ffe066;border:4px solid #1b1b1b;padding:6px 12px;font:700 24px/1.15 'Comic Neue','Comic Sans MS',sans-serif;color:#1b1b1b;box-shadow:4px 4px 0 #1b1b1b}
.cap b{color:#d6336c}
.cap.title{background:#3d8bff;color:#fff;font:400 34px/1 Bangers,'Comic Sans MS',sans-serif;letter-spacing:2px;text-shadow:3px 3px 0 #1b1b1b}
.cap.title small{display:block;font:700 20px 'Comic Neue','Comic Sans MS',sans-serif;letter-spacing:0;text-shadow:none;color:#fff9c4}
.sfx{font-family:Bangers,'Impact','Comic Sans MS',sans-serif;letter-spacing:3px;-webkit-text-stroke:3px #1b1b1b;paint-order:stroke fill;text-shadow:5px 5px 0 #1b1b1b;white-space:nowrap}
.talk{scale:1.1;box-shadow:0 0 0 7px #ffd23f}
.sfx.talk{scale:1.25;box-shadow:none}
/* navigation */
.nav{position:absolute;top:360px;width:76px;height:76px;border-radius:50%;border:0;background:#fff;color:#1e2a5a;font-size:44px;font-weight:900;box-shadow:0 7px 0 rgba(0,0,0,.2);cursor:pointer;z-index:20;transition:opacity .3s}
#prev{left:7px} #next{right:7px}
.nav:disabled{opacity:.25;cursor:default}
.nav.hint{animation:pz 1s ease-in-out infinite;background:#ffd23f}
#bar{position:absolute;left:0;right:0;top:818px;height:70px;display:flex;align-items:center;justify-content:center;gap:18px;z-index:20;transition:opacity .3s}
#read{position:absolute;left:90px;top:822px;height:62px;padding:0 26px;border:0;border-radius:999px;background:#3d8bff;color:#fff;font:900 30px 'Comic Neue','Comic Sans MS',sans-serif;box-shadow:0 6px 0 #2766c4;cursor:pointer;z-index:20}
#read.stop{background:#ff7a59;box-shadow:0 6px 0 #c4502f}
.dot{width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.6);border:3px solid #1e2a5a}
.dot.on{background:#1e2a5a}
#pg{font:900 28px 'Comic Neue','Comic Sans MS',sans-serif;color:#1e2a5a;margin-left:10px}
#fin{position:absolute;right:90px;top:822px;height:62px;padding:0 28px;border:0;border-radius:999px;background:#2fbf71;color:#fff;font:900 30px 'Comic Neue','Comic Sans MS',sans-serif;box-shadow:0 6px 0 #1d8a4f;cursor:pointer;z-index:20;display:none}
#tip{position:absolute;left:0;right:0;top:826px;text-align:center;font:900 28px 'Comic Neue','Comic Sans MS',sans-serif;color:#1e2a5a;z-index:21;display:none;pointer-events:none}
body.zoomed .nav,body.zoomed #bar,body.zoomed #fin{opacity:0;pointer-events:none}
body.zoomed #tip{display:block}
</style></head>
<body>
<div id="stage">
  <div id="bg"></div>
  <div id="view"><div id="track"></div></div>
  <button class="nav" id="prev">◀</button>
  <button class="nav" id="next">▶</button>
  <button id="read">🔊 Read to me</button>
  <div id="bar"></div>
  <button id="fin">THE END ⭐</button>
  <div id="tip">Tap to go back to the page</div>
</div>
<script>
var AUDIO={};
var PICS={ astro:'images/astro.png', alex:'images/alex_friend.png', ufo:'images/astro_ufo.png' };
/* finished comic art (one picture per panel, no text in it). Missing pictures are drawn by code. */
for(var p=1;p<=3;p++) for(var n=1;n<=6;n++) PICS['p'+p+'_'+n]='images/l3/comic_p'+p+'_'+n+'.jpg';
</script>
<script>
/* ===== Astro & Alex shared game base ===== */
var G=(function(){
  var W=1600,H=900, stage=document.getElementById('stage'), scale=1;
  var DEBUG=/[?&]debug=1/.test(location.search);
  function fit(){
    scale=Math.min(window.innerWidth/W, window.innerHeight/H);
    stage.style.transform='translate(-50%,-50%) scale('+scale+')';
  }
  window.addEventListener('resize',fit); fit();
  function toStage(e){
    var r=stage.getBoundingClientRect();
    return {x:(e.clientX-r.left)/scale, y:(e.clientY-r.top)/scale};
  }
  /* ---------- speech: one queue, never overlapping ---------- */
  var AUDIO=window.AUDIO||{}; var voice=null; var queue=Promise.resolve(); var pending=0;
  function pickVoice(){
    if(!('speechSynthesis' in window)) return;
    var vs=speechSynthesis.getVoices().filter(function(v){return /^en[-_]US/i.test(v.lang);});
    var pref=['Samantha','Google US English','Microsoft Aria','Microsoft Jenny','Karen','Ava','Allison'];
    for(var i=0;i<pref.length;i++){ for(var j=0;j<vs.length;j++){ if(vs[j].name.indexOf(pref[i])>=0){voice=vs[j];return;} } }
    voice=vs[0]||null;
  }
  if('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged=pickVoice; }
  function speakNow(text,o){ o=o||{};
    return new Promise(function(res){
      var done=false; function fin(){ if(!done){done=true; res();} }
      var safety=setTimeout(fin, 1800+text.length*95);
      var file=AUDIO[text];
      if(file){ var a=new Audio(file); a.onended=fin; a.onerror=fin; a.play().catch(fin); return; }
      if(!('speechSynthesis' in window)){ setTimeout(fin, 500+text.length*55); return; }
      var u=new SpeechSynthesisUtterance(text.replace(/\.\.\./g,', '));
      u.lang='en-US'; u.rate=o.rate||0.9; u.pitch=o.pitch||1.05; if(voice) u.voice=voice;
      u.onend=function(){clearTimeout(safety); setTimeout(fin,120);}; u.onerror=function(){clearTimeout(safety); fin();};
      speechSynthesis.speak(u);
    });
  }
  function say(text,o){ pending++; queue=queue.then(function(){return speakNow(text,o);}).then(function(){pending--;}); return queue; }
  function sayIfFree(text){ if(pending>0) return queue; return say(text); }
  function busy(){ return pending>0; }
  /* ---------- sound effects ---------- */
  var ac=null;
  function audioInit(){ try{ if(!ac) ac=new (window.AudioContext||window.webkitAudioContext)(); if(ac.state==='suspended') ac.resume(); }catch(e){} }
  function tone(f,d,type,vol,f2,delay){
    if(!ac) return; var t=ac.currentTime+(delay||0);
    var o=ac.createOscillator(), g=ac.createGain(); o.type=type||'sine'; o.frequency.setValueAtTime(f,t);
    if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+d);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol||0.2,t+0.015); g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+d+0.05);
  }
  function noise(d,vol,freq,delay){
    if(!ac) return; var t=ac.currentTime+(delay||0), n=Math.floor(ac.sampleRate*d), b=ac.createBuffer(1,n,ac.sampleRate), ch=b.getChannelData(0);
    for(var i=0;i<n;i++) ch[i]=(Math.random()*2-1)*Math.sin(Math.PI*i/n);
    var s=ac.createBufferSource(); s.buffer=b; var f=ac.createBiquadFilter(); f.type='bandpass'; f.frequency.value=freq||800; f.Q.value=0.7;
    var g=ac.createGain(); g.gain.value=vol||0.3; s.connect(f); f.connect(g); g.connect(ac.destination); s.start(t);
  }
  var sfx={
    pop:function(){tone(520,0.12,'sine',0.25,980);},
    ding:function(){tone(1046,0.35,'triangle',0.2); tone(1568,0.4,'triangle',0.12,null,0.08);},
    boing:function(){tone(220,0.35,'square',0.08,520);},
    soft:function(){tone(300,0.15,'sine',0.12,240);},
    whoosh:function(){noise(0.9,0.35,600);},
    cheer:function(){[523,659,784,1046].forEach(function(f,i){tone(f,0.25,'triangle',0.18,null,i*0.09);});},
    flip:function(){noise(0.12,0.25,2500);},
    sparkle:function(){[1318,1568,2093].forEach(function(f,i){tone(f,0.18,'sine',0.1,null,i*0.06);});},
    thump:function(){tone(120,0.2,'sine',0.35,60);},
    click:function(){tone(900,0.05,'square',0.06);}
  };
  /* ---------- pictures with placeholders ---------- */
  var img={};
  function loadOne(paths){
    paths=[].concat(paths);
    return new Promise(function(res){
      var i=0; (function next(){
        if(i>=paths.length) return res(null);
        var im=new Image(); im.onload=function(){res(im);}; im.onerror=function(){i++; next();}; im.src=paths[i];
      })();
    });
  }
  function loadPics(P){
    var keys=Object.keys(P);
    return Promise.all(keys.map(function(k){return loadOne(P[k]).then(function(im){img[k]=im;});}));
  }
  /* art(key,{x,y,w,h,emoji,word,cls,parent,z}) -> absolutely positioned element with the picture or a placeholder */
  function art(key,o){
    o=o||{}; var d=document.createElement('div'); d.className='art '+(o.cls||'');
    if(o.w!=null){d.style.width=o.w+'px';} if(o.h!=null){d.style.height=o.h+'px';}
    if(o.x!=null) d.style.left=o.x+'px'; if(o.y!=null) d.style.top=o.y+'px'; if(o.z!=null) d.style.zIndex=o.z;
    var im=img[key];
    if(im){ var c=document.createElement('img'); c.src=im.src; c.alt=''; d.appendChild(c); d.dataset.real='1'; }
    else{ var p=document.createElement('div'); p.className='ph'; p.style.fontSize=Math.round(Math.min(o.w||160,o.h||160)*0.62)+'px';
      p.innerHTML='<div class="e">'+(o.emoji||'🖼️')+'</div>'+(o.word?'<div class="w">'+o.word+'</div>':''); d.appendChild(p); }
    (o.parent||stage).appendChild(d); return d;
  }
  function has(key){ return !!img[key]; }
  /* ---------- helpers ---------- */
  function wait(ms){return new Promise(function(r){setTimeout(r,ms);});}
  function shuffle(a){a=a.slice(); for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t;} return a;}
  function rand(a,b){return a+Math.random()*(b-a);}
  function el(tag,cls,parent,html){var e=document.createElement(tag); if(cls)e.className=cls; if(html!=null)e.innerHTML=html; (parent||stage).appendChild(e); return e;}
  function anim(e,cls){ e.classList.remove(cls); void e.offsetWidth; e.classList.add(cls); setTimeout(function(){e.classList.remove(cls);},600); }
  /* ---------- confetti ---------- */
  var cv=el('canvas',''); cv.id='confetti'; cv.width=W; cv.height=H; var cx=cv.getContext('2d'), parts=[], running=false;
  function confetti(n){
    var cols=['#ff8a1f','#2fbf71','#3d8bff','#ffd23f','#ff5d8f','#9b5de5'];
    for(var i=0;i<(n||160);i++) parts.push({x:rand(0,W),y:rand(-300,-20),vx:rand(-2,2),vy:rand(3,8),r:rand(0,6.3),vr:rand(-.2,.2),s:rand(10,20),c:cols[i%cols.length]});
    if(!running){running=true; requestAnimationFrame(step);}
  }
  function step(){
    cx.clearRect(0,0,W,H);
    parts.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.r+=p.vr; cx.save(); cx.translate(p.x,p.y); cx.rotate(p.r); cx.fillStyle=p.c; cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); cx.restore();});
    parts=parts.filter(function(p){return p.y<H+40;});
    if(parts.length) requestAnimationFrame(step); else {running=false; cx.clearRect(0,0,W,H);}
  }
  /* ---------- start / end screens ---------- */
  function overlay(title,text,btn,cls){
    var o=el('div','overlay'); var c=el('div','ovcard',o);
    el('h1','',c,title); if(text) el('p','',c,text);
    var b=el('button','bigbtn '+(cls||''),c,btn); return {o:o,b:b,c:c};
  }
  function boot(opt){
    var s=overlay(opt.title,opt.instruction,'START');
    s.b.disabled=true; s.b.style.opacity=.5;
    loadPics(opt.pics||{}).then(function(){ s.b.disabled=false; s.b.style.opacity=1; if(opt.ready) opt.ready(); });
    s.b.addEventListener('click',function(){
      audioInit(); if('speechSynthesis' in window){ try{ speechSynthesis.cancel(); var u=new SpeechSynthesisUtterance(' '); u.volume=0; speechSynthesis.speak(u);}catch(e){} }
      sfx.click(); s.o.classList.add('hidden'); opt.start();
    });
    G.end=function(title,text){
      sfx.cheer(); confetti(220);
      var e=overlay(title||'Well done!',text||'','PLAY AGAIN','green');
      e.o.style.background='rgba(19,32,74,.35)';
      e.b.addEventListener('click',function(){ sfx.click(); e.o.remove(); opt.start(); });
    };
  }
  return {W:W,H:H,stage:stage,DEBUG:DEBUG,toStage:toStage,say:say,sayIfFree:sayIfFree,busy:busy,sfx:sfx,img:img,art:art,has:has,
    wait:wait,shuffle:shuffle,rand:rand,el:el,anim:anim,confetti:confetti,boot:boot,audioInit:audioInit,tone:tone,noise:noise,scale:function(){return scale;}};
})();

</script>
<script>
(function(){
/* ======================= THE STORY =======================
 rows: heights of the two rows; w: panel widths per row (each row adds up to 1348).
 bg: sky/ground; fx: weather; it: things in the picture [kind, centreX%, bottomY%, height%, options]

 Text positions: x,y,w in % of the panel; t = tail position in % of the bubble width; up = tail on top. */
