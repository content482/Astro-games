<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>What Changed?</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#13204a;touch-action:none;user-select:none;-webkit-user-select:none}
body{font-family:ui-rounded,"Arial Rounded MT Bold","Nunito","Varela Round","Trebuchet MS",system-ui,sans-serif;color:#1e2a5a}
#stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform-origin:center center;overflow:hidden;background:#bfe6ff;border-radius:6px}
#stage img{-webkit-user-drag:none;user-select:none;pointer-events:none}
.layer{position:absolute;inset:0}
.overlay{position:absolute;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;background:rgba(19,32,74,.62);text-align:center;padding:40px}
.overlay.hidden{display:none}
.ovcard{background:#fff;border-radius:44px;padding:48px 70px;box-shadow:0 18px 0 rgba(0,0,0,.18);max-width:1150px;display:flex;flex-direction:column;align-items:center;gap:22px}
.ovcard h1{margin:0;font-size:84px;line-height:1.05;color:#1e2a5a}
.ovcard p{margin:0;font-size:40px;line-height:1.3;color:#3b4a7a}
.bigbtn{font:inherit;font-size:58px;font-weight:800;color:#fff;background:#ff8a1f;border:0;border-radius:999px;padding:22px 80px;box-shadow:0 10px 0 #c95f00;cursor:pointer;letter-spacing:2px}
.bigbtn:active{transform:translateY(6px);box-shadow:0 4px 0 #c95f00}
.bigbtn.green{background:#2fbf71;box-shadow:0 10px 0 #1d8a4f}
.ph{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100%;border-radius:26px;background:rgba(255,255,255,.88);border:5px dashed #8fa2d6;color:#1e2a5a;font-weight:800;text-align:center;overflow:hidden;line-height:1}
.ph .e{font-size:1em}
.ph .w{font-size:.28em;margin-top:.08em;letter-spacing:1px}
.art{position:absolute;display:flex;align-items:flex-end;justify-content:center}
.art>img{width:100%;height:100%;object-fit:contain}
.wobble{animation:wob .5s}
@keyframes wob{0%,100%{translate:0 0;rotate:0deg}20%{translate:-14px 0;rotate:-4deg}40%{translate:12px 0;rotate:3deg}60%{translate:-8px 0;rotate:-2deg}80%{translate:5px 0;rotate:0deg}}
.bounce{animation:bnc .45s}
@keyframes bnc{0%,100%{scale:1}40%{scale:1.18}70%{scale:.95}}
.bubble{pointer-events:none;position:absolute;background:#fff;border-radius:34px;padding:18px 30px;font-size:42px;font-weight:800;box-shadow:0 8px 0 rgba(0,0,0,.15);z-index:40;white-space:nowrap}
#confetti{position:absolute;inset:0;pointer-events:none;z-index:120}
#soundHint{position:absolute;right:18px;top:14px;z-index:90;font-size:34px;background:rgba(255,255,255,.85);border-radius:999px;padding:6px 16px;display:none}

#bg{position:absolute;inset:0;background:linear-gradient(135deg,#ffe8c2,#ffd1dc)}
.ph2{position:absolute;width:900px;height:560px;border:14px solid #fff;box-shadow:0 10px 0 rgba(0,0,0,.18);overflow:hidden;background:#cfeaff;transition:all .6s ease}
.ph2>img{width:100%;height:100%;object-fit:cover}
.ph2.a{left:350px;top:110px;z-index:3}.ph2.b{left:350px;top:110px;z-index:4;cursor:pointer}
.side .ph2.a{left:40px;top:180px;transform:scale(.82);transform-origin:0 0}
.side .ph2.b{left:810px;top:180px;transform:scale(.82);transform-origin:0 0}
.pc{position:absolute;line-height:1}
.pc .art{left:0;top:0}
.circ{position:absolute;border:9px solid #ff3d6e;border-radius:50%;pointer-events:none;box-shadow:0 0 0 4px #fff;z-index:5}
.glow{position:absolute;border-radius:50%;pointer-events:none;background:radial-gradient(rgba(255,230,80,.8),rgba(255,230,80,0) 70%);animation:hg 1s infinite alternate;z-index:5}
@keyframes hg{from{opacity:.3}to{opacity:1}}
.puff{position:absolute;width:60px;height:60px;border-radius:50%;background:rgba(255,255,255,.9);pointer-events:none;z-index:6}
#tagA,#tagB{position:absolute;top:110px;font-size:38px;font-weight:900;color:#fff;border-radius:999px;padding:4px 24px;z-index:8;display:none}
#tagA{left:60px;background:#3d8bff}#tagB{left:830px;background:#ff8a1f}
#ring{position:absolute;left:1270px;top:110px;width:110px;height:110px;z-index:8}
#ring circle{fill:none;stroke-width:12}#ring text{font-size:54px;font-weight:900;fill:#1e2a5a}
#astro{position:absolute;left:40px;top:560px;width:220px;height:320px;z-index:7;pointer-events:none}
#astro .art{left:0;top:0}
#say{position:absolute;left:270px;top:740px;font-size:44px;z-index:9}
#rd{position:absolute;right:40px;top:30px;font-size:36px;font-weight:900;background:#fff;border-radius:999px;padding:6px 22px;box-shadow:0 5px 0 rgba(0,0,0,.15)}
</style></head>
<body>
<div id="stage">
  <div id="bg"></div>
  <div id="wrap"></div>
  <div id="tagA">BEFORE</div><div id="tagB">NOW</div>
  <svg id="ring" viewBox="0 0 110 110"><circle cx="55" cy="55" r="46" stroke="#e3e8f4"/><circle id="arc" cx="55" cy="55" r="46" stroke="#ff8a1f" stroke-dasharray="289" transform="rotate(-90 55 55)"/><text x="55" y="74" text-anchor="middle" id="sec">4</text></svg>
  <div id="astro"></div>
  <div class="bubble" id="say" style="display:none"></div>
  <div id="rd">1 / 3</div>
</div>
<script>
var AUDIO={};
var PICS={ astro:'../images/astro.png', alex:'../images/alex_friend.png', jacket:'../images/l3/jacket.png',
  shirt_a:'../images/l5/shirt_a.jpg', shirt_b:'../images/l5/shirt_b.jpg', face_a:'../images/l5/face_a.jpg', face_b:'../images/l5/face_b.jpg', balloons_a:'../images/l5/balloons_a.jpg', balloons_b:'../images/l5/balloons_b.jpg' };
/* Where the change is in the designer's photo pairs (percent of the picture). Check with ?debug=1. */
var ZONES={ shirt:{x:50,y:55,r:16}, face:{x:50,y:28,r:12}, balloons:{x:50,y:30,r:30} };
</script>
<script>
/* ===== Astro & Alex shared game base ===== */
var G=(function(){
  var W=1600,H=900, stage=document.getElementById('stage'), scale=1;
  var DEBUG=/[?&]debug=1/.test(location.search);
  function fit(){
    scale=Math.min(window.innerWidth/W, window.innerHeight/H);
    stage.style.transform='translate(-50%,-50%) scale('+scale+')';
  }
  window.addEventListener('resize',fit); fit();
  function toStage(e){
    var r=stage.getBoundingClientRect();
    return {x:(e.clientX-r.left)/scale, y:(e.clientY-r.top)/scale};
  }
  /* ---------- speech: one queue, never overlapping ---------- */
  var AUDIO=window.AUDIO||{}; var voice=null; var queue=Promise.resolve(); var pending=0;
  function pickVoice(){
    if(!('speechSynthesis' in window)) return;
    var vs=speechSynthesis.getVoices().filter(function(v){return /^en[-_]US/i.test(v.lang);});
    var pref=['Samantha','Google US English','Microsoft Aria','Microsoft Jenny','Karen','Ava','Allison'];
    for(var i=0;i<pref.length;i++){ for(var j=0;j<vs.length;j++){ if(vs[j].name.indexOf(pref[i])>=0){voice=vs[j];return;} } }
    voice=vs[0]||null;
  }
  if('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged=pickVoice; }
  function speakNow(text){
    return new Promise(function(res){
      var done=false; function fin(){ if(!done){done=true; res();} }
      var safety=setTimeout(fin, 1800+text.length*95);
      var file=AUDIO[text];
      if(file){ var a=new Audio(file); a.onended=fin; a.onerror=fin; a.play().catch(fin); return; }
      if(!('speechSynthesis' in window)){ setTimeout(fin, 500+text.length*55); return; }
      var u=new SpeechSynthesisUtterance(text.replace(/\.\.\./g,', '));
      u.lang='en-US'; u.rate=0.9; u.pitch=1.05; if(voice) u.voice=voice;
      u.onend=function(){clearTimeout(safety); setTimeout(fin,120);}; u.onerror=function(){clearTimeout(safety); fin();};
      speechSynthesis.speak(u);
    });
  }
  function say(text){ pending++; queue=queue.then(function(){return speakNow(text);}).then(function(){pending--;}); return queue; }
  function sayIfFree(text){ if(pending>0) return queue; return say(text); }
  function busy(){ return pending>0; }
  /* ---------- sound effects ---------- */
  var ac=null;
  function audioInit(){ try{ if(!ac) ac=new (window.AudioContext||window.webkitAudioContext)(); if(ac.state==='suspended') ac.resume(); }catch(e){} }
  function tone(f,d,type,vol,f2,delay){
    if(!ac) return; var t=ac.currentTime+(delay||0);
    var o=ac.createOscillator(), g=ac.createGain(); o.type=type||'sine'; o.frequency.setValueAtTime(f,t);
    if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+d);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol||0.2,t+0.015); g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+d+0.05);
  }
  function noise(d,vol,freq,delay){
    if(!ac) return; var t=ac.currentTime+(delay||0), n=Math.floor(ac.sampleRate*d), b=ac.createBuffer(1,n,ac.sampleRate), ch=b.getChannelData(0);
    for(var i=0;i<n;i++) ch[i]=(Math.random()*2-1)*Math.sin(Math.PI*i/n);
    var s=ac.createBufferSource(); s.buffer=b; var f=ac.createBiquadFilter(); f.type='bandpass'; f.frequency.value=freq||800; f.Q.value=0.7;
    var g=ac.createGain(); g.gain.value=vol||0.3; s.connect(f); f.connect(g); g.connect(ac.destination); s.start(t);
  }
  var sfx={
    pop:function(){tone(520,0.12,'sine',0.25,980);},
    ding:function(){tone(1046,0.35,'triangle',0.2); tone(1568,0.4,'triangle',0.12,null,0.08);},
    boing:function(){tone(220,0.35,'square',0.08,520);},
    soft:function(){tone(300,0.15,'sine',0.12,240);},
    whoosh:function(){noise(0.9,0.35,600);},
    cheer:function(){[523,659,784,1046].forEach(function(f,i){tone(f,0.25,'triangle',0.18,null,i*0.09);});},
    flip:function(){noise(0.12,0.25,2500);},
    sparkle:function(){[1318,1568,2093].forEach(function(f,i){tone(f,0.18,'sine',0.1,null,i*0.06);});},
    thump:function(){tone(120,0.2,'sine',0.35,60);},
    click:function(){tone(900,0.05,'square',0.06);}
  };
  /* ---------- pictures with placeholders ---------- */
  var img={};
  function loadOne(paths){
    paths=[].concat(paths);
    return new Promise(function(res){
      var i=0; (function next(){
        if(i>=paths.length) return res(null);
        var im=new Image(); im.onload=function(){res(im);}; im.onerror=function(){i++; next();}; im.src=paths[i];
      })();
    });
  }
  function loadPics(P){
    var keys=Object.keys(P);
    return Promise.all(keys.map(function(k){return loadOne(P[k]).then(function(im){img[k]=im;});}));
  }
  /* art(key,{x,y,w,h,emoji,word,cls,parent,z}) -> absolutely positioned element with the picture or a placeholder */
  function art(key,o){
    o=o||{}; var d=document.createElement('div'); d.className='art '+(o.cls||'');
    if(o.w!=null){d.style.width=o.w+'px';} if(o.h!=null){d.style.height=o.h+'px';}
    if(o.x!=null) d.style.left=o.x+'px'; if(o.y!=null) d.style.top=o.y+'px'; if(o.z!=null) d.style.zIndex=o.z;
    var im=img[key];
    if(im){ var c=document.createElement('img'); c.src=im.src; c.alt=''; d.appendChild(c); d.dataset.real='1'; }
    else{ var p=document.createElement('div'); p.className='ph'; p.style.fontSize=Math.round(Math.min(o.w||160,o.h||160)*0.62)+'px';
      p.innerHTML='<div class="e">'+(o.emoji||'🖼️')+'</div>'+(o.word?'<div class="w">'+o.word+'</div>':''); d.appendChild(p); }
    (o.parent||stage).appendChild(d); return d;
  }
  function has(key){ return !!img[key]; }
  /* ---------- helpers ---------- */
  function wait(ms){return new Promise(function(r){setTimeout(r,ms);});}
  function shuffle(a){a=a.slice(); for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t;} return a;}
  function rand(a,b){return a+Math.random()*(b-a);}
  function el(tag,cls,parent,html){var e=document.createElement(tag); if(cls)e.className=cls; if(html!=null)e.innerHTML=html; (parent||stage).appendChild(e); return e;}
  function anim(e,cls){ e.classList.remove(cls); void e.offsetWidth; e.classList.add(cls); setTimeout(function(){e.classList.remove(cls);},600); }
  /* ---------- confetti ---------- */
  var cv=el('canvas',''); cv.id='confetti'; cv.width=W; cv.height=H; var cx=cv.getContext('2d'), parts=[], running=false;
  function confetti(n){
    var cols=['#ff8a1f','#2fbf71','#3d8bff','#ffd23f','#ff5d8f','#9b5de5'];
    for(var i=0;i<(n||160);i++) parts.push({x:rand(0,W),y:rand(-300,-20),vx:rand(-2,2),vy:rand(3,8),r:rand(0,6.3),vr:rand(-.2,.2),s:rand(10,20),c:cols[i%cols.length]});
    if(!running){running=true; requestAnimationFrame(step);}
  }
  function step(){
    cx.clearRect(0,0,W,H);
    parts.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.r+=p.vr; cx.save(); cx.translate(p.x,p.y); cx.rotate(p.r); cx.fillStyle=p.c; cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); cx.restore();});
    parts=parts.filter(function(p){return p.y<H+40;});
    if(parts.length) requestAnimationFrame(step); else {running=false; cx.clearRect(0,0,W,H);}
  }
  /* ---------- start / end screens ---------- */
  function overlay(title,text,btn,cls){
    var o=el('div','overlay'); var c=el('div','ovcard',o);
    el('h1','',c,title); if(text) el('p','',c,text);
    var b=el('button','bigbtn '+(cls||''),c,btn); return {o:o,b:b,c:c};
  }
  function boot(opt){
    var s=overlay(opt.title,opt.instruction,'START');
    s.b.disabled=true; s.b.style.opacity=.5;
    loadPics(opt.pics||{}).then(function(){ s.b.disabled=false; s.b.style.opacity=1; if(opt.ready) opt.ready(); });
    s.b.addEventListener('click',function(){
      audioInit(); if('speechSynthesis' in window){ try{ speechSynthesis.cancel(); var u=new SpeechSynthesisUtterance(' '); u.volume=0; speechSynthesis.speak(u);}catch(e){} }
      sfx.click(); s.o.classList.add('hidden'); opt.start();
    });
    G.end=function(title,text){
      sfx.cheer(); confetti(220);
      var e=overlay(title||'Well done!',text||'','PLAY AGAIN','green');
      e.o.style.background='rgba(19,32,74,.35)';
      e.b.addEventListener('click',function(){ sfx.click(); e.o.remove(); opt.start(); });
    };
  }
  return {W:W,H:H,stage:stage,DEBUG:DEBUG,toStage:toStage,say:say,sayIfFree:sayIfFree,busy:busy,sfx:sfx,img:img,art:art,has:has,
    wait:wait,shuffle:shuffle,rand:rand,el:el,anim:anim,confetti:confetti,boot:boot,audioInit:audioInit,tone:tone,noise:noise,scale:function(){return scale;}};
})();

</script>
<script>
(function(){
var ROUNDS=[{k:'shirt',line:'Now it is a JACKET!'},{k:'face',line:'Alex is ANGRY! Just pretend!'},{k:'balloons',line:'Now there are TWENTY balloons!'}];
var PW=872, PH=532;
var FALL={shirt:{x:436,y:270,r:120},face:{x:436,y:130,r:95},balloons:{x:436,y:150,r:330}};
var S=G.stage, wrap=document.getElementById('wrap'), sayEl=document.getElementById('say');
var ri=0, A=null, B=null, misses=0, busy=true, glowEl=null;
function talk(t){ sayEl.textContent=t; sayEl.style.display='block'; G.anim(sayEl,'bounce'); return G.say(t); }
function e(p,t,x,y,s,extra){ var d=G.el('div','pc',p,t); d.style.cssText+=';left:'+x+'px;top:'+y+'px;font-size:'+s+'px;'+(extra||''); return d; }
function photo(k,which){
  var p=document.createElement('div'); p.className='ph2 '+which;
  var key=k+'_'+which;
  if(G.has(key)){ var im=document.createElement('img'); im.src=G.img[key].src; p.appendChild(im); return p; }
  if(k==='shirt'||k==='face'){
    p.style.background='linear-gradient(#ffe7b3 0 75%,#d9a86c 75%)'; e(p,'🖼️',60,60,120); e(p,'🪴',700,330,140);
    var a=G.el('div','pc',p); a.style.cssText='left:286px;top:20px;width:300px;height:500px'; G.art('alex',{x:0,y:0,w:300,h:500,emoji:'🧒',parent:a});
    if(k==='shirt' && which==='b'){ var j=G.el('div','pc',p); j.style.cssText='left:326px;top:180px;width:220px;height:200px'; G.art('jacket',{x:0,y:0,w:220,h:200,emoji:'🧥',parent:j}); }
    if(k==='face' && which==='b'){ e(p,'😤',372,62,128); }
  } else {
    p.style.background='linear-gradient(#ffd1dc 0 70%,#c98b4f 70%)';
    var n=which==='a'?14:20; for(var i=0;i<n;i++){ var col=i%10, row=Math.floor(i/10); e(p,'🎈',60+col*78+(row?38:0),30+row*120,70); }
    var t=G.el('div','pc',p); t.style.cssText='left:120px;top:370px;width:640px;height:40px;background:#8a5426;border-radius:10px'; e(p,'🎂',380,270,110); e(p,'🎁',190,290,80); e(p,'🎁',590,290,80);
  }
  return p;
}
function zone(k){ if(G.has(k+'_a')){ var z=ZONES[k]; return {x:z.x/100*PW,y:z.y/100*PH,r:z.r/100*PW}; } return FALL[k]; }
async function countdown(sec){ var ring=document.getElementById('ring'), arc=document.getElementById('arc'), t=document.getElementById('sec'); ring.style.display='block';
  for(var s=sec;s>0;s--){ t.textContent=s; arc.style.strokeDashoffset=289*(1-s/sec); await G.wait(1000); G.tone(700,0.05,'sine',0.06); } ring.style.display='none'; }
async function round(){
  busy=true; misses=0; wrap.className=''; wrap.innerHTML=''; document.getElementById('tagA').style.display='none'; document.getElementById('tagB').style.display='none';
  var k=ROUNDS[ri].k; document.getElementById('rd').textContent=(ri+1)+' / 3';
  A=photo(k,'a'); wrap.appendChild(A);
  await talk(ri===0?'Look at my photo! Remember it!':'Remember this one!'); await countdown(4);
  B=photo(k,'b'); B.style.opacity=0; wrap.appendChild(B); G.sfx.whoosh(); B.animate([{opacity:0},{opacity:1}],{duration:500,fill:'forwards'}); await G.wait(500); B.style.opacity=1; A.style.visibility='hidden';
  B.addEventListener('pointerdown',tap);
  if(G.DEBUG){ var z=zone(k); var c=G.el('div','circ',B); c.style.cssText+=';left:'+(z.x-z.r)+'px;top:'+(z.y-z.r)+'px;width:'+(2*z.r)+'px;height:'+(2*z.r)+'px;border-style:dashed'; }
  await talk('What changed? Tap it!'); busy=false;
}
async function tap(ev){
  if(busy) return; var k=ROUNDS[ri].k; var r=B.getBoundingClientRect(), sc=G.scale(); var x=(ev.clientX-r.left)/sc-14, y=(ev.clientY-r.top)/sc-14; var z=zone(k);
  var inside = k==='balloons' ? (y<z.y+130 && y>0) : Math.hypot(x-z.x,y-z.y)<z.r;
  if(!inside){ var pf=G.el('div','puff',B); pf.style.left=(x-30)+'px'; pf.style.top=(y-30)+'px'; G.sfx.soft();
    pf.animate([{transform:'scale(.3)',opacity:1},{transform:'scale(1.4)',opacity:0}],{duration:450}).onfinish=function(){pf.remove();};
    misses++; if(misses===2 && !glowEl){ glowEl=G.el('div','glow',B); var gr=Math.min(z.r,200); glowEl.style.cssText+=';left:'+(z.x-gr)+'px;top:'+(z.y-gr)+'px;width:'+(2*gr)+'px;height:'+(2*gr)+'px'; }
    return; }
  busy=true; if(glowEl){ glowEl.remove(); glowEl=null; } G.sfx.ding();
  [A,B].forEach(function(p){ var c=G.el('div','circ',p); var rr=k==='balloons'?0:z.r; if(k==='balloons'){ c.style.cssText+=';left:30px;top:10px;width:'+(PW-60)+'px;height:260px;border-radius:60px'; } else c.style.cssText+=';left:'+(z.x-rr)+'px;top:'+(z.y-rr)+'px;width:'+(2*rr)+'px;height:'+(2*rr)+'px'; });
  A.style.visibility='visible'; wrap.className='side'; document.getElementById('tagA').style.display='block'; document.getElementById('tagB').style.display='block';
  await G.wait(700); await talk(ROUNDS[ri].line); await G.wait(1200);
  ri++; if(ri<ROUNDS.length) round(); else { await talk('Good eyes!'); G.end('Good eyes!','You found every change.'); }
}
function start(){ var a=document.getElementById('astro'); a.innerHTML=''; G.art('astro',{x:0,y:0,w:220,h:320,emoji:'👽',parent:a}); ri=0; round(); }
window.__game={state:function(){ var z=ROUNDS[ri]?zone(ROUNDS[ri].k):null; var r=B?B.getBoundingClientRect():null, sc=G.scale(); return {ri:ri,busy:busy,zx:r&&z?r.left+(z.x+14)*sc:0,zy:r&&z?r.top+(z.y+14)*sc:0,px:r?r.left+30*sc:0,py:r?r.bottom-30*sc:0}; }};
G.boot({title:'What Changed?',instruction:'Look at the photo and remember it.<br>Then something changes!<br><b>Tap</b> the thing that changed.',pics:PICS,start:start});
})();
</script>
</body></html>
