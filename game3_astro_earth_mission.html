    background-position:center bottom;
    background-repeat:no-repeat;
  }

  /* ---- ground row: flexbox guarantees even spacing, no overlap ---- */
  #ground-row{ position:absolute; inset:0; pointer-events:none; }
  .spot{
    position:absolute; pointer-events:auto; cursor:pointer;
    transition:opacity .4s, filter .3s;
    transform:translateX(-50%);
  }
  .spot.done{ opacity:0.35; filter:grayscale(0.6); }
  .spot img{ display:block; width:auto; max-width:none; filter:drop-shadow(0 6px 8px rgba(0,0,0,0.25)); }

  /* Scattered around the ground in three depth bands (back/mid/front)
     rather than lined up in a row - sizes reflect real-world scale
     (house bigger than a person, dog/ball/bag smaller foreground props). */
  #house{     left:24%; bottom:33%; }
  #house img{ height:165px; }

  #spaceship{     left:85%; bottom:28%; }
  #spaceship img{ height:108px; }

  #alex-spot{     left:56%; bottom:15%; }
  #alex-spot img{ height:150px; }

  #dog{     left:84%; bottom:4%; }
  #dog img{ height:84px; }

  #ball{     left:14%; bottom:2%; }
  #ball img{ height:52px; }

  #bag{     left:40%; bottom:1%; }
  #bag img{ height:60px; }

  /* generic reaction pop (bounce + glow) for photographed objects */
  @keyframes reactPop{
    0%{ transform:scale(1) rotate(0deg); }
    30%{ transform:scale(1.18) rotate(-4deg); }
    60%{ transform:scale(0.96) rotate(3deg); }
    100%{ transform:scale(1) rotate(0deg); }
  }
  .spot.reacting img{ animation:reactPop 0.6s ease; filter:drop-shadow(0 6px 8px rgba(0,0,0,0.25)) drop-shadow(0 0 16px rgba(255,201,60,0.8)); }

  @keyframes bounceBallReal{
    0%,100%{ transform:translateY(0); }
    50%{ transform:translateY(-30px); }
  }
  #ball.reacting img{ animation:bounceBallReal 0.6s ease-in-out 2; }

  @keyframes shipGlowReal{
    0%,100%{ filter:drop-shadow(0 6px 8px rgba(0,0,0,0.25)) drop-shadow(0 0 0 rgba(255,201,60,0)); }
    50%{ filter:drop-shadow(0 6px 8px rgba(0,0,0,0.25)) drop-shadow(0 0 20px rgba(255,201,60,0.95)); }
  }
  #spaceship.reacting img{ animation:shipGlowReal 0.6s ease-in-out 2; }

  .spot-label{
    position:absolute; left:50%; bottom:100%; transform:translateX(-50%);
    background:rgba(10,14,40,0.0); color:transparent; font-size:11px; font-weight:800;
    padding:2px 8px; border-radius:8px; white-space:nowrap; pointer-events:none;
    transition:background .2s, color .2s; margin-bottom:4px;
  }
  .spot.found .spot-label{ background:rgba(10,14,40,0.75); color:var(--fuel-amber); }

  /* ---- Astro (player) ---- */
  #astro{
    position:absolute; z-index:20;
    transform:translate(-50%,-100%);
    pointer-events:none;
  }
  #astro img{ display:block; height:130px; width:auto; filter:drop-shadow(0 8px 10px rgba(0,0,0,0.3)); }
  #astro.walking img{ animation:astroBob 0.4s ease-in-out infinite; }
  @keyframes astroBob{ 0%,100%{ margin-top:0;} 50%{ margin-top:-8px;} }

  /* ---- HUD ---- */
  #mission-bar{
    position:absolute; top:14px; left:50%; transform:translateX(-50%);
    width:min(560px,92%);
    background:rgba(10,14,40,0.82);
    border:2px solid rgba(95,217,232,0.5);
    border-radius:18px;
    padding:12px 16px;
    z-index:10;
    display:flex; align-items:center; gap:12px;
  }
  #mission-icon{ font-size:22px; }
  #mission-text{ flex:1; color:var(--white); font-weight:800; font-size:clamp(15px,3.4vw,19px); text-shadow:0 1px 3px rgba(0,0,0,0.4); }
  .mission-btn{
    font-family:inherit; border:none; border-radius:50%; width:38px; height:38px;
    display:flex; align-items:center; justify-content:center; font-size:16px; cursor:pointer;
    background:rgba(255,201,60,0.2); color:var(--fuel-amber); border:2px solid rgba(255,201,60,0.5);
  }
  #found-badge{
    position:absolute; top:64px; left:50%; transform:translateX(-50%);
    z-index:10; background:rgba(10,14,40,0.7); border:2px solid rgba(126,217,87,0.5);
    color:var(--white); font-weight:800; font-size:12px; padding:4px 12px; border-radius:999px;
  }

  /* reaction caption strip */
  #caption-bar{
    position:absolute; left:50%; bottom:14px; transform:translateX(-50%) translateY(20px);
    width:min(520px,92%); z-index:22;
    background:rgba(10,14,40,0.9); border:3px solid var(--fuel-amber); border-radius:18px;
    padding:14px 18px; text-align:center;
    opacity:0; pointer-events:none; transition:opacity .25s, transform .25s;
  }
  #caption-bar.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  #caption-speaker{ font-size:11px; font-weight:800; letter-spacing:1px; color:var(--fuel-amber); margin-bottom:4px;}
  #caption-text{ color:var(--white); font-weight:700; font-size:clamp(16px,3.4vw,20px); }

  .overlay{
    position:absolute; inset:0; z-index:30;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; gap:16px; padding:24px;
    background:radial-gradient(ellipse at center, rgba(20,26,72,0.92) 0%, rgba(7,10,34,0.97) 78%);
  }
  .hidden{ display:none !important; }
  .overlay h1{ color:var(--white); font-size:clamp(24px,6vw,38px); margin:0; }
  .overlay p.sub{ color:#C7CFF2; font-size:clamp(14px,3vw,17px); max-width:420px; margin:0; line-height:1.5; }
  .big-btn{
    font-family:inherit; font-size:22px; font-weight:800; color:#08340C;
    background:linear-gradient(180deg,#9BEE6E,var(--astro-green) 60%,var(--astro-green-dark));
    border:none; border-radius:999px; padding:16px 44px; cursor:pointer;
    box-shadow:0 6px 0 #2F6B1B, 0 10px 18px rgba(0,0,0,0.35);
  }
  .big-btn:active{ transform:translateY(4px); box-shadow:0 2px 0 #2F6B1B; }
  .ghost-btn{
    font-family:inherit; font-size:15px; font-weight:700; color:var(--ui-cyan);
    background:transparent; border:2px solid rgba(95,217,232,0.5); border-radius:999px; padding:10px 22px; cursor:pointer;
  }

  #particles-layer{ position:absolute; inset:0; pointer-events:none; z-index:25; overflow:hidden; }
  .confetti{ position:absolute; width:8px; height:8px; border-radius:2px; top:0; left:0; }
</style>
</head>

  <div id="mission-bar">
    <div id="mission-icon">🔍</div>
    <div id="mission-text">Astro wants to meet someone. Find Alex!</div>
    <button class="mission-btn" id="mission-hear">🔊</button>
  </div>
  <div id="found-badge">Found: 0/6</div>

  <div id="caption-bar">
    <div id="caption-speaker">ASTRO</div>
    <div id="caption-text">Hello!</div>
  </div>

  <div id="particles-layer"></div>

  <div class="overlay" id="start-overlay">
    <h1>Astro's Earth Mission</h1>
    <p class="sub">Help Astro explore Earth! Drag or tap to walk. Follow each mission to meet Alex and discover Earth together.</p>
    <button class="big-btn" id="start-btn">START</button>
  </div>

  <div class="overlay hidden" id="end-overlay">
    <h1>Mission Complete! 🌟</h1>
    <p class="sub">Astro explored Earth and made a new friend!</p>
    <button class="big-btn" id="continue-btn">CONTINUE</button>
    <button class="ghost-btn" id="replay-btn">Play Again</button>
  </div>

<script>
(function(){
  "use strict";
  function boot(){

    function speakFallback(text){
      try{
        if('speechSynthesis' in window){
          window.speechSynthesis.cancel();
          var u = new SpeechSynthesisUtterance(text);
          u.rate = 0.86; u.pitch = 1.0; u.lang = 'en-US';
          window.speechSynthesis.speak(u);
        }
      }catch(e){}
    }
    function speakWord(text, audioName){
      var done=false;
      if(audioName){
        var a = new Audio(audioName);
        a.oncanplaythrough=function(){ if(!done){done=true;a.play();} };
        a.onerror=function(){ if(!done){done=true;speakFallback(text);} };
        a.load();
        setTimeout(function(){ if(!done){done=true;speakFallback(text);} },700);
      } else { speakFallback(text); }
    }
    var AudioCtx = window.AudioContext || window.webkitAudioContext;
    var actx=null;
    function tone(freq,dur,type,vol){
      try{
        if(!actx) actx=new AudioCtx();
        var o=actx.createOscillator(), g=actx.createGain();
        o.type=type||'sine'; o.frequency.value=freq; g.gain.value=vol!=null?vol:0.15;
        o.connect(g); g.connect(actx.destination);
        var now=actx.currentTime;
        g.gain.setValueAtTime(g.gain.value,now);
        g.gain.exponentialRampToValueAtTime(0.001,now+dur);
        o.start(now); o.stop(now+dur);
      }catch(e){}
    }
    function sfxSuccess(){ [523,659,784,1047].forEach(function(f,i){ setTimeout(function(){tone(f,0.26,'triangle',0.16);},i*100); }); }

    var container = document.getElementById('game-container');
    var astro = document.getElementById('astro');
    var W=0,H=0;
    function resize(){ var r = container.getBoundingClientRect(); W = r.width; H = r.height; }
    window.addEventListener('resize', resize); resize();

    var MISSION_DEFS = {
      alex: {
        mission:'Astro wants to meet someone. Find Alex!',
        el: document.getElementById('alex-spot'),
        reactions:[
          { speaker:'ASTRO', text:'Hello!' },
          { speaker:'ALEX', text:'Hi! What\u2019s your name?' },
          { speaker:'ASTRO', text:'My name is Astro. Nice to meet you!' }
        ]
      },
      house: {
        mission:'Where does Alex live? Find the house!',
        el: document.getElementById('house'),
        reactions:[
          { speaker:'ASTRO', text:'Where do you live?' },
          { speaker:'ALEX', text:'I live here!' }
        ]
      },
      ball: {
        mission:'What does Alex like? Find the ball!',
        el: document.getElementById('ball'),
        reactions:[
          { speaker:'ALEX', text:'I like playing ball!' },
          { speaker:'ASTRO', text:'I like it too!' }
        ]
      },
      dog: {
        mission:'Astro made a new friend! Find the dog!',
        el: document.getElementById('dog'),
        reactions:[
          { speaker:'ALEX', text:'This is my dog!' },
          { speaker:'ASTRO', text:'A new friend! Woof, woof!' }
        ]
      },
      bag: {
        mission:"What's this? Find the bag!",
        el: document.getElementById('bag'),
        reactions:[
          { speaker:'ASTRO', text:"What's this?" },
          { speaker:'ALEX', text:"It's my bag!" }
        ]
      },
      spaceship: {
        mission:'It\u2019s time to say goodbye for now. Find Astro\u2019s spaceship!',
        el: document.getElementById('spaceship'),
        reactions:[
          { speaker:'ASTRO', text:'Goodbye for now, Alex!' },
          { speaker:'ALEX', text:'Goodbye, Astro! See you soon!' }
        ]
      }
    };

    var missionQueue = [];
    var currentKey = null;
    var foundCount = 0;
    var TOTAL = 6;

    function shuffle(arr){
      var a = arr.slice();
      for(var i=a.length-1;i>0;i--){
        var j = Math.floor(Math.random()*(i+1));
        var t=a[i]; a[i]=a[j]; a[j]=t;
      }
      return a;
    }
    function buildQueue(){
      var middle = shuffle(['house','ball','dog','bag']);
      return ['alex'].concat(middle, ['spaceship']);
    }

    function loadMission(key){
      currentKey = key;
      var def = MISSION_DEFS[key];
      document.getElementById('mission-text').textContent = def.mission;
      speakWord(def.mission, null);
    }

    document.getElementById('mission-hear').addEventListener('click', function(){
      if(currentKey) speakWord(MISSION_DEFS[currentKey].mission, null);
    });

    var pos = { x:0, y:0 };
    var target = { x:0, y:0 };
    var dragging = false;
    var running = false;
    var busy = false;

    function scenePercent(el){
      var r = el.getBoundingClientRect();
      var cr = container.getBoundingClientRect();
      return { x:(r.left-cr.left)+r.width/2, y:(r.top-cr.top)+r.height*0.85 };
    }
    function pointerLocal(e){
      var rect = container.getBoundingClientRect();
      var clientX = (e.touches && e.touches[0]) ? e.touches[0].clientX : e.clientX;
      var clientY = (e.touches && e.touches[0]) ? e.touches[0].clientY : e.clientY;
      return { x: clientX-rect.left, y: clientY-rect.top };
    }
    container.addEventListener('pointerdown', function(e){
      if(!running || busy) return;
      if(e.target.closest('#mission-bar') || e.target.closest('#found-badge')) return;
      dragging = true;
      var p = pointerLocal(e);
      target.x = p.x; target.y = clamp(p.y, H*0.45, H*0.99);
    });
    container.addEventListener('pointermove', function(e){
      if(!dragging || busy) return;
      var p = pointerLocal(e);
      target.x = p.x; target.y = clamp(p.y, H*0.45, H*0.99);
    });
    window.addEventListener('pointerup', function(){ dragging=false; });
    container.addEventListener('touchmove', function(e){ e.preventDefault(); }, {passive:false});

    function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
    function lerp(a,b,t){ return a+(b-a)*t; }

    function loop(){
      if(running && !busy){
        var dx=target.x-pos.x, dy=target.y-pos.y;
        var dist=Math.sqrt(dx*dx+dy*dy);
        astro.classList.toggle('walking', dist>3);
        pos.x = lerp(pos.x, target.x, 0.08);
        pos.y = lerp(pos.y, target.y, 0.08);
        astro.style.left = pos.x+'px';
        astro.style.top = pos.y+'px';

        if(currentKey){
          var def = MISSION_DEFS[currentKey];
          var c = scenePercent(def.el);
          var ddx=c.x-pos.x, ddy=c.y-pos.y;
          var d = Math.sqrt(ddx*ddx+ddy*ddy);
          if(d < 50){
            reachMission(currentKey);
          }
        }
      } else {
        astro.classList.remove('walking');
      }
      requestAnimationFrame(loop);
    }

    function reachMission(key){
      busy = true;
      var def = MISSION_DEFS[key];
      def.el.classList.add('reacting');
      confettiBurst(scenePercent(def.el));
      sfxSuccess();
      playReactions(def.reactions, 0, function(){
        def.el.classList.remove('reacting');
        def.el.classList.add('done');
        foundCount++;
        document.getElementById('found-badge').textContent = 'Found: '+foundCount+'/'+TOTAL;
        currentKey = null;
        busy = false;
        setTimeout(function(){
          if(missionQueue.length === 0){ finishGame(); }
          else { loadMission(missionQueue.shift()); }
        }, 500);
      });
    }

    function playReactions(lines, idx, onDone){
      if(idx >= lines.length){ hideCaption(); onDone(); return; }
      var line = lines[idx];
      showCaption(line.speaker, line.text);
      speakWord(line.text, null);
      setTimeout(function(){ playReactions(lines, idx+1, onDone); }, 1650);
    }
    function showCaption(speaker, text){
      document.getElementById('caption-speaker').textContent = speaker;
      document.getElementById('caption-text').textContent = text;
      document.getElementById('caption-bar').classList.add('show');
    }
    function hideCaption(){
      document.getElementById('caption-bar').classList.remove('show');
    }

    function confettiBurst(p){
      var layer = document.getElementById('particles-layer');
      var colors = ['#FFC93C','#7ED957','#5FD9E8','#F4F7FF'];
      for(var i=0;i<16;i++){
        var el = document.createElement('div');
        el.className='confetti';
        el.style.background = colors[i%colors.length];
        el.style.left = p.x+'px'; el.style.top = p.y+'px';
        layer.appendChild(el);
        var ang = Math.random()*Math.PI*2;
        var dist = 40+Math.random()*60;
        var dx = Math.cos(ang)*dist, dy = Math.sin(ang)*dist - 26;
        el.animate([
          { transform:'translate(0,0) rotate(0deg)', opacity:1 },
          { transform:'translate('+dx+'px,'+dy+'px) rotate('+(Math.random()*360)+'deg)', opacity:0 }
        ], { duration:650+Math.random()*250, easing:'ease-out' });
        setTimeout(function(el2){ return function(){ el2.remove(); }; }(el), 1000);
      }
    }

    function finishGame(){
      running = false;
      document.getElementById('end-overlay').classList.remove('hidden');
    }

    document.getElementById('start-btn').addEventListener('click', function(){
      document.getElementById('start-overlay').classList.add('hidden');
      beginPlaythrough();
    });
    document.getElementById('replay-btn').addEventListener('click', function(){
      document.getElementById('end-overlay').classList.add('hidden');
      beginPlaythrough();
    });
    document.getElementById('continue-btn').addEventListener('click', function(){
      window.dispatchEvent(new CustomEvent('astroGame3Complete'));
      try{ window.parent.postMessage({type:'astroGame3Complete'}, '*'); }catch(e){}
    });

    function beginPlaythrough(){
      resize();
      Object.keys(MISSION_DEFS).forEach(function(k){
        MISSION_DEFS[k].el.classList.remove('done','reacting');
      });
      hideCaption();
      pos.x = W*0.5; pos.y = H*0.85;
      target.x = pos.x; target.y = pos.y;
      astro.style.left = pos.x+'px'; astro.style.top = pos.y+'px';
      foundCount = 0;
      document.getElementById('found-badge').textContent = 'Found: 0/'+TOTAL;
      missionQueue = buildQueue();
      running = true;
      busy = false;
      loadMission(missionQueue.shift());
    }

    requestAnimationFrame(loop);
  }
  if(document.readyState === "loading"){
    document.addEventListener("DOMContentLoaded", boot);
  } else {
    boot();
  }
})();
</script>
</body>
</html>
